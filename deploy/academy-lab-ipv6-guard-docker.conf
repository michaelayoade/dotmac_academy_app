[Unit]
Wants=academy-lab-ipv6-guard.service
After=academy-lab-ipv6-guard.service

[Service]
ExecStartPre=/usr/bin/systemctl --quiet is-active academy-lab-ipv6-guard.service
ExecStartPre=/usr/sbin/nft list chain inet academy_lab_ipv6_guard prerouting
ExecStartPre=/usr/sbin/nft list chain inet academy_lab_ipv6_guard input
