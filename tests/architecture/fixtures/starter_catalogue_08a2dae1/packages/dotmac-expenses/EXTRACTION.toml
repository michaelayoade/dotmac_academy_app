first_cutover = "dotmac_erp is the qualifying source and first exact-pin adopter. ERP installs the released lineage locally, backfills and shadows categories, policy revisions/rules, requests, claims, lines, receipt metadata, lifecycle and evaluation evidence while the legacy path remains sole writer, then performs one explicitly authorized switch and retires the old writers. Backoffice is a later independent consumer of that proven release."
shadow_and_drift = "Compare tenant counts and stable references plus requester/claimant, status, claimed/approved totals, category, receipt completeness, exact policy revision/rule outcome and reimbursement eligibility. Report missing, extra and conflicting rows. Shadow reads never write either owner."
local_copy_retirement = "After the sealed switch, two-directional ratchets reach zero for ERP category/claim/line/receipt-policy/limit/lifecycle writers and CRM/Sub request/line writers plus ERP-state mirrors. Finance handoff, compatibility reads and audit export have separate ratchets. A row deletion or a remote-status mirror is never authority-cutover evidence."
next_action = "Run the package architecture/unit/PostgreSQL canaries on Observer from an exact committed branch revision, then check in ERP's exact kernel/module pins plus its versioned backfill/shadow/cutover adapter. Keep Backoffice uncomposed until ERP proves the first adoption."

