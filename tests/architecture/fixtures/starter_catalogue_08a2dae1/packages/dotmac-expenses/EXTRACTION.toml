composition_boundary = "Each adopter pins the released package, installs the ex lineage in its own database and supplies product adapters for approvals, stored files, numbering and Finance. The module imports only dotmac-kernel, never an assembly, product ORM or sibling module. Independent applications synchronize typed commands and observations; none shares the module's rows."
