authority_boundary = "dotmac-publishing owns only local publication intent, immutable release snapshots, target selection by opaque reference, attempts, normalized observations and derived aggregate state. Content/sites own editable sources. Backoffice owns authorization and target-selection policy. Kernel owns idempotency and the transactional outbox. A typed timer port wakes due releases. Integrator owns installations, bindings, credentials, provider identity, connector execution, webhook/polling, retry/checkpoints and raw transport evidence. Modules do not import siblings and applications do not share databases or writers."
inventory_evidence = [
  "docs/inventories/marketing-suite-sources.md",
  "docs/inventories/publishing-extraction-dossier.md",
  "docs/inventories/publishing-writer-retirement.toml",
]
first_cutover = "The Dotmac ERP product is cutover 1. It must pin a released dotmac-publishing version, compose and migrate its own tenant plane, totally classify Mkt Post/PostDelivery/Channel publication facts, backfill immutable snapshots and outcome history, shadow one complete scheduling cycle, switch one writer at a time and retire the old Mkt/provider path. Installation without writer retirement is not adoption. Sub is a later independent adopter with its own rows and lineage."
shadow_and_drift = "For every classified Mkt Post and PostDelivery, compare snapshot digest, requested delivery time, distinct target selection, content-variant disposition, attempt order, normalized outcome, bounded error, opaque remote reference and derived aggregate state. Preserve partial and all-failed evidence instead of collapsing it. Classify provider credentials/adapters into Integrator and editable title/body/assets into content with no default bucket. Reconcile for a complete scheduled-publication cycle and require zero unexplained mismatch before any writer switch."
local_copy_retirement = "Apply the ten-row two-directional ledger in docs/inventories/publishing-writer-retirement.toml. Retire Mkt publishing fields, PostDelivery writers, replacement/reschedule service, direct publish/update/delete calls and the 60-second SessionLocal poller only after their named module behavior is authoritative. Move Channel credentials/provider clients into Integrator and replace direct-query/commit web paths with thin Backoffice adapters. A runtime flag leaving both writers callable is not retirement."
next_action = "Michael authorized release on 2026-08-20 without authorizing adoption, and the release is complete: kernel a81 and publishing 0.1.0a1 are registry-verified and tagged from the exact protected-main commit. Publication moved neither adoption nor the transport boundary. Backoffice remains cutover 1, has not composed the module, every PUB-R row remains not-started, and Integrator still owns provider transport; do not claim adoption until the total classifier, shadow cycle, writer switches and retirement gates pass."

