  "the jsonp(...) wrapper unwrapped, with bare JSON also accepted (client.py:170-192)",
  "statuscode 025 as the only success code (client.py:269-278)",
  "demo.remita.net / login.remita.net selected by environment (client.py:22-23, 93)",
]

port_deltas = [
  "orderId is the PRODUCT's stable opaque string, not a fresh uuid4 per call (rrr_service.py:136) — a retry must not mint a second reference for one obligation",
  "021 duplicate order is RECONCILIATION_REQUIRED, not the generic error ERP raises for every non-025 code (client.py:283-290) — a reference exists and must be found, not retried and not dead-lettered",
  "025 with no RRR field is RECONCILIATION_REQUIRED, not the unguarded KeyError at client.py:275 on the far side of a provider effect",
  "a connect failure is retryable and every later transport failure is ambiguous; ERP has no retry classification and no retry at all",
  "the currency is declared by the installation and stated by the command, and a mismatch is refused; ERP assumes naira by omission",
  "the amount is exact Decimal quantized to the exponent the product declares, refused rather than rounded when it does not fit; ERP hardcodes f\"{amount:.2f}\"",
  "no provider call during validate_connection: the only issuance call there is MINTS a reference",
]

provider_idempotency = "NONE. Remita accepts no Idempotency-Key or X-Idempotency-Key header; verified by inventory across dotmac_erp and dotmac_sub. Its only natural key is orderId, answered with statuscode 021 when reused. The connector therefore carries the product's orderId verbatim and mints nothing; the engine's DispatchRequest.idempotency_key remains the at-most-once record in dotmac_kernel.idempotency and is not sent, because there is nowhere to send it."

# ── ADR-0024 §§ 8-9 (2026-08-24): one contract per act, and parity is measured
# against Dotmac's capabilities ──────────────────────────────────────────────
#
# `payments.reference.issuance.v1` is a genuinely distinct business act — asking
# a biller to MINT a payment reference — and not a provider-shaped alias of
# `payments.intent.v1`. It keeps its own id for that reason, not because Remita
# has an endpoint called paymentinit.
#
# DIVERGENCE, recorded so the doc is actionable (ADR-0061 § 4 D3). This
# connector's command payload matches dotmac-connector-flutterwave's family and
# NOT dotmac-connector-paystack's: flat and per-capability rather than an
# `{"action", "params"}` envelope, a PRODUCT-minted reference (`orderId`,
# carried verbatim — the connector mints nothing), and a REQUIRED
# `currency_minor_units` exponent supplied by the product from
# dotmac_kernel.money. Paystack derives its reference and refuses an exponent.
# Whichever payload the declared `payments.payout.v1` contract ends up taking
# (ADR-0061 § 5 step 1), this connector's issuance capability adopts the same
# conventions for reference and money, so a product reads one set of rules
# across every payment connector rather than one per binding.
#
# Remita's absent idempotency header is NOT a divergence to close: it is a
# provider fact, and `orderId` being the only natural key is why an ambiguous
# `paymentinit` is classified reconciliation-required instead of retried. Under
# ADR-0061 § 1 that classification is a transport statement; whether to ask
# again is the product owner's decision.

