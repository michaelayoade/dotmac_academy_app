# ERP ships NO test for the issuance hash — `grep -rl remita tests/` in
# dotmac_erp returns only `test_dependency_health.py`, which monkeypatches the
# health probe away. So there was no parity test to port, and the ordering
# proofs in `test_remita_outbound.py` are written here for the first time:
# a golden vector, an adjacent-swap permutation proof, and a proof that the
# issuance order is NOT the status order. Recorded because "ported with its
# parity tests" would be false otherwise.
