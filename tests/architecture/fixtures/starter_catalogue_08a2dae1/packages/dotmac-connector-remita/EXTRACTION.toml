owner = "Remita transport: authenticated RRR ISSUANCE and RRR status polling, provider response parsing, provider-neutral status observation translation, and typed outbound outcome classification."

contract = "Implement dotmac-integration SPI >=1.4,<2.0 for connector key remita: capability payments.reference.status.observation.v1 in POLL mode, and payments.reference.issuance.v1 in DELIVERY mode. Issuance authenticates with the provider SHA-512 contract sha512(merchantId + serviceTypeId + orderId + amount + apiKey), posts the seven-field paymentinit body, carries the product-minted orderId verbatim, and returns the minted RRR as Outcome.provider_reference on every outcome. Carry provider status, message, amount, reference, transaction and date evidence verbatim. Own no RRR lifecycle, biller policy, payment-state mapping, source linkage, tenant, product identity, ledger, journal, checkpoint, retry engine, session or product database."

