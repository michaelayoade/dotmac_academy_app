first_cutover = "ERP RRR status observations through dotmac_integrator. Run the Integrator poll beside ERP's status refresh and compare the provider reference, status, amount, transaction id and payment date while ERP remains the only writer of RRR and accounting state."

shadow_and_drift = "For every configured reference compare authenticated provider responses and the ERP-recorded source evidence. Require stable event identity for an unchanged response, one new observation for each changed provider fact, and no unexplained field drift. Provider status codes are compared verbatim because ERP's current status comments disagree with the provider's current contract."

local_copy_retirement = "Delete ERP's Remita status HTTP transport, provider credential reader and polling schedule after cutover, lowering the external-connector ratchet in the same change. ERP keeps RRR intent and lifecycle, biller/service selection, source linkage, payment decisions and every accounting consequence."

