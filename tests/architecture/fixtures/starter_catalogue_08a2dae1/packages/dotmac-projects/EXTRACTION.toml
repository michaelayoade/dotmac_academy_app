composition_boundary = "ADR-0024 and ADR-0051: every adopter installs its own pj lineage and owns only its local project rows. Applications share a released contract, never a mod_projects schema or database. Products own project subject links and consequences through typed ports; dotmac-projects contains no subscriber, customer, lead, quote, sales-order, buildout, work-order, ticket, cost-centre, business-unit, region, project-type, provider, or connector column. Actor and assignee identifiers are opaque UUIDs with no product identity foreign key. A product-owned link may reference a module project only through its local lineage and service validation; the module imports neither the assembly nor another module."
inventory_evidence = [
  "docs/inventories/projects-sources.md",
  "docs/adr/0051-projects-own-work-structure-not-product-consequences.md",
  "docs/inventories/fleet-decomposition-matrix.md",
]
first_cutover = "dotmac_sub is cutover 1 because it is the only source with a named project-lifecycle owner, focused behavior tests, stale-state commands, dependency-cycle and completion guards, a transactional event/audit boundary, and an authoritative checked-in SOT. First move the product-neutral project/task/template/dependency rows and lifecycle decisions into mod_projects while Sub retains product links and every ISP consequence in its own owner services. dotmac_erp follows only after Sub's authority switch, mapping PLANNING/ACTIVE/ON_HOLD/COMPLETED/CANCELLED and OPEN/IN_PROGRESS/PENDING_REVIEW/COMPLETED/CANCELLED/ON_HOLD into the module vocabulary while retaining finance, costing, resources, milestones and time entry outside the module."
shadow_and_drift = "Sub shadows every owner command against the module in the same transaction and records typed differences for status, task hierarchy, dependency sets, template-instantiated tasks, calculated dates and assignee membership. Expected port deltas are explicit: legacy template services commit internally; template scheduling ignores dependency type and lag; several product tables lack tenant_id/RLS because Sub is currently single deployment scoped. Imported CRM UUIDs remain migration identity only. Cutover requires zero unexplained differences, a cross-tenant Postgres canary, a sealed one-writer switch, and product-owned consequence adapters proven against the module event/output contract. ERP then runs the same comparison with an explicit status mapping and treats its untested PM web mutations as requirements, not parity proof."
local_copy_retirement = "After Sub cutover, retire its Project/ProjectTask/ProjectTemplate/ProjectTemplateTask/ProjectTaskDependency/ProjectTemplateTaskDependency/ProjectTaskAssignee persistence and the corresponding generic lifecycle, hierarchy, dependency, scheduling and assignment writers in app/services/projects.py. Keep and rebind subscriber/lead/quote/order links, fiber stage policy, vendor assignment, work-order handoff, SLA, notification, cost and list-projection owners. CRM's already-consolidated project writer and tables are retirement evidence, not a third owner. ERP later retires core_org.project plus the overlapping pm task/template/dependency owner paths only after finance, milestones, resource allocation, time entry and project expense links have product-owned replacement relations. Two-directional caller/model/table ratchets reach zero before either local owner is declared retired."
next_action = "Validate this audit-complete package on Observer, then land Sub's expand migration and typed adapter as the first adoption slice. Do not add routers, product status reasons, project types, numbering, SLA, notification, work-order or finance behavior before that adopter demands the surface and brings parity tests."

