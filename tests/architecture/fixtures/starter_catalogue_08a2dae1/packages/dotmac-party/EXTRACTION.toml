composition_boundary = "Each application owns its own runtime, database, migration, sessions, authorization and local Party rows. An adopter pins one exact release, binds party_person_catalog.v1 to its local kernel Party provider, declares its open Party vocabularies, and runs the pt lineage in its own tenant database. Applications synchronize only typed observations/correlations through versioned APIs or webhooks; installing the same package never creates a shared customer directory."
inventory_evidence = ["docs/inventories/party-module-sources.md"]
first_cutover = "Sub remains the qualifying source and first cutover. Before composition it must complete the reviewed Party backfill and the reader cutovers currently marked pending in PARTY_ROLE_RELATIONSHIP_SOT.md. Shadow compares roles, role relationships, memberships, contact points, consent/verification, and external references. One sealed switch makes the released module the sole writer and retires app.services.party for the transferred facts; kernel Party identity and product account writers remain."
shadow_and_drift = "Backfill is additive, nullable, provenance-carrying, and digest-bound. Compare missing, extra, conflicting and stale rows; role status/windows/keys; role-to-role relationship endpoints; membership type/status/scope; contact normalization/provider identity/primary/verification/consent; and external-reference ownership. Shadow is read-only and never infers identity from shared email, phone, address, name, reseller owner, or social handle."
local_copy_retirement = "At cutover the Sub writer ratchet reaches zero for party_roles, party_relationships, party_memberships, party_contact_points and party_external_references, including direct ORM writes, routes, jobs, imports and compatibility fallbacks. CRM's PersonChannel and OrganizationMembership facts and ERP's Person/Customer contact and external-reference facts are legacy requirement inputs, not second sources: each drains with its product or migrates through a named product adapter, and none may survive as contact-point, membership or external-reference writers. Legacy contact/organization/principal projections retire only after their separately named domain readers consume the module and reconciliation is green. public.parties remains kernel-owned and is not retired by this package."
next_action = "Keep unreleased. Validate the candidate on Observer, update Sub's party relationship target from party-to-party to exact PartyRole endpoints, finish Sub's reviewed backfill and reader cutovers, then prepare one exact-release shadow and sealed writer switch. Backoffice remains only a candidate second consumer until it has a real Party-context demand."

