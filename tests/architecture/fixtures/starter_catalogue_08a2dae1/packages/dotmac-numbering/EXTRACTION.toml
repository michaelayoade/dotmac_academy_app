composition_boundary = "ADR-0024: each adopter installs its own nu lineage and owns its own series configuration, counters and receipts. Applications share the package contract, never a mod_numbering schema, a counter row or a receipt table. ADR-0023: tables (tenant, tenant_id NOT NULL, FORCE RLS) and platform_tables (no tenant column, REVOKEd from the tenant app role) are declared, not inferred; no foreign key crosses the planes and there is no nullable tenant_id, sentinel tenant or polymorphic scope column. series_code is an open registered string, never a closed enum; no product vocabulary (invoice_number, project_number, SequenceType members) enters the module. The module performs no settings lookup and reads no clock: configuration is passed in and reference_date is a required business input."
