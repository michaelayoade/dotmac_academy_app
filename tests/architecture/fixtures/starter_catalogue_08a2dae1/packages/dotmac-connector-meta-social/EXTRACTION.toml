first_cutover = "Sub is cutover 1 through dotmac_integrator, ingress first and outbound second. Exact-pin the released connector beside dotmac-integration 0.1.0a14, reconcile Sub's authenticated messaging.receive.v1 and messaging.send.v1 ProductPort descriptors, then mirror the same Meta request and the same outbound command while Sub's direct receiver and local Graph outbox remain authoritative. Publication and package conformance alone do not make either repository a contract consumer."

shadow_and_drift = "INGRESS: mirror exact raw bytes and the signature header into Integrator and compare provider event identity, count, event type, channel, account scope, timestamps, text, attachments and comment thread references for the provider retry horizon. DELIVERY: shadow each outbound command by comparing the composed Graph host, path and JSON body against Sub's own runtime for the same command, and compare the resulting outcome class and provider message reference — never Sub's product consequences, which the connector cannot express. Duplicate sends are prevented by the module's idempotency ledger, not by the connector, so shadow mode composes the call without issuing it until the corpus agrees. Cut over the provider callback and then the outbox only after parity, and lower Sub's external-connector ratchet in the same change that removes the displaced surface."

local_copy_retirement = "Retire Sub's and CRM's Meta webhook signature, challenge and payload traversal surfaces after the ingress cutover, and Sub's meta_social_runtime send path plus meta_pages comment-reply adapters after the outbound cutover. Sub retains everything the connector deliberately does not own: the reply-window decision (team_inbox_reply_window.decide_reply_window and the notification preflight), the comment-target validation in app/tasks/notifications.py, Team Inbox routing, threading, assignment, contact/profile enrichment and timeline consequences. CRM is retired and never becomes a connector consumer."

next_action = "OUTBOUND SLICE DECLARED AS 0.1.0a2, NOT YET RELEASED. The version is bumped and the exact published a1 ingress manifest is retained as INGRESS_MANIFEST, so an installation adopted against the a1 digest (61b5ba0e929bec924af4a338408a10db1035efef1589b7abaaf3152586b734e4, recorded in docs/inventories/released-manifest-digests.json) still resolves. Publish 0.1.0a2, then exact-pin the release in dotmac_integrator beside dotmac-integration 0.1.0a14 and run the shadow described above. Keep status audit-complete until a cutover retires a direct Sub transport."

[[ported]]
name = "direct-message-wire-shapes"
source = "dotmac_sub:app/services/integrations/connectors/meta_social_runtime.py"
detail = "Per-channel endpoint, credential binding and payload encoding, exactly as production computes them: Messenger posts a structured recipient/message object with messaging_type RESPONSE to graph.facebook.com/{v}/{page_id}/messages; Instagram Login posts compact JSON STRINGS to graph.instagram.com/{v}/me/messages; shared OAuth moves both channels onto graph.facebook.com/{v}/{account_id}/messages under one credential. The provider_account_not_bound binding check is ported unchanged."

[[ported]]
name = "comment-reply-wire-shapes"
source = "dotmac_sub:app/services/meta_pages.py"
detail = "reply_to_comment_sync posts to {parent_comment_id}/comments and reply_to_instagram_comment_sync to {parent_comment_id}/replies, both with a single `message` field and both against graph.facebook.com. The two edges are not interchangeable and are ported as two distinct calls."

[[ported]]
name = "provider-receipt-normalization"
source = "dotmac_sub:app/services/integrations/connectors/meta_social_runtime.py"
detail = "_safe_receipt's identity rule — message_id for direct messages, id for comment replies — becomes Outcome.provider_reference, and a 2xx without one becomes RECONCILIATION_REQUIRED rather than a recorded success. This matches how the ingress half and the WhatsApp connector already treat a receipt: a bounded reference, never a response body."

[[ported]]
name = "outcome-classification"
source = "dotmac_sub:app/services/integrations/connectors/meta_social_runtime.py, app/tasks/notifications.py"
detail = "Sub's four-way split is preserved: 429/5xx retryable, 4xx rejected, ConnectTimeout retryable, a timeout after the request started reconciliation_required, and a success with no message id reconciliation_required. Sub's _safe_provider_failure classified the window refusal and rate limits by matching provider PROSE; the connector classifies the numeric Graph error code and subcode instead, because prose is unstable, locale-dependent and quotes the outbound content back."

[[not_ported]]
name = "reply-window-and-response-permission"
reason = "Sub owns it. team_inbox_reply_window.decide_reply_window and _preflight_team_inbox_meta_window decide whether a free-form reply may be sent at all; the connector performs the wire operation only. Implementing that arithmetic here would create a second authority whose clock and inbound history are both stale, and would refuse sends the product had already authorized. A provider's own window refusal is still CLASSIFIED here, which is a different act: reporting what came back, not deciding what may go out."

[[not_ported]]
name = "comment-target-validation"
reason = "Sub owns it. _meta_comment_target_validation_error checks that a public reply targets an inbound comment on the same account, post, media and root thread. Those are product facts held in Sub's inbox. The connector refuses only what it can see: a missing or unaddressable parent comment id, terminally, before any call."

[[not_ported]]
name = "contact-profile-lookup"
reason = "Named consumer, no SPI seam. Sub's fetch_contact_profile feeds one real local projection — the Team Inbox contact display name and metadata.contact_profile written in app/api/meta_inbox_webhooks.py — so the consumer is not hypothetical. But the delivery contract returns an Outcome, which carries status, a bounded provider reference and an HTTP status and deliberately no result body, while the poll contract returns InboundEvents on the ENGINE's schedule and cannot express an on-demand read for one contact id. A profile lookup therefore has nowhere to return a profile. Adding it as a send action would burn a real Graph call and discard the answer. It needs an SPI capability that returns typed observations for an on-demand request; until that exists, Sub keeps the lookup."

[[not_ported]]
name = "preview-dry-run"
reason = "Sub's send_direct_message accepts preview=true and returns the composed payload without contacting Meta. Outcome has no field for a rendered payload, and returning SUCCEEDED for a command that never left the process would mark the delivery delivered. Shadow comparison covers the same need through the engine, which is where a dry run belongs."

[[not_ported]]
name = "connection-probe-and-health"
reason = "Sub's MetaSocialRuntimeRunner.validate performs live Graph GETs to prove each bound account and credential. validate_connection here checks declared material and configuration shape only; a network probe belongs to the Integrator's health surface, which owns scheduling and result retention, and a plugin that probes on validation makes enablement depend on provider availability."

