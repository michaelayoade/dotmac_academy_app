owner = "Meta Social protocol edge, both directions: Facebook and Instagram subscription challenge, exact-byte signature verification, provider event identity, message/comment normalization, acknowledgement bytes — and, outbound, Messenger/Instagram Direct send and Facebook/Instagram comment-reply wire translation, one Graph call per product-decided command, provider receipt extraction, and Graph error-code classification into typed outcomes."

contract = "Implement dotmac-integration SPI >=1.4,<2.0 for connector key meta_social with messaging.receive.v1 in INGRESS mode and messaging.send.v1 in DELIVERY mode. INGRESS receives immutable request bytes and already-materialized declared secret material, and emits one provider-neutral fact per Meta message/comment or record-only transport evidence. DELIVERY receives a product-decided send_direct_message or reply_to_comment command plus materialized access material, performs only Graph wire translation and one call, and returns a typed Outcome carrying status, the bounded provider message reference and the numeric HTTP status. The connector owns no rows, sessions, retries, checkpoints, product identity, messaging-window decision, permission to respond, destination decision, conversation state, tickets, subscriber state or HTTP status."

