# ── ADR-0024 § 8 (2026-08-24): `messaging.send.v1` is ONE contract, and the two
# connectors behind it do not yet take the same command ─────────────────────
#
# Declaring the shared id rather than minting a per-connector one is CORRECT and
# is the shape ADR-0061 § 3 points at for payments: `meta_whatsapp` and
# `meta_social` both serve `messaging.send.v1`, so a product declares one
# outbound messaging port and the Integrator binds a provider to it.
#
# DIVERGENCE, recorded because the id alone does not make them interchangeable:
#
#   meta_whatsapp   action `send_text | send_template | send_media`,
#                   recipient param `recipient`
#   meta_social     action `send_direct_message | reply_to_comment`,
#                   recipient param `recipient_id` plus a required `channel`
#
# A product bound to one cannot be re-bound to the other without changing the
# command it builds — which is a provider branch relocated into the product,
# forbidden by ADR-0024 § 8.1/8.2. `reply_to_comment` is a genuinely different
# act and may well deserve its own contract; a direct message is not.
#
# The root cause is not either connector: nothing in the SPI or the registry
# declares a COMMAND schema at all, so nothing could have caught the drift
# (ADR-0024 § 8.4).
#
# CORRECTED 2026-08-24. The sentence that followed here read:
#
#   "Closure is a declared command payload for `messaging.send.v1` on the SPI,
#   then both connectors accepting it."
#
# Two things in it are wrong. (1) The schema does not go on the SPI's
# `CapabilityDeclaration`: a schema published per connector makes drift
# machine-readable rather than prevented. It belongs to the business-owned
# `capability_registry.CapabilityContract` — `command_schema`, `result_schema`,
# `observation_schema`, a canonical digest and deprecation/replacement metadata
# — and a connector declaration may only CLAIM that digest (ADR-0024 § 10,
# ADR-0061 A2). (2) `messaging.send.v1` is PUBLISHED, so converging the two
# dialects under it would redefine a published contract version. That is
# forbidden; the repair is SUCCESSION (ADR-0024 § 11, ADR-0061 A4):
#
#   messaging.direct.send.v2   provider-neutral DIRECT delivery with a
#                              DISCRIMINATED text/template/media content shape.
#                              This is the successor that replaces the disjoint
#                              send_text|send_template|send_media and
#                              send_direct_message vocabularies at once.
#   social.comment.reply.v1    public Facebook/Instagram comment consequences —
#                              a different business act from a direct message,
#                              and always was.
#   social.profile.read.v1     caller-initiated profile OBSERVATION through a
#                              REQUEST mode. ConnectorMode is a CLOSED union of
#                              INGRESS|POLL|DELIVERY today, so this one is
#                              blocked on an SPI mode that does not exist.
#
# Sub migrates to the successors; `messaging.send.v1` is retained for a BOUNDED
# compatibility window and then RETIRED, and both the migration and the
# retirement are obligations carried by the old contract's deprecation metadata
# rather than intentions. Tracked as the reopened open question in
# packages/dotmac-integration/EXTRACTION.toml.
#
# FOR THIS CONNECTOR: its outbound surface splits across TWO successors.
# `send_direct_message` succeeds to `messaging.direct.send.v2`;
# `reply_to_comment` — which the note above already suspected "may well deserve
# its own contract" — succeeds to `social.comment.reply.v1`, and that is now the
# decision rather than a suspicion. The `channel` param stops being a
# product-supplied discriminator between Messenger and Instagram Direct: which
# Graph edge a bound account uses is a connector-internal fact, not a field a
# product fills in. The withheld contact-profile lookup recorded under
# [[not_ported]] below is `social.profile.read.v1`, and the SPI gap that entry
# names ("it needs an SPI capability that returns typed observations for an
# on-demand request") is exactly the missing REQUEST mode.

