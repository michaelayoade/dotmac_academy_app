adoption_evidence_schema = "v1"
composition_boundary = "ADR-0024: each adopter installs its own ap lineage and owns its own approval records. Applications share the package contract, never a mod_approvals schema, a policy row or a decision row. An approval granted in one application is that application's fact; another app learns of it through the owning app's versioned API/webhook, transported by the Integrator. ADR-0026 § 5: tenant and platform are separately named API surfaces and separately audited persistence planes, with no foreign key across them and none into an adopting product's domain schema — subject_id is an opaque reference. ADR-0026 § 6: the module emits an event and the consuming domain's own authoritative service performs the guarded transition; it never executes the consequence. ADR-0026 § 7a: threshold/FX routing stays with the domain, which selects the exact policy revision and passes it in. ADR-0008: subject types are consuming-module manifest declarations; policy codes are operator-owned runtime data, never declarations."
inventory_evidence = [
  "docs/inventories/approvals-workflow-source-audit.md",
  "docs/inventories/approval-workflow-dispositions.toml",
  "docs/adr/0026-approvals-decide-approval-never-the-transition.md",
]
first_cutover = "Completed greenfield on 2026-08-17 in dotmac_vendor_control_plane. Vendor exact-pins dotmac-approvals 0.1.0a4, explicitly selects only the PLATFORM plane, and migration v013_approvals_authority took ACCESS EXCLUSIVE locks, re-verified the legacy approval tables were empty, transferred effective DML to platform_api, dropped the local tables, and refused a populated estate. vendor_cp.approvals.adapter is the sole typed seam; the old models/service and every local call site are deleted and ratcheted at zero. Production deploy 32022599873 runs main f8f8c3fd636e663e4a17275c19e82fc1667aa52a at immutable image sha256:56ec553139c449dc7da46a8873b3c03e95a61e43c970cd1675e28a202b2991cc with mod_approvals live and app_user holding no module privileges. ERP remains cutover 2 after its E8 tenant decision; Sub and CRM remain non-candidates because the A1 inventory measured zero approval rows there."
shadow_and_drift = "Vendor resolved as a measured greenfield switch, not a data-bearing shadow. The target was observed absent before production, and v013 made the premise executable by locking and refusing any non-empty legacy table in the same authority-transfer transaction. No lossy request synthesis, historical import or parity subsystem was built for zero rows. The six safety properties remain part of the Vendor adapter/module tests. ERP's later cutover retains the original data-bearing obligations: preserve immutable policy versions and hashes, reconcile open requests against exact content, compare lifecycle/eligibility/SoD behavior, and surface changed subjects as stale rather than importing them as approved."
local_copy_retirement = "Complete for Vendor cutover 1: src/vendor_cp/approvals/service.py and models.py, approval_policies / approval_records, shadow-overlap declarations, inventory tooling and the local sealed-cutover implementation are retired. Architecture tests ratchet local writer imports and call sites at zero. ERP still owes its independent retirement: remove the three audit.approval_* writers and direct commit() calls while retaining threshold/FX routing, document vocabulary and downstream consequences in the finance domain. No product may keep a compatibility decision table or parallel evaluator."
next_action = "Keep the Vendor production authority and zero-local-writer ratchets green. ERP is the only remaining concrete candidate and earns `reuse-proven` only after its E8 decision, exact module pin, tenant-plane migration, data-bearing parity, one-writer switch and local-copy retirement. dotmac-automation and dotmac-forms remain separate product-first audits and are not covered by this dossier."

