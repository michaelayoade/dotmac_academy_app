composition_boundary = "Approvals owns exact-content decision evidence and is passed as a value. Kernel owns enforcement primitives and audit storage. Application Access owns standing cross-app grant sets. The module stores no credential or provider endpoint and imports no sibling/product; an assembly maps a finite descriptor to kernel enforcement."
inventory_evidence = ["docs/inventories/sub-vnext-parity-sources.md", "docs/inventories/sub-vnext-parity-dispositions.toml", "docs/adr/0040-sub-vnext-parity-capabilities-have-narrow-independent-owners.md"]
source_mode_note = "No inspected repository implements the temporary request/consent/grant/revocation workflow, so that owner is greenfield after inventory. Sub nevertheless mints customer and reseller impersonation sessions directly and enforces them read-only; those are legacy issuance writers, not a qualifying workflow source, and their tests are preserved as enforcement/refusal boundary evidence."
first_cutover = "Vendor control plane is cutover 1. It composes the platform plane, routes approval evidence, hands admitted finite grants to a deployment/kernel enforcement adapter and disables any direct temporary support token issuance."
shadow_and_drift = "Before enforcement, every issued support token/session must correlate to exactly one active finite grant. Zero unexplained issuance, no expiry beyond the policy ceiling and immediate revocation/expiry denial are the cutover gates."
local_copy_retirement = "Sub must route customer and reseller impersonation issuance through an admitted finite grant, then retire the direct session-minting paths in `auth_flow.py`, `reseller_portal.py` and `web_customer_actions.py`; enforcement remains a thin product adapter. Retire every other direct temporary support impersonation issuance path that lacks an admitted grant. Keep kernel enforcement and standing Application Access because they own different lifecycles."
next_action = "Implement the platform-only sup lineage with request/grant/event evidence, platform grants and tenant-role revoke, strict TTL/break-glass/refusal canaries and no credential fields."

