composition_boundary = "ADR-0024/0032: each adopter installs its own tenant-only ca lineage and owns only its local campaign progression rows. The module imports the kernel but no sibling or product. Product assemblies supply typed audience facts and bind Template Studio, Durable Timers, sender resolution, delivery-gate and Sales/Inbox correlation adapters. Applications share contracts and normalized observations through versioned APIs/webhooks, never a mod_campaigns database or ORM model."
first_cutover = "dotmac_sub is cutover 1, overriding the broad marketing programme's Backoffice-first sequence for this vertical because Sub is the qualifying production source. Backoffice is cutover 2 as the independent greenfield reuse proof on the exact released package. CRM follows after preserving open/click and reply-correlation parity. dotmac_mkt remains the independent editorial/media owner and is not a default adopter."
shadow_and_drift = "Sub backfills module campaigns/revisions/steps/recipient evidence with source ids and fingerprints, then shadows every audience and due-step decision while the legacy service remains the sole writer. Compare campaign and recipient identity, eligibility/suppression receipts, sender snapshot, send-window result, predecessor resolution, delivery intent and terminal observation; provider ids are provenance and excluded from domain equality. Rehearsal must reach zero unexplained drift. The final comparison, full-column typed digests and authority switch occur in one ADR-0031 transaction under legacy-table write locks; a stored report never authorizes the switch. After cutover, module counter reconciliation and missing-outbox repair remain idempotent operational controls, not a legacy shadow writer."
local_copy_retirement = "Sub deletes app/services/comms_campaigns.py as owner, app/tasks/campaigns.py's scan/materialized_steps loop, local campaign tables and direct Subscriber/invoice/team/connector/Inbox dependencies after the sealed cutover and rollback window; product-specific candidate builders and adapters stay in Sub. A bidirectional caller/table ratchet reaches zero and no mirrored recipient ledger remains. Backoffice adds no local campaign owner. CRM retires its campaign scheduler/provider configuration/direct notification, Inbox and Lead writes plus mutable audience_snapshot after translating open/click/reply history into observations; its signed tracking edge may remain as a fact adapter. dotmac_mkt retires nothing."
next_action = "The module, canaries, lineage, API and conformance kit are implemented and exact-commit Observer validation is green. Kernel a73 and Durable Timers a1 are registry-verified; campaigns publication remains closed. Complete Sub's checked-in kernel S7 consent/idempotency/outbox collision dispositions, compose and rehearse exact kernel a73, and retire the superseded local owners; product adapters to those legacy stores are not an admissible fallback. Then compose Durable Timers a1 before activating due-work, release campaigns just in time for the sealed Sub cutover, compose that same campaigns release in Backoffice, and update status to reuse-proven."

