owner = "Dotmac template capability"
# The 2026-08-10 audit found the claimed two-kind contract does not hold: ERP
# documents and Sub notifications disagree on placeholder syntax, engine class,
# identity dimension and missing-variable policy. This package narrows to ONE
# decision — what the message says. Deciding whether it may be sent (consent),
# over what (channel policy), actually sending it (delivery) and producing a
# traceable document are four SEPARATE foundation owners with their own dossiers;
# see the audit's "Audit outcome, part 2 — the capability map".
contract = "Tenant-authored, safely rendered notification templates: authoring, versioning, publication and render to (subject, body). Not consent, not routing, not delivery, not documents."
source_repositories = ["dotmac_erp", "dotmac_sub", "dotmac_starter_mt"]

