first_cutover = "Sub, on the notification contract only, once the renderer is re-based per ADR-0006 5b. The package cannot receive Sub's rows as built: its double-brace substitution syntax is the syntax Sub rejects at save time after it leaked a literal placeholder to customers."
shadow_and_drift = "Sub's 7 notification_template_renderer tests are the parity proof; shadow rendering against the live single-brace renderer is required before Sub retires its local writer."
next_action = "ADR-0006 5b is implemented: kind=document is dropped, the renderer is re-based on Sub's single-brace allowlisted contract with its seven tests ported, identity is (tenant, slug, channel), the RenderContext registry and never-clobber executable-spec seeding mechanism ship, and ts_0002 carries the narrowed identity. To reach `adopted`, exact-pin the release in Sub, seed and shadow its notification templates, then retire the local renderer in the same sealed cutover. `reuse-proven` follows only when a second consumer moves onto an exact pin. Out of this package by ruling (5c): consent/suppression, channel policy, delivery/outbox and document generation are four separate foundation owners, each needing its own dossier, with consent sequenced before delivery. Do not absorb them here."
local_copy_retirement = "The selected source product must consume the released module and retire or gate its local writer before a second product cutover."
