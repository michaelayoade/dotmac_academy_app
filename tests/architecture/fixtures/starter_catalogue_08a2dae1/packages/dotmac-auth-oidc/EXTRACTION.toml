schema_version = 1
package = "dotmac-auth-oidc"
# NOT an optional-module: nothing installs this. It has no ModuleManifest, no
# namespace or lineage — a consumer constructs one of its server-side protocol
# objects and calls it. Naming it a module would send a reader looking for a
# lineage that does not exist.
classification = "stateless-protocol-adapter"
status = "adopted"

# NOT "product-first", and the distinction is the whole story of this dossier.
# ERP once held the fleet's only OIDC implementation, but it qualified on
# neither required axis: its security-critical validation/exchange methods were
# mocked out of every test, and the 2026-08-15 production inspection found the
# feature disabled with no configured provider and zero binding rows. ERP PR
# #302 deleted that unshipped implementation. At the exact revision recorded
# below ERP retains only the target contract, an empty-table retirement guard,
# and explicit must-not-restore checks; it has no protocol reader or writer.
# The historical design and defect inventory informed this adapter, but the
# crypto and HTTP code were not ported as trusted source. That is
# greenfield-after-inventory, and the inventory is what earns it.
source_mode = "greenfield-after-inventory"

owner = "Server-side OIDC protocol verification: the confidential relying-party ceremony and public-native ID-token verification, sharing discovery, JWKS, the algorithm/key-purpose checks and registered-claim validation — ending at a verified (issuer, subject)."

contract = "Run a confidential OIDC login or verify the ID token a public native client obtained, and say which external subject authenticated. The native backend surface has no secret, code exchange, cookie or StateStore and accepts a typed raw-or-digest nonce binding. NOT which local party that is, NOT whether they may do anything, NOT a session, NOT a user record, and NOT provider-specific behaviour."

source_repositories = [
  "dotmac_erp",
  "dotmac_sub",
  "dotmac_crm",
  "dotmac_academy_app",
  "dotmac_vendor_control_plane",
  "dotmac_starter_mt",
]

source_revisions = [
