# `main@ef38693` was seven hex digits AND a branch name — two refusals in one
# string, and it survived the old gate because it split on a colon. Expanded to
# the full merge commit of Workspace PR #2, which is what the abbreviation
# meant; the branch half is deleted rather than demoted, because #415's lesson
# is that a weaker ROLE for a bad coordinate is still a bad coordinate.
