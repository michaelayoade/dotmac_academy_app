# Adoption is real and was always documented in `first_cutover`; what was
# missing is the ADDRESSABLE form of it. Prose a reader must trust is not
# evidence a reader can check, which is the whole distinction ADR-0031 draws.
adoption_evidence_schema = "v1"

contract_consumers = ["dotmac_workspace"]
candidate_consumers = ["dotmac_sub", "dotmac_erp"]

inventory_evidence = [
  "docs/inventories/external-identity-sources.md",
  "docs/adr/0021-the-tenant-workspace-is-a-third-plane.md",
  "docs/adr/0017-adoption-is-the-scarce-resource.md",
]

first_cutover = "DONE 2026-08-15. `dotmac_workspace` PR #2 (`ef38693`) merged with `dotmac-auth-oidc 0.1.0a1` exact-pinned and its own `identity/oidc.py` DELETED — discovery, JWKS, the algorithm allow-list, PKCE, the exchange and ID-token verification all gone, replaced by an ~80-line `relying_party.py` that decides only which config, which lifetime and where the store comes from. It supplies a production `StateStore`: a PostgreSQL table whose `take` is one `DELETE ... RETURNING`, proven under real concurrency in its own `tests/db/test_state_store_atomicity.py`. The verified subject is resolved through `dotmac_kernel.external_identity.finalize_external_login` and the Workspace issues its OWN `dmws_session` — the package mints nothing. The pilot also CHANGED this package before earning the release (starter PR #194): a database-backed store belongs to one request's transaction, so `state_store` became a per-ceremony argument with a `PER_REQUEST_STATE_STORE` declaration, while the client stays process-lifetime to keep its `ProviderCache`. That gap was only findable by trying to be a consumer, which is the argument for pilot-before-publish stated as evidence rather than as principle. ERP remains a candidate consumer, but ERP PR #302 deleted its disabled implementation after host inspection; deletion removed a bad copy and is not adoption or reuse evidence."
local_copy_retirement = "DONE for the ERP protocol copy: PR #302 deleted `app/services/sso/oidc.py` after production inspection found no configured provider, sessions or binding rows. OPEN for Sub's unmerged mobile copy at aa7dfaf29: after 0.1.0a2 is published and exact-pinned, `app/services/oidc_mobile_jwks.py` and the local signature/registered-claim validation in `oidc_mobile_federation.py` are deleted; Sub retains only its ceremony rows, local AuthenticationBinding/UserCredential resolution, burn ordering and session issuance. Until that deletion and a green real exchange-path test, Sub is a candidate rather than a consumer. CRM's and Sub's forked `meta_oauth.py` pair is unrelated: Meta OAuth2 for API access has no ID token or JWKS and belongs to the Integrator connector story."

shadow_and_drift = "SETTLED 2026-08-15, and settled by a reading rather than by an argument. This field used to say a shadow comparison was unavailable because ERP's implementation had no VERIFIED production usage, and that if a host inspection later showed it live, a shadow comparison became both possible and necessary before retirement. The inspection happened: on erp.dotmac.io, OIDC_ENABLED is unset in the running dotmac_erp_app container, no issuer/client id/secret is configured, and federated_identities holds zero rows. There is no live behaviour to diff against, so no shadow phase is owed and ERP's retirement is a deletion. What stands in for a shadow is DIFFERENTIAL testing against the source's known gaps — each of the six defects the inventory measured in ERP (no JWKS/discovery caching, no clock-skew leeway, no `azp` check when `aud` is multi-valued, no one-time-use state, a borrowed state-signing key, an old pinned python-jose) is a named test here that fails if the behaviour regresses to ERP's. The FIRST consumer adds a second kind of evidence the differential tests cannot give: dotmac_workspace's suite mints real signed ID tokens against a provider double, so this package's verification runs for real from a consumer's side rather than only from its own. The ongoing drift risk is different in kind — a provider rotating signing keys — and is handled in the code (bounded forced JWKS refetch on an unknown `kid`, rate-limited against amplification) rather than by reconciliation, because there is no local projection to drift."

next_action = "Release exact 0.1.0a2 through the protected adapter lane, then make Sub the honest second consumer: exact-pin it, construct one NativeIDTokenVerifier per registration, pass `NonceBinding.from_sha256_hex(ceremony.nonce_hash)`, delete the local JWKS/verifier copy, and prove the real exchange path. Do not book source presence as adoption. Unchanged and non-negotiable: neither algorithm allowlist is a deployment knob; no `plain` PKCE; no ceremony on the wire; no provider-name branch; the PyJWT >=2.13 security floor stays; and no confidential client or credential enters Flutter."

