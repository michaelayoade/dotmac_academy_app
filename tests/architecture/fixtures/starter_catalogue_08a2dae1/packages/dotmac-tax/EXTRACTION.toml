# CORRECTION found by typing this list. The previous rows cited ERP #363
# (63f607d2, 2026-08-25) as the adoption commit. At that commit `dotmac-tax`
# does not appear in ERP's pyproject.toml or poetry.lock at all: the pin first
# held a day later, at 7643d5a2. The old citation was the branch tip somebody
# read, not the commit where anything happened — the same defect that put a
# twenty-minute-old pin in the deployment-foundation dossier.
[[adoption_evidence]]
kind = "pinned_at"
repository = "dotmac_erp"
commit = "7643d5a29ec1aaed197d6584a4c8f4267ef57981"
path = "pyproject.toml"
field = "tool.poetry.dependencies.dotmac-tax.version"
expected = "0.1.0a3"
note = "The commit where the pin FIRST held: 'feat(tax): compose released tax module contracts', 2026-08-26. This row is TRUE and it stays: ERP installs the distribution. It is the only row here, and that is the whole claim — ERP's own app/services/finance/tax/adoption/composition.py declares NOT COMPOSED, the `tx` lineage is absent from alembic.ini, `mod_tax` exists in no ERP database, and no writer is repointed. #496 left open whether `status = \"adopted\"` survived that reading; it did not, and the status was corrected rather than the history. AdoptionEvidenceV1 still authorises nothing: the correction is the dossier gate reading two of its own fields and refusing a contradiction."

[[adoption_evidence_pointer]]
subject = "current_pin"
repository = "dotmac_erp"
paths = ["pyproject.toml", "poetry.lock"]
field = "tool.poetry.dependencies.dotmac-tax.version"
note = "ERP's BOM is authoritative for what ERP installs. This dossier holds no copy — the previous `dependency:dotmac-tax==0.1.0a3` string was exactly such a copy."
