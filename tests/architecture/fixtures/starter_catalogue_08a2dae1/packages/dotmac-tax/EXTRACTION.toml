# CORRECTED 2026-08-29. Was `contract_consumers = ["dotmac_erp"]` with
# `status = "adopted"`. A pin is installation, not adoption: ERP pins
# `dotmac-tax 0.1.0a3` at an exact commit AND declares the module not composed
# in `app/services/finance/tax/adoption/composition.py` — the `tx` lineage is
# absent from ERP's `alembic.ini`, `mod_tax` exists in no ERP database, and no
# writer is repointed (this dossier types ERP as a `qualifying_source` whose
# retirement is still required, in [[product_writers]] below). Both facts are
# true at once;
# the pin was simply never the fact being claimed. ERP moves back to a
# candidate, which is what `_state_for(0)` requires and what the evidence says.
contract_consumers = []
candidate_consumers = ["dotmac_erp", "dotmac_sub"]
adoption_evidence_schema = "v1"
composition_boundary = "Applications submit typed, deduplicated source facts and consume determinations through local orchestration. Tax imports no billing, payroll, banking or accounting sibling. Official authority APIs and identity validation are Integrator/product adapters; accounting consequences use opaque references outside the module."
inventory_evidence = ["docs/inventories/tax-sources.md"]
first_cutover = "ERP is the qualifying policy/reporting source and first decision owner to retire after shared accounting exists. Sub then supplies its billing tax and withholding facts through a versioned product API/outbox contract without losing its operational source-fact ownership. Backoffice is a later exact-pin consumer. No package or table creation is a cutover."
shadow_and_drift = "Replay source facts against both engines and compare selected rule/version, bases, output/recoverable amounts, configured report boxes, payable totals, obligations and return transitions. Any rule ambiguity or source-version mismatch fails closed; shadow writes neither owner."
local_copy_retirement = "Seal one policy/determination/reporting writer switch, then remove ERP's fixed TaxType/rate/calendar/report-format decisions and direct filing lifecycle writers. Product source-fact writers remain only for facts they own; country/provider transports remain adapters. No fallback calculator or dual return ledger survives."
next_action = "Release 0.1.0a4 after its package, public-policy-contract and unchanged released-migration gates are green. ERP then pins the immutable a4 release coordinates and uses only the exact-replay ensure/read seam to bind its sealed C3 policy map; shadow remains default-off and moves no writer authority. PAYE shadow waits for persisted annual taxable-base and approved band evidence. Sub may first contain its billing defects, then supplies facts only after a tax-classification backfill, zero-drift shadow, and explicit writer switch."

