package = "dotmac-connector-paystack"
classification = "stateless-protocol-adapter"
status = "audit-complete"
source_mode = "product-first"

owner = "Paystack provider transport in both directions: exact-byte HMAC-SHA512 verification, authenticated transaction-list polling, provider-event identity, charge-success normalization, acknowledgement bytes, and the nine outbound provider-neutral commands (payment initialization, saved-authorization charge, refund, bank-account resolution, transfer-recipient creation, transfer initiation, and customer create/update/read) with their wire translation, exact-money conversion and outcome classification."

contract = "Implement dotmac-integration SPI >=1.4,<2.0 for connector key paystack. Serve payments.settlement.observation.v1 in INGRESS and POLL, and payments.intent.v1, payments.refund.v1, payments.payout.v1 and payments.customer.v1 in DELIVERY, each capability mapped to its own mode so an observation binding never carries command authority. Emit exact amount and provider-fee decimal strings with explicit currency, provider status verbatim, merchant reference and transport evidence; reconcile through the authenticated paged transaction list. On the command side: carry the engine's idempotency key through to Paystack's own duplicate protection (the client-supplied unique reference, and merchant_note where no reference field exists), convert exact major-unit decimal strings to provider minor units without float and without rounding, classify each attempt as succeeded/declined/retryable/terminal/ambiguous, and report the provider reference and transaction id as evidence on every outcome including the ones that received no answer. Own no product identifier, tenant, allocation, coverage, balance, receivable state, net-amount arithmetic, settlement admissibility, invoice targeting, refund warrant, retry/checkpoint engine, row, session or product database."

# ── ADR-0061 (2026-08-24): the payout DECISION is ERP's, and this connector is
# one BINDING behind one contract ────────────────────────────────────────────
#
# `payments.payout.v1` is ONE provider-neutral contract for the whole fleet, and
# this distribution is currently its only implementation. That is a fact about
# today, never a licence: ADR-0061 § 2 forbids a Paystack variant of the
# contract, and § 3 requires that ERP be able to move payout traffic to another
# connector by changing a capability binding — no ERP release, no provider name
# anywhere in ERP.
#
# What this connector does NOT own, restated because the outbound leg makes it
# easy to blur: whether a payout happens, to whom, for how much, and whether an
# ambiguous attempt may be tried again. Those are ERP's Treasury/payment
# owner's decisions (ADR-0061 § 1, the owner ADR-0042 § 3 left unnamed). This
# package translates a decided command onto a wire and classifies the answer,
# including the answer that never arrived.
#
# DIVERGENCE THIS CONNECTOR MUST CLOSE (ADR-0061 § 4 D3, § 5 step 2). Its
# command payload is not the same shape as dotmac-connector-flutterwave's or
# dotmac-connector-remita's, so no product could bind either interchangeably
# today:
#
#   * envelope     `{"action": <verb>, "params": {...}}` checked against
#                  delivery.ACTIONS_BY_CAPABILITY, against their flat,
#                  per-capability payload with no action verb;
#   * reference    DERIVED here (operations.provider_reference = "dmi" +
#                  sha256(DispatchRequest.idempotency_key)), and reading one
#                  from the payload is refused outright — against their
#                  PRODUCT-minted `intent_reference` / `orderId`;
#   * minor units  refused here: the product sends an exact MAJOR-unit decimal
#                  string plus `currency` and PAYSTACK_WIRE_SCALE = 2 is applied
#                  locally — against their REQUIRED `currency_minor_units`.
#
# Both sides are locally right. Paystack's wire multiplies by 100 for EVERY
# supported currency including zero-exponent XOF, so a product-supplied exponent
# would be a second, contradictory authority on this provider's scale; and
# deriving the reference from the engine key is exactly what makes every attempt
# of one delivery present an identical, provider-refusable key. Neither property
# may be dropped to reach parity.
#
# The closure is therefore NOT "make Paystack look like Flutterwave". It is a
# declared, provider-neutral command payload for `payments.payout.v1`, after
# which this connector keeps deriving its provider reference but derives it from
# the contract's stable reference plus the engine key, and IGNORES an exponent
# it cannot use rather than refusing the command that carries it.
#
# CORRECTED 2026-08-24 (ADR-0024 § 10, ADR-0061 A2/A3). The paragraph above
# originally located the missing declaration surface on the SPI's
# `CapabilityDeclaration` ("the SPI has nowhere to put one today —
# CapabilityDeclaration carries a config schema and DispatchRequest.payload is
# an unvalidated dict, ADR-0024 § 8.4"). That is the wrong owner: a schema
# published per connector makes drift machine-readable instead of preventing
# it. The canonical schema belongs to the business-owned
# `capability_registry.CapabilityContract`; this connector's declaration may
# only CLAIM that contract's digest.
#
# AND THE COMMAND SURFACE SHRINKS. ADR-0061 A3 fixes what `payments.payout.v1`
# exposes to a product: `submit_payout`, a PRODUCT payout reference, exact money
# (exact decimal amount plus explicit currency), a provider-neutral destination,
# and idempotency/correlation identifiers. That is all of it.
#
#   * `resolve_bank_account` and `create_transfer_recipient` — today two of the
#     three actions this connector accepts under PAYMENT_PAYOUT_CAPABILITY in
#     `delivery.ACTIONS_BY_CAPABILITY` — stop being product-visible actions and
#     become INTERNAL steps performed behind `submit_payout`. ERP must never
#     orchestrate "create the Paystack recipient, then initiate the Paystack
#     transfer" against "send the Flutterwave transfer": a product that does
#     still needs a code release to change a binding, which defeats ADR-0061 § 3
#     entirely. A recipient code is a normalized RESULT or a connector internal,
#     never a separate provider action the product sequences.
#   * `ACTIONS_BY_CAPABILITY`'s totality check and its refusal of an action
#     outside the bound capability are CORRECT and stay — the correction is to
#     what the product may name, not to the connector's own allow-list.
#
# DECIDED 2026-08-24 (ADR-0061 Amendment A5) — supersedes the OPEN ITEM this
# block previously carried, which read: "this connector also declares
# `payments.customer.v1` ... it either earns that argument in an accepted
# record, or it collapses into `payments.intent.v1`'s normalized result."
# It did not earn it. **`payments.customer.v1` is REMOVED from the public
# capability manifest.** It has no independent Dotmac business lifecycle: it is
# Paystack's `POST/PUT/GET /customer` surface with a Dotmac id painted on it,
# and no product decides "create a customer at a payment provider" as an act of
# its own. Instead: the product Customer owner keeps customer identity;
# `payments.intent.v1` carries the required customer EVIDENCE;
# THIS CONNECTOR creates or resolves any provider-side customer INTERNALLY
# behind the intent command (`/transaction/initialize` already does exactly
# that from the evidence on the command); the result returns an OPAQUE
# Integrator correlation where one is needed at all; and saved-instrument
# charging consumes an opaque PAYMENT-METHOD correlation — the
# `authorization_code` this connector already takes on `charge_authorization` —
# never a Paystack customer code. Customer read/create/update disappear from
# the public manifest. There is no compatibility window because no product
# binds the capability, so nothing is succeeded (A4's succession rule is not
# engaged). A future product needing genuine, independent provider-customer
# synchronization arrives with its own owner, consumer, lifecycle and schema in
# an accepted record; today's Paystack synchronization is NOT preserved merely
# because it exists.
#
# STILL AS BUILT: the code below has not changed yet, and the `contract` field
# above still names `payments.customer.v1` because it describes what this
# distribution ships TODAY. The removal is part of the payout refactor, gated
# behind the capability-schema seam (A2) and the result seam (A3). ADR-0061 A5
# holds the exact artifact-by-artifact removal list, including the ordering
# constraint that `delivery._MISALLOCATED`'s import-time bijection check forces
# the `OPERATIONS` and `ACTIONS_BY_CAPABILITY` deletions into ONE change.
#
# DECIDED 2026-08-24 (ADR-0061 Amendment A8) — supersedes the line this block
# previously carried, which read: "the same A3 test still applies to
# `payments.refund.v1`'s surface, and remains an open item there."
# It is no longer open, and it closes the OPPOSITE way to `payments.customer.v1`
# — which is the test discriminating, not an inconsistency. The discriminating
# question is: if the provider vanished tomorrow, would the thing still exist
# and still need an owner? A provider-side customer record would not; it is a
# by-product of a charge. A refund obligation WOULD — someone with authority
# decided money goes back, for how much, against which original payment, and it
# would be paid another way. A provider-side customer record is a by-product of
# an act; a refund IS the act. It has its own lifecycle (requested -> submitted
# -> ambiguous -> settled/failed), its own evidence, its own reconciliation and
# a receivable/revenue consequence.
#
# **`payments.refund.v1` is KEPT.** What changes is its SURFACE, under the same
# A3 rule that moved recipient creation behind `submit_payout`: ONE command,
# `request_refund`, carrying exact money (with full-versus-partial DECLARED,
# never signalled by an absent field), the original-payment correlation, the
# authorization reference and idempotency identity. `refund` is Paystack's verb
# inside this connector's `{"action", "params"}` envelope and stops being what
# a product names; `_request`'s `refund` branch stops reading a product-supplied
# `params["transaction"]` and resolves the Paystack transaction handle itself;
# `_refund_result`'s `{"refund_id": ...}` becomes a normalized value under the
# contract's `result_schema`; and `GET /refund?transaction=...` stays a
# reconciliation internal, never a product-visible action.
#
# WHAT MUST NOT CHANGE while that happens: the `refund` `_Operation` keeps
# `OperationOutcome.AMBIGUOUS` on an unanswered send and keeps `needs_key=True`,
# and the `merchant_note` stamping stays. Paystack's `/refund` accepts NO client
# reference, so there is no provider-enforced duplicate protection on this
# endpoint at all — the derived key in `merchant_note` makes an ambiguous refund
# DECIDABLE by reading the provider's refund list, and decidable is NOT refused.
# A duplicated payout is refusable at Paystack because the derived reference
# rides the provider's own `reference` field; a duplicated refund is not.
# Nothing at the provider stands between a re-request and a second refund except
# that read, so the read is mandatory before any re-request, no transport ever
# makes one, and a re-request is a NEW authorized decision by the refund owner.
#
# The refund OWNER is not named here and is not Treasury by default: a refund
# reverses a receivable rather than discharging a payable, and it is not one of
# ADR-0063 section 6's twelve closed surface items (ADR-0061 A9). It is Billing
# or another named owner, and naming one needs the same product-first evidence
# ADR-0061 A1 demanded before naming a payout owner.
#
# STILL AS BUILT: the code below has not changed. Like A5's removal, the refund
# surface change is part of the payout refactor, gated behind the
# capability-schema seam (A2) and the result seam (A3); `delivery._MISALLOCATED`
# forces the `OPERATIONS` and `ACTIONS_BY_CAPABILITY` edits into ONE change.

