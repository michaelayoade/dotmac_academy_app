authority_boundary = "Sub remains the application owner of operational customer, subscriber, project, ticket, workforce, dispatch-policy, topology and official-timeline decisions. The module owns only the local physical execution aggregate and durable facts. CRM is a retiring duplicate and never a co-owner. InstallationProject remains Sub's vendor-commercial wrapper until the internal-crew/vendor execution split is explicitly resolved; this extraction does not silently turn vendor projects into work orders."
inventory_evidence = [
  "docs/inventories/work-orders-sources.md",
  "docs/inventories/fleet-decomposition-matrix.md",
]
first_cutover = "dotmac_sub is the first and only current candidate. The initial cutover is the internal-crew WorkOrder path because it is production-used, tested and already named authoritative by WORK_ORDER_IDENTITY_SOT.md. The separate vendor InstallationProject path is excluded from this first cutover: it carries bidding, quote, purchase-order, accounts-payable and as-built commercial review, and no WorkOrder currently exists on that path."
shadow_and_drift = "Before Sub moves writes, replay captured create, assign and mobile event commands into an isolated mod_workorders schema while Sub's current work_order owner remains authoritative. Compare exact public identity, assignment, status/timestamps, kernel-ledger command fingerprints, work-log duration and completion-evidence verdicts. The known intentional corrections are measured separately: changed command fingerprints conflict through dotmac_kernel.idempotency, the one at-most-once owner; services flush but never commit/rollback; one actor cannot hold two open timers; completion requirements are snapshotted on the work order; product-specific fiber/splice gates run in Sub before the module command. Any unclassified difference blocks cutover. CRM is not dual-written: its rows are reconciled to Sub and retired under Sub's existing CRM web retirement ledger."
local_copy_retirement = "After shadow parity and a single Sub write cutover, Sub replaces constructors and lifecycle writers in app/services/work_order_commands.py and app/services/field/transitions.py with this module, migrates the six owned table families into mod_workorders, and deletes the local status/event machine. Subscriber/project/task/ticket relations become Sub-owned tenant-safe link tables; topology, material, movement, customer communication and inbox consequences stay Sub adapters. CRM's work_orders, work_order_assignments, work_order_notes, assignment queue, dispatch and field-work copies retire after reconciliation and zero-traffic evidence; they never become package sources or fallback writers."
next_action = "Do not publish or cut over from this repository slice. First run the canary and full validation on Observer from the exact committed branch. Then write the Sub adoption migration and shadow reader: internal-crew WorkOrder only, with product-owned subject links and product completion gates. Resolve the separate vendor InstallationProject versus generic WorkOrder decision before adding vendor execution; no vendor branch, provider enum or commercial table may enter this package."

