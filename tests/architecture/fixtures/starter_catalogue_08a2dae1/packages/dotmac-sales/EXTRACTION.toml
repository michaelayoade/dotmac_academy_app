first_cutover = "dotmac_sub is cutover 1 because it is the qualifying production-used and tested source. Install sa, backfill in-scope state, run read-only shadow comparisons and reconcile every mismatch before switching one writer family at a time. CRM supplies parity and retirement evidence only; it cannot become a second owner."
shadow_and_drift = "Compare every Sub row's tenant, lifecycle, stage/probability, subject reference, origin identity/evidence, Quote currency/expiry/lines, exact subtotal/discount/tax/total and discount history. Dual-run authoring and acceptance against captured fixtures while only legacy performs live consequences; compare canonical accepted snapshots. Prove one handoff under replay/concurrency, rollback-safe output, cross-tenant refusal and zero mutable accepted rows."
local_copy_retirement = "After Sub reconciliation, replace its Lead/Pipeline/Quote writers with thin adapters and retire acceptance consequences in favor of a downstream-owned handoff consumer. Then remove corresponding CRM routes, jobs, webhooks and writers. Keep campaigns unverified and untouched; keep SalesOrder/order-line ownership outside. No permanent mirror, parallel writer or forked lifecycle."
next_action = "Implementation and the prescribed check, unit/architecture and PostgreSQL canaries are green in the dedicated Starter worktree. The sales namespace allocation is combined with the checked-in kernel 0.1.0a70 candidate and this package now declares that exact floor. Accept and publish kernel a70 first, then release sales just in time for Sub backfill, shadow comparison and reconciliation. The concurrent module workstreams own the generic SQLite harness repair exposed by the eleventh imported module; do not duplicate it here. Do not cut over or retire CRM writers before the release and adoption evidence is accepted."

