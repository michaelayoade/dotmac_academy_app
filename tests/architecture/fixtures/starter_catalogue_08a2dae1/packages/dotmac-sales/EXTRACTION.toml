composition_boundary = "ADR-0024: each adopter installs and migrates its own sa lineage. Applications share AcceptedQuoteHandoffV1 over a versioned boundary; they never share mod_sales rows or read another application's database. Sales imports neither an assembly nor another module. Subject, actor and delivery arrive through typed product-neutral ports."
