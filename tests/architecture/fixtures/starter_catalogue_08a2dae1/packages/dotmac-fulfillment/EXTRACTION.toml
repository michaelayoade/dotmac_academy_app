composition_boundary = "ADR-0024 and ADR-0030: every adopter installs the tenant-only fu lineage in its own database and owns its local fulfillment rows. Steps hold only opaque intent and line references; no foreign key reaches Orders, Domains, Hosting, Sub or another application. Participant implementations are declared by installed manifests and bound by the assembly through typed callbacks; dotmac-fulfillment imports no sibling module and contains no participant-specific branch. The manifest depends on the separately released dotmac-durable-timers module, while the assembly supplies the adapter so no scheduler ledger enters mod_fulfillment. Integrator transports commands and observations but never writes fulfillment tables."
inventory_evidence = [
  "docs/inventories/fulfillment-sources.md",
  "docs/adr/0030-cloud-commerce-is-composed-from-complete-domain-owners.md",
  "docs/inventories/durable-timers-sources.md",
]
first_cutover = "Dotmac Cloud is cutover 1 after its first participant declares the stable provisioning contract. Begin with one domain-registration line: dual-write no fulfillment status, dispatch through the local participant adapter, record the module outcome in shadow, and compare it with the domain lifecycle owner's observation before allowing any consequence. Add a second independent participant before calling partial-progress behavior proven. Dotmac Sub is cutover 2 and replaces ProvisioningRuns.run plus reap_stale_runs together; it keeps ISP readiness and service lifecycle decisions as participant owners and drops the orphaned saga tables rather than adopting them."
shadow_and_drift = "For each candidate adopter, create the module run and attempts in the same transaction as the existing request while leaving the local owner authoritative. Compare command identity, correlation, per-line outcome, derived progress and re-observation verdict for every transition. Record provider-success/callback-loss, out-of-order delivery, duplicate delivery and partial success as named divergence classes. Cut over only after live PostgreSQL RLS/concurrency evidence and zero unexplained drift; then seal one writer and use the module's reconciliation reader to rebuild progress from immutable attempts and receipts."
local_copy_retirement = "Cloud has no local saga copy to retire. Sub retires the synchronous ProvisioningRuns.run loop, reap_stale_runs, provisioning run/workflow/step tables insofar as they are engine state, the ProvisioningStepType/ProvisioningVendor/ProvisioningReadinessCheckKind database enums, and the orphaned saga_executions/provisioning_step_executions tables. It retains ISP participant models and service_order_lifecycle without the cross-owner activate_subscription write. ERP's dormant platform saga is a cleanup candidate, not an adopter. Two-directional caller/model/table ratchets reach zero before any displaced owner is called retired."
next_action = "Kernel a89 is published, registry-verified and tagged, so the floor now names an installable release and this package no longer waits on the kernel. Remaining gates are unchanged and are about ADOPTION, not supply: compose the released dotmac-durable-timers dependency, then implement the first Dotmac Cloud participant adapter. Do not allowlist or publish before that named participant exists \u2014 an installable saga owner standing beside products that still drive their own is the failure the dotmac-imports row was ruled on."
