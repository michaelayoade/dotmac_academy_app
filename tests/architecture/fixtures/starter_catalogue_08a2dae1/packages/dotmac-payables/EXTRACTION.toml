composition_boundary = "Each adopter runs the independent pa lineage in its own database. The package imports only dotmac-kernel. An assembly supplies supplier/procurement/approval/tax facts, translates the provider-neutral accounting consequence into the locally composed Accounting contract, and accepts Treasury settlement observations over a versioned API/outbox boundary; neither business module imports the other."
inventory_evidence = ["docs/inventories/accounting-payables-sources.md", "docs/adr/0042-payables-owns-supplier-liabilities-not-payment-execution.md"]
first_cutover = "ERP is source and first exact-pin adopter after its Accounting cutover. Backfill and shadow invoice/credit lifecycle, recognized liability, obligation due/outstanding state, credit availability/application, settlement observations and accounting receipt reconciliation while legacy AP is sole writer; switch and retire legacy AP writers in a separately authorized sealed cutover."
shadow_and_drift = "Compare tenant/supplier/document identity, dates/currency/exchange rate, immutable line totals/account references, approval references, liability events, obligation schedules/outstanding values, supplier-credit availability/applications, settlement source fingerprints and accounting consequence/receipt fingerprints. Product supplier, tax, procurement and bank ids are adapter evidence, not module foreign keys."
local_copy_retirement = "ERP removes supplier-invoice, credit-note, liability, payment-allocation and coverage decision writers after the sealed switch. CRM's project-bound VendorPurchaseInvoice lifecycle is also a legacy supplier-invoice writer: it must retire into the owning product/module boundary, including its ERP push path, rather than remain as a second invoice-status authority. Purchase-order/goods-receipt, supplier-directory, tax, inventory and bank/payment execution services remain independent and call typed ports only. No legacy invoice-status or GL-posting adapter remains as a second Payables writer."
next_action = "Complete the Starter package/canaries and exact-commit Observer validation, then publish only with the ERP Accounting prerequisite and Payables cutover slice ready. Keep the package audit-complete and unallowlisted before adoption."

