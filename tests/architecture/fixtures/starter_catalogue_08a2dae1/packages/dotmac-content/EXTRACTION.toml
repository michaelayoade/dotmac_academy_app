authority_boundary = "dotmac-content owns editorial decisions only. Backoffice owns actor authentication, permissions and collaboration policy. dotmac-files owns stored bytes. dotmac-publishing owns target selection, requested delivery time, immutable publication snapshots and reconciled remote publication state. dotmac-campaigns owns audiences, recipients, consent/suppression checks and campaign execution. Integrator owns credentials, OAuth, provider clients, webhooks, retries, checkpoints and remote transport evidence. Applications install independent lineages and synchronize only typed data; no sibling-module import, cross-application database access or shared writer is permitted."
inventory_evidence = [
  "docs/inventories/marketing-suite-sources.md",
  "docs/inventories/content-extraction-dossier.md",
  "docs/inventories/content-writer-retirement.toml",
]
first_cutover = "The Dotmac ERP product is cutover 1. It must pin a released dotmac-content version, compose and migrate its own tenant plane, backfill Mkt editorial rows, shadow every selected read and write, switch one writer at a time, and retire the corresponding Mkt writer. Installing the package without deleting a source writer is not adoption. Sub is a later independent adopter with its own database, rows and lineage."
shadow_and_drift = "Before writer cutover, compare every Mkt Campaign selected as editorial planning data with one ContentPlan and every non-published Post editorial record with one ContentItem. Prove identifiers, text, dates, editorial state, creator reference, ordering and creative references. Classify every published Post and every channel/delivery field into the publishing migration with no default bucket. Reconcile opaque file references against the files adapter without adding a cross-module foreign key. Run shadow reads for a complete editorial planning cycle and require zero unexplained mismatches."
local_copy_retirement = "Delete or permanently gate Mkt CampaignService once CNT-R1 passes; delete the editorial half of PostService only after CNT-R2 and the publishing handoff pass; retire campaign_assets/post_assets writers after CNT-R4/CNT-R5; remove the campaign_members authorization query from the content path after Backoffice policy guards replace it. Provider/channel/delivery code retires under dotmac-publishing and Integrator, not this package. The two-directional retirement inventory is docs/inventories/content-writer-retirement.toml."
next_action = "Michael authorized release on 2026-08-20 without authorizing adoption, and the release is complete: kernel a81 and content 0.1.0a1 are registry-verified and tagged from the exact protected-main commit, so Backoffice can pin an installable artifact once it is authorized to. Publication moved nothing else. Backoffice remains cutover 1, has not composed the module, and every Mkt writer-retirement row remains not-started; do not claim adoption until the shadow cycle, writer switches and retirement gates pass."

