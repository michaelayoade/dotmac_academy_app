adoption_evidence_schema = "v1"
composition_boundary = "ADR-0024: the vendor control plane installs its own li lineage and owns its own licence rows; no application shares a mod_licensing schema. ADR-0057 s8: the module imports no sibling — agreement and allocation facts arrive as a LicensableGrant value from the assembly. ADR-0006 D2/D4: kernel WS8 is the sole target licence protocol and the dotmac-* schema ids are permanent, so this module issues what dotmac_kernel.licensing already verifies and introduces no second format; the round-trip check makes that structural rather than aspirational. ADR-0009 / hard rule 20: LicenceSigner is a port with no implementation in this package and signing_keys has no private-key column, so custody stays with the product. ADR-0024 / hard rule 28: transport, connection refs, attempt counters, retry outcomes and error codes stayed with the Integrator — this module ends at a signed envelope and resumes at an acknowledgement. ADR-0023 / ADR-0057 s7: platform plane only, and here the plane is a security boundary — issuance must not live inside the deployment it authorises, and the receiving half verifies offline."
inventory_evidence = [
  "docs/inventories/vendor-cp-gap-sources.md",
  "docs/adr/0057-the-vendor-control-plane-composes-existing-owners.md",
]
first_cutover = "Completed GREENFIELD on 2026-08-21 in dotmac_vendor_control_plane. v016_licensing_authority rechecks all five local issuer tables under ACCESS EXCLUSIVE and aborts on any row, because a populated cutover must preserve signed envelopes byte-for-byte, move only public key material and continue the revocation-list lineage. Vendor exact-pins dotmac-licensing 0.1.0a1, composes the platform-only manifest and li_0001_licensing lineage, and retains one typed grant/signer adapter plus product-held private-key custody. Verified directly against the production database at 2026-08-21T14:17:32Z: mod_licensing live with six tables, all five local issuer tables ABSENT, app_user holding zero privileges on any mod_* schema."
shadow_and_drift = "No shadow phase is owed: the capability exists in exactly one product, so there is no second writer to reconcile against and no parallel evaluator to compare. What IS owed at cutover is a data-bearing migration under three constraints that have no equivalent in the other modules. (1) Every issued digest and envelope must be preserved BYTE-FOR-BYTE. An envelope is signed; re-serialising it changes the digest, which invalidates the signature and turns every deployed licence into one the receiver rejects. The migration copies bytes and never rebuilds a payload. (2) Signing keys migrate as PUBLIC material only, and the private half is re-installed through the product's secret seam at the new composition — never read, exported or copied by the migration. (3) The revocation list lineage must continue at the existing list_version, and the first list published after cutover must be a superset of the last one published before it; the cumulative rule spans the cutover, because the fleet's imported state does not reset when the issuer's code does. A populated legacy table encountered at cutover must fail the migration, not be silently skipped."
local_copy_retirement = "Complete for cutover 1 on 2026-08-21: the issuer half of src/vendor_cp/licensing/ and the five local issuer tables (licences, licence_issuances, licence_signing_keys, licence_revocation_lists, licence_revocation_entries) are gone, verified absent on the production database. Original audit text follows. Owed by dotmac_vendor_control_plane at cutover: the ISSUER half of src/vendor_cp/licensing/ — service.py, models.py, revocation.py, revocation_models.py, signer.py, ops.py — plus the licences, licence_issuances, licence_signing_keys, licence_revocation_entries and licence_revocation_lists tables. The vendor keeps its routes, its console screens, and a thin adapter that builds a LicenceSigner from OpenBao-materialised key files. It also keeps, unchanged and NOT retired by this extraction, the DELIVERY half — transport.py, delivery_models.py and the delivery portion of projection.py — until that capability is composed onto the Integrator under ADR-0024; conflating the two retirements would strand delivery with no owner. No product may keep a compatibility licences table or a parallel issuer."
next_action = "Hold at `adopted`; `reuse-proven` requires a second real control plane. The DELIVERY half is a separate, still-open cutover: Vendor ADR-0010 moves transport, retries, health and repair to dotmac-integration in the Integrator. Gate 2a landed 2026-08-22 (Vendor PR #72) — three authenticated source ports, a digest-pinned licence-source contract and correlated idempotent acknowledgement, with NO activation. Gate 2b (deployment-owned destination descriptor, Integrator reconciliation, a real connector, mirror mode) is outstanding. This module owns valid acknowledgements and the licence lifecycle throughout; Vendor's remaining delivery tables are the estate ADR-0010 retires, not this module's concern."

