schema_version = 1
package = "dotmac-connector-nira"
classification = "stateless-protocol-adapter"
status = "audit-complete"
source_mode = "greenfield-after-inventory"

owner = "NiRA .ng registry transport over CoCCA EPP in both directions: TLS framing (RFC 5734), authenticated login/logout, the domain/host/contact check-create-info-renew-update-transfer command frames with the fee-1.0 extension, phase-aware EPP result classification, and the registry message-queue poll that turns queued messages into typed observations."

contract = "Implement dotmac-integration SPI >=1.4,<2.0 for connector key nira. Serve registry.availability.v1, registry.domain_info.v1, registry.domain_register.v1, registry.domain_renew.v1, registry.domain_update.v1, registry.domain_transfer.v1, registry.host_provision.v1 and registry.contact_provision.v1 in DELIVERY, each capability mapped only to DELIVERY so a binding granted one command cannot issue another; and registry.message.v1 in POLL. Carry the engine's idempotency key as EPP clTRID for correlation only, never as an unproved provider deduplication guarantee. Permit only exact manifest-declared OT&E egress and hold the release until production egress, authenticated OT&E and owning-domain command/result contracts are proven. A failure before a business command is retryable; any failure after command attempt, 1001, 2302 or 2303 requires reconciliation; 2201/2202 and client errors are terminal. Until the owning domain publishes its result schema, successful availability/info/check/transfer-query responses require reconciliation rather than being reported without their body. On poll, configuration and login refusals raise into Integration's failure ledger; return at most one queued message with its human text and serialized resData as a typed observation without acknowledging it; only a later call whose Integration-persisted cursor matches that live queue head may acknowledge it before returning the next unacknowledged head. Own no domain lifecycle decision, price or markup, contact/registrant identity, retry curve, checkpoint, outbox, row, session or product database; persist nothing, and never write an authoritative lifecycle field from a poll observation."

# ── Greenfield, not ported ───────────────────────────────────────────────────
#
# No qualifying EPP/registrar implementation existed anywhere in the fleet at
# inventory (measured across the ADR-0030 repositories, 2026-08-15). The wire
# SHAPE is taken from the CoCCA reference module NiRA distributes to WHMCS
# registrars (`cocca-whmcs-v9-2026-02-27.zip`), which is a documented registry
# contract, not a Dotmac source. This distribution is therefore
# greenfield-after-inventory against that external contract.
#
# ── One connector, one binding behind one contract ───────────────────────────
#
# The nine `registry.*` capabilities are provider-neutral contracts owned by the
# domains application (greenfield per ADR-0030), not by this connector. A second
# registry (a gTLD reseller platform) is a DIFFERENT connector implementing the
# SAME contracts, selected by a capability binding — never a `.ng` variant of a
# contract and never a provider name in the owning application.

