first_cutover = "After dotmac-domains publishes the provider-neutral registrar command and result contracts, publish this connector, exact-pin it in dotmac_integrator, and route one declared Domains binding through Integration while Domains remains the only lifecycle writer."

shadow_and_drift = "Against authenticated NiRA OT&E, compare exact command frames, clTRID correlation, result classifications, and every polled message's human text plus serialized resData. Prove that no provider queue head is acknowledged before Integration durably records the same cursor and observation, including both crash windows and ambiguous acknowledgements."

local_copy_retirement = "No qualifying Dotmac EPP implementation existed at inventory. If a product introduces a direct NiRA/CoCCA client before the first cutover, remove that provider transport, credential access, poll schedule and checkpoint in the adopting change; the product retains only its domain decisions and typed Integration port."

next_action = "Keep release_enabled false. Whitelist the Integrator source IP for NiRA OT&E, prove authenticated login/logout and client-certificate handling, let dotmac-domains publish the command/result contracts, review the exact production egress hostname into a later manifest, then rerun connector conformance and the two-phase poll durability corpus before publication."

