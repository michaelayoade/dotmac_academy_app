composition_boundary = "ADR-0024/0038: each adopting application exact-pins and runs one tenant-only pc lineage in its own database. The module imports kernel only. Assemblies translate local requester/supplier/item/budget/approval/receipt facts through opaque typed seams; products exchange facts through versioned APIs/webhooks and never share mod_procurement tables, ORM models, sessions or transactions."
first_cutover = "dotmac_erp is the qualifying source and cutover 1 after its Organization-to-Tenant mapping. Backoffice is the first greenfield candidate only after ERP's real one-writer switch. Sub is a later separate adapter decision because its installation-project bidding lifecycle remains product authority; CRM's predecessor copy consolidates to Sub and is not reuse evidence."
shadow_and_drift = "ERP remains sole writer while a versioned projection replays requisitions, RFQs, invitations, quotations, evaluations, purchase orders and receipt quantities into pc. Compare every lifecycle state, line, amount/currency, criterion/score, selected offer, approval/budget binding and cumulative received quantity. Final comparison, typed digests and authority switch run under source write locks in the single ADR-0031 transaction; a stored report or package publication cannot authorize the switch."
local_copy_retirement = "After the sealed cutover, ERP web/API surfaces become thin adapters and its procurement/requisition/RFQ/quotation/evaluation and purchase-order decision writers reach zero under a two-directional ratchet. AP, Inventory and product adapters remain only as fact producers/consumers and may not maintain a mirrored lifecycle. Legacy tables retire only after the rollback window and all foreign-key/caller dependencies are removed or replaced by rebuildable compatibility projections."
next_action = "Validate the canary-first package and pc lineage on Observer at the exact branch commit. Then complete ERP Organization-to-Tenant mapping and build its versioned backfill/shadow adapter. Do not publish or compose a parallel owner before the sealed ERP cutover is ready."

