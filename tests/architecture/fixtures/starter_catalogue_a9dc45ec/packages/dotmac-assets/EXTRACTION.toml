authority_boundary = "ADR-0037. dotmac-assets owns individual durable asset identity, physical lifecycle, opaque current location, custody/assignment history, maintenance lifecycle, disposal state and append-only evidence. ERP's finance owner keeps capitalization, depreciation, impairment, revaluation, gain/loss and journal posting. Inventory keeps parts, stock and procurement. dotmac-positioning keeps provider-neutral position observations; the adopting product owns the asset-to-tracked-unit link and asks the asset owner to change authoritative location when policy permits. Product extensions keep vehicle registration/specification, odometer, fuel, incidents, reservations, documents and driver/department policy. Actors, custodians and locations are opaque local UUIDs without product foreign keys."

inventory_evidence = [
  "docs/inventories/assets-sources.md",
  "docs/inventories/fleet-decomposition-matrix.md",
  "docs/inventories/fleet-fact-level-decomposition.md",
]

first_cutover = "dotmac_erp is cutover 1. Compose the as lineage in ERP's truthful tenant/organization mapping, backfill generic asset identity plus active/historical assignments, maintenance and disposal state, then shadow every old owner command in one transaction. Compare full-column typed digests and lifecycle event order, switch the only writer, and retire the displaced generic fixed-asset/vehicle lifecycle paths. Keep finance, inventory and vehicle extensions product-owned and rebind them through typed local relations. The eventual dotmac-erp assembly consumes the same released package rather than inheriting a copied ERP owner."

shadow_and_drift = "For every in-scope ERP asset, compare stable code, kind, serial/tag, physical state and condition, opaque location, active custodian, complete assignment chain, scheduled/in-progress/completed maintenance, disposal state and ordered lifecycle-event digest. Compare command refusals for stale state, duplicate active assignment, invalid transition, self-approval, unresolved custody and open maintenance. Finance values, stock movements, GPS coordinates and vehicle-only fields are excluded deliberately and are reconciled by their own owners. Seal the typed digest and effective privileges under ADR-0031 before switching reads/writes; the shadow is then removed."

local_copy_retirement = "After ERP cutover, delete or migration-seal the generic writers in app/services/fixed_assets/asset.py, app/services/fixed_assets/disposal.py, app/services/people/assets/{assignment_service,maintenance_service,lifecycle_event_service}.py and the overlapping identity/lifecycle branches in app/services/fleet/{vehicle_service,assignment_service,maintenance_service}.py. Retire or transform the displaced asset, assignment, maintenance, disposal and lifecycle tables only after backfill verification and rollback-window closure. Preserve finance tables/services and product-owned vehicle, inventory, files and positioning extensions, rekeyed to the module asset id. Two-directional caller/model/table ratchets reach zero before local ownership is declared retired."

next_action = "Validate the canary-first package on a fresh isolated Observer worktree. When the ERP adoption slice is ready, release the compatible kernel namespace allocation and dotmac-assets together, exact-pin them in ERP, write the ERP backfill/shadow/one-writer cutover and retirement ratchets, and keep the reference Starter assembly a non-consumer. Do not publish or call the module adopted before that cutover."

