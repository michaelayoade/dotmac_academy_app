composition_boundary = "Each adopting application pins the released package, runs the pe lineage in its own database, binds party_person_catalog.v1 to its own qualifying Party provider, and owns its sessions and authorization. The module imports only dotmac-kernel, never an assembly, sibling module, ERP model, or product adapter."
inventory_evidence = ["docs/inventories/people-directory-sources.md"]
first_cutover = "dotmac-erp is the first exact-pin consumer and replacement authority. Employment Type catalogue administration is the first vertical authority slice: bootstrap and shadow the catalogue, atomically repoint its API/web commands, disable every importer/script bypass, and keep hr.employment_type only as a module-derived compatibility table for retained Employee and Payroll foreign keys. Later slices move the other catalogues, Employee, positions and assignments independently."
shadow_and_drift = "Employment Type reconciliation preserves source UUIDs and the historical projection fingerprint while deriving an algorithm-versioned target fingerprint over the module-owned state. A fixed-point shadow compares missing, extra, conflicting and stale rows without writing the historical owner. Later entity slices add their own typed reconciliation evidence; the date-sensitive position projection must gain an explicit as_of before it is eligible."
local_copy_retirement = "The Employment Type slice retires its full legacy decision-writer set together and names one same-transaction projector as the only writer of the retained hr.employment_type compatibility table. Subsequent two-directional writer ratchets reach zero per entity. Delete legacy People tables only after the checked-in physical foreign-key ledger is empty; zero ledger rows without zero authority is not success."
next_action = "Publish the remotely verified dotmac-people 0.1.0a2 artifact, install ERP's prepared exact a2 lock, then execute and record the separately authorized Employment Type dry-run, fixed-point bootstrap and compatibility-repair sequence. After that evidence is accepted, choose the next catalogue slice without widening Employment Type authority."

