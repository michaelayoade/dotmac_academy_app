first_cutover = "Per slice. tokens: done -- dotmac_sub and dotmac_academy_app are merged external consumers on their default branches, serving the packaged asset through assembly-owned composition rather than copied stylesheets. components: done twice over -- dotmac_erp main at 462b6fa and dotmac_sub main at 73c35f4 both pin released 0.1.0a7, resolve the package-owned empty_state template through their real Jinja loaders, and exercise it through product-owned adoption tests. map-frame: not begun by owner direction; the audited candidates are dotmac_sub dispatch live-map/playback and dotmac_erp geofence editing, and neither is changed or counted by this slice. The starter remains reference proof rather than an independent cutover."
shadow_and_drift = "Per slice. tokens: consumer visual, accessibility, two-brand, CSP, and compiled-asset checks compare the package with the product surface; dotmac_sub additionally carries tests/architecture/test_dotmac_ui_adoption.py. components: clean-host, installed-wheel, registry-installed, escaping, token-native and product-seam sensitivity proofs guard the shared core; ERP and Sub each pin the release, assert the declared empty_state contract, resolve it through the product loader, and reject a vendored package template. Their local compatibility adapters contain no component markup, so the package remains the one renderer. map-frame: clean-host rendering, exact state/signature checks, provider/product-policy sensitivity proof, token-native sizing and state contrast protect the candidate; no cross-product drift claim is made before adoption."
local_copy_retirement = "Per slice. tokens: dotmac_erp still builds its own live src/css tree; dotmac_sub's sanctioned green role-token overrides are a deliberate outcome rather than debt. components: ERP replaced its former empty_state body with a thin legacy-call-shape adapter over the package macro, and Sub replaced its byte-identical renderer with a thin include-context adapter; neither retains a second markup owner. The starter's table macro copy is already retired. CRM adoption is unscheduled, but its local empty-state renderer is a real legacy copy and must retire if CRM adopts the component; optional timing is not a claim of absence. map-frame: no product copy retires in this change; an authorized adoption must replace only the local outer frame and sizing rule while leaving provider and domain behavior local."
next_action = "Tokens and the empty-state component remain reuse-proven. The map-frame slice is audit-complete and deliberately unadopted: do not publish or call it reuse-proven until a product cutover is authorized. Its first adoption replaces only a local outer frame and sizing rule; provider runtime, viewport, data, domain policy and fallback lists remain product-owned. Keep the 851 hardcoded-palette baseline as a two-directional maintenance ratchet; create a theme package only on proven non-token structural demand."

adoption_evidence_schema = "v1"

# THE PACKAGE-LEVEL NOTE the tokens slice's Academy row refers to. Added
# 2026-08-29; before that the reference dangled, which is the same defect as a
# note pointing at a [[product_writers]] row that was never written.
#
# A pin is installation, not adoption. Every row below is `pinned_at`, and a
# presentation foundation is COMPOSED by two lines of a consumer's
# `app/assembly.py` — `packaged_static_dirs` and `stylesheets`, or
# `packaged_template_dirs` for the component library. That is Python, and an
# AdoptionEvidenceV1 assertion may only address a field in a structured file,
# so no truthful `adopted` row can be written for these consumers today.
#
# The `tokens` and `components` slices are therefore recorded in
# `PIN_ONLY_ADOPTION_DEBT` (`tests/architecture/test_product_first_extraction.py`)
# — declared debt under a two-directional ratchet, NOT an exemption and NOT the
# same claim as "reviewed and correct" (ADR-0018 / rule 25). Their cutovers are
# real and are described in `first_cutover`; what is missing is a row a checker
# can re-derive. A slice leaves the map when a consumer gains a structured
# composition declaration, or when the claim is corrected the way `dotmac-tax`
# was.

# ── Contract slices (schema 2) ──────────────────────────────────────────────
# This package publishes THREE contracts whose evidence differs. A single
# package-level state cannot describe that honestly: report the stronger and the
# weaker contract is overstated; report the weaker and the stronger is
# understated. The gate validates each slice independently and DERIVES the
# headline `status` above as the weakest of them.

