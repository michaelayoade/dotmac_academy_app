contract = "Create one durable tenant conversation per declared thread; append ordered inbound, outbound, and internal messages with one canonical identity that replays exact redelivery and rejects key reuse with different content; support opaque product-supplied thread and message references separately from provider transport evidence; bind append-only global- or account-scoped transport message correlations to a tenant message, replaying the exact binding and rejecting reuse by another message, while a channel declaring transport scope none cannot create a correlation key or row; late-bind only an opaque transport observation reference by tenant-scoped message UUID with exact replay and conflict protection; transition open, pending, snoozed, and resolved state through expected-state commands; represent finite snooze with a timezone-aware deadline or explicit indefinite snooze with the typed UNTIL_REPLY value (omitted snoozed_until remains invalid), persisting the latter as status=snoozed and snoozed_until=NULL; wake an indefinite snooze only on inbound module-owned message activity; reopen a resolved thread on a new inbound message; maintain a monotonic opaque-actor read cursor; and expose frozen typed tenant-scoped conversation get/list and ascending message timeline reads, with only declared filters, bounded opaque scope-bound keyset cursors, timezone-aware cursor timestamps, and UUID tie-break ordering. Correlation evidence is not deleted through its message or tenant parent. A product retains subscriber/person and all other domain relationships, must reuse its logical supplied message reference across retries, and owns timed wake scheduling. Every mutation participates in the caller's transaction and flushes without commit or rollback. NOT provider transport, connector installation, webhook authentication, raw provider payloads, delivery/retry, contact resolution, routing, assignment, presence, queues, attachments, realtime, templates, AI intake, tickets, subscribers, leads, customers, or product consequences."
