composition_boundary = "ADR-0024: each adopter installs its own selected Billing plane and owns its own rows. Billing imports no assembly, sibling owner, product, provider or ERP. RatedObligationOutputV1 is translated by an assembly to AcceptRatedObligationV1; confirmed Integrator observations become AcceptSettlementV1; Billing facts leave through typed events/APIs. The NumberingProvider is an assembly-supplied protocol, never a dotmac-numbering import. ERP maps immutable AccountingFactV1 values to ERP-owned accounts and periods and never writes operational receivables."
