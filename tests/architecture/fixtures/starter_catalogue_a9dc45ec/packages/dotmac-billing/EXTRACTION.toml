first_cutover = "dotmac_vendor_control_plane, platform plane. Revalidated at f8f8c3fd636e663e4a17275c19e82fc1667aa52a: no invoice, payment, receivable, settlement, credit-note, refund, reversal, subledger or posting writer exists under src/ or tests/; the application has no tenant_id/RLS data plane and must select ModulePlane.PLATFORM without a sentinel tenant. Adoption preparation adds composition, preview/reconciliation and role-isolation proofs only; production activation remains separately authorized. dotmac_sub at 0f3d26ecec4ace6ed7504f17f21aa3d8e3b4107f follows on the tenant plane through isolated backfill/shadow comparison and one coupled invoice/settlement/allocation watermark; its newly merged due-date and money-path constraints are preserved as source canaries, not as a second owner."
shadow_and_drift = "Vendor CP has no old financial writer: preview one real contract without persisting/numbering, exercise the same-currency scenario suite, prove every platform table is unreachable by app_user and reachable by platform_api, then rebuild each account/currency position and compare its canonical hash. Sub executes Billing against captured immutable inputs in a separate shadow database unreachable from product routes; the legacy writer remains sole production authority and no command is dual-written. Compare exact documents, settlements, allocation edges, three-lane positions, applied snapshots and accounting facts with zero money tolerance. Unknown due-date basis is reported but excluded from automated collections. Three consecutive complete reconciliations with zero unclassified drift gate the coupled watermark."
local_copy_retirement = "Vendor CP has no local financial owner to retire and may add none. Sub carries two-directional ratchets over invoice/credit-note lifecycle and numbering callers; obligation/rating/tax writers; settlement/allocation/refund/reversal writers; posting groups; mutable/direct balance paths; credit/deposit/adjustment writers; tax/FX decision paths; provider-event money consequences (retire to Integrator); and the invoice artifact relation. Counts fail on rise or unreviewed fall and reach zero before deletion. Historical rows remain labelled read-only evidence, never a fallback writer. ERP and Integrator are read-only integration evidence in this programme and retire nothing to Billing."
next_action = "The receivable-contract repair landed on main through PR 381 after direct CI run 32659107095 and pull-request CI run 32660183336 passed for head revision 3b9c122940e162d0bf918d42d98c7a1288be483b. Kernel a89 remains the honest minimum: it carries Billing's lineage allocation and every kernel surface this package consumes. Keep the module unallowlisted and never-published while the real Cloud adapter/composition gate is completed; publication still requires separate authorization. Production deployment, authority switching, legacy deletion and destructive retirement remain separately authorized and out of scope."

