contract = "Accept AcceptRatedObligationV1 and AcceptSettlementV1 exactly once; issue immutable invoice/credit-note facts; append allocation, deallocation, reallocation, refund and reversal posting groups; derive collectible_receivable, available_credit and prepaid_funding separately with dotmac_kernel.money.Money; publish account/currency ReceivablePositionV1 and invoice-grained ReceivableExposureV1 facts with Billing-owned financial state; publish InvoiceDocumentFactV1 and AccountingFactV1; record one official opaque file relation through RecordDocumentArtifactV1 and append physical replacements only through RepairDocumentArtifactV1 with strict semantic-digest matching. Reversal is a movement that may reopen a fact, never a steady state. NOT offers/contracts/cadence/proration, collections policy/cases/consequences, PSP clients/credentials/webhook verification/retry/checkpoints, numbering-series state, document rendering/bytes, product access consequences, GL/journals/chart of accounts/fiscal periods/statutory accounting/treasury/tax returns."
