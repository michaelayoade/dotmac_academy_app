adoption_evidence_schema = "v1"
composition_boundary = "ADR-0024: the vendor control plane installs its own cg lineage and owns its own agreement rows; no application shares a mod_agreements schema, an agreement row or a history row. ADR-0057 § 8: the module imports no sibling. dotmac-approvals supplies ApprovalEvidence as a VALUE through the assembly and dotmac-entitlement-allocation consumes agreement.activated.v1 the same way — neither is imported, and the module never executes another owner's consequence (ADR-0026 § 6). ADR-0006 D1: no foreign key leaves mod_agreements; counterparty_ref, release_ref, offer_ref and approval_decision_ref are opaque and unconstrained, so an executed agreement outlives a superseded release, a retired approval policy and a merged counterparty record. ADR-0019 § 1 and ruling A3: the counterparty reference is opaque and this module defines no counterparty master. ADR-0023 / ADR-0057 § 7: platform plane only, declared from the one consumer that exists today; tables is empty and no tenant plane is declared for later use."
inventory_evidence = [
  "docs/inventories/vendor-cp-gap-sources.md",
  "docs/adr/0057-the-vendor-control-plane-composes-existing-owners.md",
]
first_cutover = "Completed GREENFIELD on 2026-08-21 in dotmac_vendor_control_plane, not by row migration. The designated production target was measured empty, so v015_agreements_authority rechecks the premise under ACCESS EXCLUSIVE and refuses a populated estate rather than synthesizing contracts, hashes or history. Vendor exact-pins dotmac-commercial-agreements 0.1.0a1, composes the platform-only manifest and cg_0001_agreements lineage, and retains one typed adapter that resolves immutable offers, supplies the product capability catalogue and converts the authoritative Approvals request into content-bound evidence. Verified directly against the production database at 2026-08-21T14:17:32Z: mod_agreements live, public.contracts and public.contract_lines ABSENT, and app_user holding zero privileges on any mod_* schema."
shadow_and_drift = "No shadow phase is owed, and the reason is measurable rather than convenient. The capability exists in exactly one product (Knowledge `vendor-cp-capability-gaps-and-composable-plan`, Tier B: contracts 972 LOC / 2 tables), so there is no second writer to reconcile against and no parallel evaluator to compare. What IS owed at cutover is a data-bearing migration of the existing vendor_cp.contracts and contract_lines rows, because those rows are real: preserve every content_hash unchanged (an agreement whose digest moves invalidates its own approval), map pending_approval -> proposed, synthesise one AgreementEvent per historical transition from the platform audit log rather than inventing a clean history, and prove the pre- and post-cutover accepted snapshots digest identically. A populated legacy table encountered at cutover must fail the migration, not be silently skipped."
local_copy_retirement = "Complete for cutover 1 on 2026-08-21: src/vendor_cp/contracts/ service and models, and public.contracts / public.contract_lines are gone, verified absent on the production database. Original audit text follows. Owed by dotmac_vendor_control_plane at cutover: src/vendor_cp/contracts/{models,service,schemas,router,feature}.py, the contracts and contract_lines tables, and the ContractService call sites in the allocations consumer. The vendor keeps its own routes, its console screens and its vendor_accounts binding — a thin adapter that translates its account id into this module's opaque counterparty_ref. No product may keep a compatibility contracts table or a parallel lifecycle evaluator."
next_action = "Hold at `adopted`. Vendor remains authoritative on its exact published 0.1.0a1 pin; this repository's 0.1.0a2 source declaration is not adoption evidence and does not reopen or weaken the completed a1 greenfield cutover. Release and verify a2 through the protected workflow before Vendor exact-pins it, then use the bounded owner reader plus an assembly-owned sealed-watermark/parity proof before any future data-bearing estate backfill or cutover claim. `reuse-proven` still requires a SECOND real control plane completing its own cutover; there is no second candidate today. Keep the Vendor authority and zero-local-writer ratchets green. Do not add a delivery or acknowledgement concern here — dotmac-licensing owns that lifecycle and ADR-0010 moves its transport half to the Integrator."

