schema_version = 1
package = "dotmac-commercial-agreements"
classification = "optional-module"
status = "adopted"
source_mode = "product-first"
owner = "The durable commercial agreement between the platform operator and a counterparty: its identity and reference, its immutable accepted commercial snapshot, its evidence-bound lifecycle, its amendments and supersession, and the append-only record of every transition"
contract = "Open a draft against an opaque counterparty reference with promised lines naming a product, an opaque release/offer reference, a capability code and terms frozen as exact text; validate every promised code against the declaring product through a caller-supplied catalogue port; preserve expiry_date as the inclusive final in-term date and derive one explicit end_exclusive boundary for half-open-range consumers; expose the complete platform agreement estate through a bounded deterministic UUID-keyset reader returning detached frozen values with materialized lines; freeze an immutable accepted snapshot and its SHA-256 digest at propose; move draft -> proposed -> approved -> active -> suspended -> terminated | expired, plus reject, cancel and amend; require ApprovalEvidence whose content_digest equals the frozen digest for both approve and activate, and separate ActivationEvidence naming a satisfied rule with a reference; refuse a stale expected status or record version; make every command idempotent through the kernel's one at-most-once owner; append one immutable history row per transition carrying its evidence document; and emit one versioned fact per transition on the platform outbox. NOT product or release definitions, entitlement balances or allocations, licences, deployment state, invoices or collections decisions, approval workflow internals, counterparty master data, or stored bytes."
source_repositories = [
  "dotmac_vendor_control_plane",
  # Inventoried and found EMPTY, which is why they are listed. ERP's
  # `templates/procurement/contracts` is supplier procurement documents — a
  # shared word and nothing else — and Sub has no vendor<->operator agreement
  # at all; what it sells is ISP service to subscribers, a different subject
  # with a different owner (ruling A2(a)). Recorded per
  # docs/inventories/vendor-cp-gap-sources.md § 10, so the absence is evidence
  # rather than an untaken search.
