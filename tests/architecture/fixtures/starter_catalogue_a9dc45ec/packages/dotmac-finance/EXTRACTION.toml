composition_boundary = "ADR-0024/0038: each adopting application installs its own tenant-only fn lineage and owns its local finance rows. The module imports the kernel but no sibling or product. A physical-assets adapter supplies an opaque asset id and source version; chart-of-accounts and fiscal-period owners supply opaque references; a general-ledger reconciler consumes immutable balanced consequences. No application reads another application's database and no module-to-module FK or import is created."
first_cutover = "dotmac_erp is cutover 1 because its production-used fixed-assets stack is the qualifying source. Backoffice is the second candidate as an independent assembly consuming the exact released contract. Installing the package alone moves no authority; ERP remains owner until its sealed shadow/cutover retires every legacy book and consequence writer."
shadow_and_drift = "Backfill one module book per ERP asset/book with source id, source version, functional-currency balances and a full event fingerprint. Shadow depreciation schedules, impairment/revaluation allocation, disposal gain/loss and balanced account consequences without posting twice. Compare Decimal values after declared minor-unit rounding, periods taken, running reserve/loss balances and source evidence. Rehearsal must reach zero unexplained drift. Cut over under source-book write locks, then reconcile immutable module consequences to the product general ledger by idempotent source identity; no mirrored finance writer remains."
local_copy_retirement = "ERP retires its fixed_assets book, component, depreciation schedule/run, impairment, revaluation, disposal and GL-reconciliation decision writers plus AP/task/web direct callers after backfill, zero-drift shadow, sealed authority switch and rollback window. Physical asset identity/lifecycle fields move to or remain with Assets; AP capitalization and scheduled tasks become thin finance adapters. A bidirectional caller/table ratchet reaches zero. Backoffice creates no local fixed-asset accounting owner."
next_action = "Run the package, architecture and real-PostgreSQL canaries on Observer against an exact committed revision. Keep kernel a84 and Finance a1 unallowlisted and unpublished until ERP has a checked-in composition/backfill/shadow plan, corrected source parity fixtures and an authority-switch rehearsal."

