composition_boundary = "ADR-0024: each adopter installs its own im lineage and owns its own run ledger. Applications share the package contract, never a mod_imports schema or a run row. An import performed in one application is that application's fact; another app learns of its results through the owning app's versioned API/webhook, never by reading its ledger. The domain's validator and applier are product code supplied at the call site, never product/provider switches inside the module."
inventory_evidence = [
  "docs/inventories/imports-sources.md",
  "docs/inventories/imports-large-migration-sources.md",
  "docs/adr/0025-imports-own-the-run-not-what-a-row-means.md",
]
first_cutover = "dotmac_erp is cutover 1. Product-first requires a qualifying source product to retire its local owner, and ERP is the half with no durable record at all — its adoption is a capability gain rather than a relocation, which makes the parity evidence unusually clear (before: an in-memory ImportResult; after: a queryable run). ERP now has the Organization-to-Tenant mapping, composed lineage, dotmac-files partition storage, product-owned customer validator/applier, scheduling and repair surface, shadow verdict comparison and concurrent-claim PostgreSQL proof; publication of a2 and the exact registry lock are the remaining pre-merge gates. dotmac_sub is cutover 2, retiring app/services/import_runs.py and moving its two tables into the im lineage while web_system_import_wizard's ENTITY_CONFIG stays in Sub as the domain half. dotmac_crm is retired from the programme and remains source evidence only, never a recreated consumer. Neither dotmac_academy_app nor dotmac_vendor_control_plane is a candidate — Academy's content_import is markdown authoring over a filesystem tree and Vendor CP has no import capability at all."
shadow_and_drift = "ERP's cutover runs each entity importer's existing in-memory path and the module-backed path over the same document and compares row-for-row: same accepted count, same rejected rows with equivalent typed safe reasons, same resulting entity ids. Because ERP has no prior ledger there is no historical record to backfill and no drift class from one — the comparison is between two live paths, and the module's ledger becomes the first durable one. Sub's cutover is the opposite shape: its ledger already exists, so every import_runs / import_run_rows row is compared against the module row created from the same input (kind, status, counts, per-line status and classified error), the payment provenance columns are verified to have moved to the domain side with no row losing its link, and the inline input_text is verified against the dotmac-files object's SHA-256 before the column is dropped. Imported row values are not copied into the new ledger. Both cutovers run the new path in dry-run only until the row-for-row comparison is clean."
local_copy_retirement = "ERP must reduce app/services/finance/import_export/base.py to a domain FieldSet plus its 23 validators and appliers, with decoding, mapping, preview and the run loop coming from the pinned dotmac-imports release; a two-directional import/caller ratchet reaches zero before BaseImporter is deleted. Its COLUMN_ALIASES, VALID_ACCOUNT_TYPES, VALID_CURRENCY_CODES and vendor-format detectors stay in ERP as finance vocabulary and must not migrate into the module. Sub must delete app/services/import_runs.py and its import_runs / import_run_rows tables after the module lineage is composed, keeping ENTITY_CONFIG and _persist_row as the domain half; PaymentImportBatchReversal stays in billing and is never reproduced in the module. CRM deletes app/imports/loader.py outright. No permanent mirrored ledger, second run table, or parallel dry-run implementation is allowed."
next_action = "Publish 0.1.0a2 through the now-authorized closed module lane, then generate ERP's exact Poetry 2.4.1 registry lock and merge its first-adopter slice. Keep contract_consumers empty until that exact pin and composed im lineage merge; publication alone is not adoption. Run real customer-master CSV files through the legacy and durable dry-run paths until row-for-row verdicts and resulting entity ids match, then seal and retire the legacy decoding/mapping/run loop with its caller ratchet lowered in the same change. Port ERP's XLSX/XLSM reader as an openpyxl extra and legacy XLS as an xlrd extra with their source parity tests after the CSV cutover, not as untested formats ahead of a consumer. Sub follows. CRM remains inventory evidence only and is not revived as a consumer. PostgreSQL COPY, database extraction and export remain separate candidates requiring source evidence."

