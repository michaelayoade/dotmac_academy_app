schema_version = 1
package = "dotmac-imports"
classification = "optional-module"
status = "audit-complete"
source_mode = "product-first"
owner = "The durable record of a bulk import: the run, its immutable partition plan, its rows, and what became of each one"
contract = "Record an operator-initiated import of one stored document; verify immutable source/partition SHA-256; validate without holding anything that could mutate; promote one validated run into one apply run; advance either one locked ordinary chunk or one atomically claimed bounded partition; and commit each domain effect with its minimised row outcome plus the owning checkpoint. Stream large CSVs into bounded dotmac-files artifacts, clone the exact validated plan on promotion, read each claimed object outside every database transaction, refuse stale claim settlement, and preserve a product's typed non-writing skip outcome without invoking its applier. Persist only opaque file ids, ranges, checksums, row fingerprints, bounded typed safe errors and opaque results — never mapped row values or raw exception text. NOT field vocabulary, business validation, duplicate policy, domain mutation/reversal, stored bytes, worker-count policy, database extraction, COPY or export."
