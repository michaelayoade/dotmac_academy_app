first_cutover = "VMID 124 becomes the first adopter only after an exact protected-main build renders one bundle, both repository diagnostics reach terminal provider-recorded success, a cold reboot repeats them, and the observed-broker inventory and its autonomous timer can no longer recreate legacy state."
shadow_and_drift = "Run the existing observed-host policy and the rendered proxy policy as separate measured candidates without granting the runner direct fallback; compare endpoint denials and terminal diagnostic outcomes. Provider metadata collection reports semantic drift but never auto-admits it. A fetch failure retains the last working checked-in snapshot and fails the update job."
local_copy_retirement = "Retire /etc/dotmac/actions-brokers.conf, dotmac-runner-broker-guard and their timer only after two successful transport cycles, a complete displacement window and no_autonomous_return through a cold reboot. The host-wide egress generator remains for unrelated host traffic and consumes the rendered runner fragment instead of a parallel hostname list."
next_action = "Land the facility and GitHub Actions adapter without enrolling either release lane; build one reviewed host bundle from protected main, pilot VMID 124, record its receipt, then enroll releases after Foundation 0.3.0a2 is published."

