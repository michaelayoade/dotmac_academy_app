composition_boundary = "Ticketing retains complaint/case state; every source domain supplies typed evidence and remains authoritative for its facts. Files stores bytes, Template/Rendering renders, Durable Timers schedules and Integrator transports. This module stores digests/references and filing decisions only, with no cross-owner query or FK."
