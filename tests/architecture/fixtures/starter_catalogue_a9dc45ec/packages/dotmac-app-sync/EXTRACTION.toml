first_cutover = "One destination exact-pins an exact-SHA source build, publishes one destination-owned capability schema, authenticates the source in its own thin adapter, and implements atomic deduplication plus local resolver invocation in its own transaction. Publication is held until that pilot changes or confirms the seam."
shadow_and_drift = "Mirror the same outbox observation through the existing path and this contract, compare the destination owner's resulting local decision by source event identity, and retain queryable mismatch evidence. The wire package never decides equality for a domain it does not own."
local_copy_retirement = "After each capability cutover, remove only the replaced pairwise envelope/auth/idempotency glue. Keep each product's durable outbox, authenticated adapter, local observation model, resolver and owning service. No product imports another product or delegates its decision."
next_action = "Pilot one exact-SHA build in the destination with the simplest already-owned receiver, then add dotmac-app-sync to the stateless-adapter release lane with that consumer proof. Sub-to-ERP, ERP-to-Sub and both Academy flows remain product-repository cutovers after this reusable contract merges."

