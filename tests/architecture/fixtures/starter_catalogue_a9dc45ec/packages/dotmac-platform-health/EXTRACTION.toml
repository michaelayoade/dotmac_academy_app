composition_boundary = "Authenticated source identity is resolved outside and supplied as a proven value. An assembly supplies the domain-specific HealthEvidenceSigner; key material and cryptography remain outside this module. Observability systems retain raw telemetry; Ticketing/incident owners retain cases; Deployment Control owns desired state. This module emits health/freshness facts and canonical evidence, has no mutating consumer, sibling import, product DB read or provider transport."
inventory_evidence = ["docs/inventories/sub-vnext-parity-sources.md", "docs/inventories/sub-vnext-parity-dispositions.toml", "docs/adr/0040-sub-vnext-parity-capabilities-have-narrow-independent-owners.md"]
source_mode_note = "The fleet has internal task heartbeats and domain-specific pipeline health but no general authenticated application/runtime-health projection. Their bounded labels, age/depth separation, freshness and no-consequence behavior are references; the owner is greenfield after inventory."
first_cutover = "Vendor control plane is cutover 1. One deployment identity sends a bounded application-health envelope through the Integrator; the module projects freshness and summary while the existing deployment owner is proven unchanged."
shadow_and_drift = "Delete and rebuild projections from retained observations and require byte-identical latest-state/freshness/summary output. A stale/unhealthy input may emit an alert fact but must never start a rollout or change an entitlement."
local_copy_retirement = "Retire only parallel general fleet/application health projections after composition. Keep Prometheus/OTel/log/trace stores, product-local raw collectors, network monitoring and domain-specific health owners."
next_action = "Compose the platform-only ph lineage with immutable observations, rebuildable projections, an assembly-supplied evidence signer, platform grants/tenant revoke and freshness/no-mutation canaries; retain the legacy-provenance refusal until a newer observation repairs the selected latest state."

