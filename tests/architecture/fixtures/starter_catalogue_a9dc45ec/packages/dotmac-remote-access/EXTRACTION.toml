preserved_tests = ["dotmac_sub:tests/test_ont_features_service.py", "dotmac_sub:tests/test_reconcile_adapters.py", "dotmac_sub:tests/test_reconcile_planner.py", "dotmac_starter_mt:tests/unit/test_remote_access.py", "dotmac_starter_mt:tests/test_sub_vnext_modules_isolation.py"]
