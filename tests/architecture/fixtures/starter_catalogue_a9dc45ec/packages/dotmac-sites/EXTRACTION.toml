authority_boundary = "dotmac-sites owns local site/page composition and release-readiness only. dotmac-files owns stored bytes, dotmac-forms owns form definitions/submissions, dotmac-publishing owns publication requests, attempts and outcomes, and Integrator owns hosting installations, credentials, provider execution, retries, checkpoints and transport evidence. The package exports one immutable SiteReleaseV1 value for a local renderer or a typed assembly adapter; it writes no publication outbox and imports no sibling module."
