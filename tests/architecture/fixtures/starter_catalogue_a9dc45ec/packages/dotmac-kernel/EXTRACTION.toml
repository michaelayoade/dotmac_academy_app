first_cutover = "The starter reference assembly consumes the extracted settings, consent, delivery, and channel-policy facilities; product-by-product released-pin cutovers follow the existing-product adoption plan. MACHINE CREDENTIALS (2026-08-22): not started. dotmac_sub is the first cutover and the licence destination, so its descriptor route (Vendor ADR-0010 gate 2b) is the first caller. It did not PULL the facility: the demand came from a separate ISP assembly that needed an authenticated descriptor route and had no kernel guard that fitted, and ADR 0012's conversion amendment then ended that assembly. The distinction is worth keeping — a facility attributed to whoever adopts it first loses the reason it exists, and the reason is what a later reader checks the design against. CORRECTED the same day: this said dotmac-isp composes the released kernel greenfield and \"has no legacy verifier to retire, so its cutover proves the facility rather than a migration\". Governance ADR 0012's conversion amendment ended the separate ISP assembly — Sub is not retired, it becomes the thin assembly in place — and Sub DOES hold a legacy verifier. So this is a migration, not a greenfield proof, and it inherits the Sub reissuance gate recorded in local_copy_retirement below: Sub's verification key is derived from the connector-credential encryption key, so every credential must be reissued before app/services/auth.py's hash_api_key, hash_api_key_candidates, _maybe_upgrade_api_key_hash and _touch_api_key_last_used can retire. PERMISSION PROVISIONING (2026-08-26): the Starter assembly is the compatibility-shadow consumer; ERP PR #370 at commit 623c6d588c9b6df4ed9a162d5b0f07155c0f7314 is the first merged persistence implementation, through a self-contained additive Alembic migration rather than a startup writer or full-seed deployment step. It is not a production cutover until deployed, and it does not consume the shared package. CREDENTIAL LIFECYCLE (2026-08-30): not started, and deliberately sequenced behind two gates that are not this lane's to open. dotmac_sub is the named first adopter, beginning with app/services/auth_flow.py (the de facto canonical owner on every axis), and its cutover cannot begin until (1) the Sub containment lane releases the Sub writer lease and (2) Michael authorizes a kernel release whose version is DERIVED from immutable tags at that time. No kernel version is allocated by the change that added the facility. Nothing composes it today: this is an extraction with a named first adopter, not an adoption. REQUEST EVIDENCE CONTEXT (2026-09-04): NOT STARTED, and deliberately not declared. `dotmac_kernel.request_evidence` implements the Foundation's `request_evidence_context` concern, extracted product-first from ERP (app/net.py and app/observability.py at e286636baea382e3978e779acd3155cea27e82b8). dotmac_erp is the named first adopter and dotmac_sub follows. NO profile binding is registered, no provider entry point is declared, and the Platform CP verifier is untouched: a binding whose only consumer is a test is absent, so the declaration belongs to the change that brings an installed artifact and real assembly wiring with it. Nothing composes the facility today. dotmac_sub is inventoried and qualifies for nothing here — it has no trusted-proxy resolver and no request evidence context, and its two inventoried paths are anti-patterns the extraction refuses to reproduce. SEMANTIC ENCODING (2026-09-02): NO CUTOVER HAS OCCURRED, published or otherwise. What happened is COORDINATED INCUBATION COMMITS — three local commits on unpushed branches (this one, `incubate/orders/slice-1`, `incubate/refund-warrants/slice-1`) that add the kernel owner and delete both local copies together, so the facility gains an owner rather than a third writer. That is a local sequencing property, not an adoption: nothing composes these branches, nothing runs this encoder in production, and a cutover is a claim about production that three unpushed commits cannot make. CORRECTED the same day: this said \"both consumers cut over in the SAME change\" and named Orders \"the qualifying product-first source\". Both were wrong. Orders and Refund Warrants are LOCAL INCUBATION SLICES, and rule 24 requires a qualifying product-first source to be a production implementation, so neither slice can be one. This lane is `greenfield-after-inventory` (see source_mode_note above), licensed by the negative inventory in docs/inventories/semantic-encoder-sources.md, and INFORMED BY two independently convergent implementations that are evidence the design is right rather than a source it was ported from. The first cutover is therefore not yet named and cannot be until a kernel release exists and a consumer is promoted with a sufficient dependency floor."
shadow_and_drift = "Each product must run parity, profile, migration, and product behaviour tests before removing its local implementation. MACHINE CREDENTIALS: the parity set is Sub's own api-key suite (test_api_key_scopes, test_api_key_principal, test_api_key_hmac_hashing, test_web_system_api_keys_service, test_crm_service_auth) run against the kernel facility, with the DEPARTURES asserted rather than skipped — a wildcard scope authorizes nothing, an empty scope list authorizes nothing, a rotated-away key keeps working until complete_rotation, and an un-attributed credential does not authenticate. A parity run that merely passes Sub's suite unchanged would prove the extraction had reacquired the defects. PERMISSION PROVISIONING: compare the schema-versioned plan digest and the complete declared role-grant profile against product catalogue rows; prove missing additions, inactive conflicts, idempotence, and preservation of every extra role, permission, description, membership, direct grant, and role-permission link. CREDENTIAL LIFECYCLE: the parity set is Sub's own auth suite (test_auth_flow, test_auth_flow_helpers, test_web_customer_auth, test_staff_provisioning_owner, test_reseller_onboarding, test_credential_recovery_boundary, test_credential_literals) run against the kernel facility with the DEPARTURES asserted rather than skipped: lifecycle state disclosed only after the password matches, a missing credential costing the same work as a live one, provisioning accepting no material at all, and generated material reaching no return type, log, exception, repr, receipt or audit row. A parity run that merely passes Sub's suite unchanged would prove the extraction had reacquired the shape it exists to prevent. Drift is measured continuously rather than at cutover: scripts/credential_lifecycle_sweep.py counts direct hash_password/verify_password/password_needs_rehash CALLS across every Python entry-point family in four repositories at immutable commits, and docs/inventories/credential-lifecycle-baseline.json freezes the result two-directionally. REQUEST EVIDENCE CONTEXT: the parity set is ERP's own two suites (tests/test_net_trusted_proxy.py, tests/test_observability_request_context.py) run against the kernel facility, with the DEPARTURES asserted rather than skipped: the trusted set is typed configuration rather than an import-time os.getenv read, the actor arrives through a product resolver rather than a JWT decoded inside the middleware, and the actor kind is declared rather than absent. Two ERP repairs are parity behaviour and not tidying — a bare address derives its prefix from the address family (fail-OPEN before: a bare ::1 parsed to ::/32 and trusted 7.9e28 hosts) and an explicit prefix survives as written (the near-miss a refuse-all-IPv6 fix would satisfy while deleting real configuration). Drift on the concurrency proof is measured rather than asserted: asyncio runs every task in a COPY of the context, so a task-based concurrency test cannot fail, and test_the_concurrency_proof_alone_would_pass_against_the_broken_shape drives the planted broken creator through the same assertion and REQUIRES it to pass, so that fact cannot quietly stop being true. The proofs that can fail are the sequential anonymous-after-authenticated leak and the nested overlap inside a single context; both are run against a planted _ErpShapedContextCreator and required to fail there. SEMANTIC ENCODING: there is no product-local implementation to run parity AGAINST, which is the inventory's finding rather than a gap in this lane — docs/inventories/semantic-encoder-sources.md audits seven repositories at immutable origin/main revisions and finds no encoder anywhere with all four qualifying properties (length-prefixed framing, a TYPED absence sentinel, exact money at currency scale, a domain-separated digest), and records that NOT ONE audited implementation has the typed sentinel. What was run instead is a byte-parity shadow against the two incubation copies. It was run BEFORE unification rather than after, because the risk here is a byte change and not a behaviour change. Three implementations — Orders' identity.py, Refund Warrants' identity.py and the kernel module — were loaded side by side and driven over one 76-case corpus covering every encodable scalar type, every refusal, both container orders, the absence sentinel and both digest domains, comparing raw BYTES rather than digests; zero mismatches. Independently, the three parse to an identical AST once docstrings are stripped (sha256 c56642b3163de6941f6e707896e7e232a7b09a7768b727c99c75d4c724772aa6), which is also the proof the two local copies had NOT drifted from each other before unification. Ongoing drift is prevented by construction rather than measured: there is one implementation and no local copy left to drift from it, and tests/unit/test_semantic_encoding.py pins the cv1 bytes as LITERALS so a change to the encoder cannot be absorbed by an expectation the encoder computes."
local_copy_retirement = "A product-local owner is removed only after its released kernel cutover and parity gate; task #22 owns the outstanding ERP/Sub settings-domain repair, while Sub's communication eligibility, notification receipt, and channel-policy paths retire only after their kernel adapters pass the preserved behavior proofs. MACHINE CREDENTIALS: adoption is credential REISSUANCE, never a hash migration — a stored digest holds neither the raw key nor material to re-key from, so no conversion or backfill exists. Sub: scope semantics already match, but its verification key is derived from the connector-credential encryption key, so every credential must be reissued before app/services/auth.py's hash_api_key, hash_api_key_candidates, _maybe_upgrade_api_key_hash and _touch_api_key_last_used retire. ERP: gated on resolving every active null/empty-scoped key — inventory by IDENTIFIER only, assign an owner and explicit minimum scopes, revoke unused and reissue retained, and treat every unresolved active key as a CUTOVER BLOCKER. An empty scope list may never be translated into a wildcard or all-current-permissions. ERP runs a bounded old/new verification transition with a checked retirement deadline; that legacy verifier stays in ERP and never enters the kernel, which has one scheme and no fallback. PERMISSION PROVISIONING: `PermissionSpec.default_roles` retires only after every adopting product persists its assembly profile, proves decision parity, and changes authorization to the product-owned catalogue. Seed-owned role mappings retire only after the product service or migration adapter is the named writer; no destructive convergence is allowed before a multi-owner claim ledger exists. CREDENTIAL LIFECYCLE: a product-local verification or hashing owner is removed only when every verification path in that product returns a facility verdict and none re-derives active/locked/reset-required from raw fields; every credential-creating path calls provision and none accepts caller material (the parameter GONE from the signature, not merely unused); reset completion runs behind a single-use recovery authorization; the parity set above passes with its departures asserted; and the baseline is lowered in the SAME commit so the retirement is reviewable as a diff. Sub retires four verification owners (auth_flow, web_system_db_inspector, web_system_profiles, web_customer_auth) and eleven hash_password caller files including two seed scripts. ERP follows under its own gate; the vendor control plane has no reset-required concept at all and adopts the verdict type before it adopts anything else. AccessCredential and SnmpCredential are device/service credentials and are never in scope. REQUEST EVIDENCE CONTEXT: ERP's app/net.py and its ObservabilityMiddleware context creation retire only after ERP composes a released kernel, all six consumers of the client address (rate limiting, CSRF, the password-reset URL, the HR API, the employee web surface and the audit listener) read the facility's evidence, and the parity set above passes with its departures asserted. ERP's request-path helpers get_request_scheme/get_request_host are ported and retire with net.py. Two retirements are owed INSIDE this repository as well, and neither is done: dotmac_kernel.middleware.observability.ObservabilityMiddleware writes the same dotmac_kernel.logging.request_id_var this facility bridges to, so the two are ALTERNATIVES rather than layers and an assembly must never install both — no guard catches that today, and none is claimed; and nothing compares a declared [ingress] trusted_proxies with the policy the process actually constructed, which is the readback hole ERP recorded at docs/inventories/2026-09-04-erp-proxy-trust-readback-hole.md, reachable with no typo at all because unset is empty and empty is valid by design. SEMANTIC ENCODING: both local copies are GONE across the coordinated incubation commits, not deprecated and not aliased. Retiring two local incubation copies is not a product cutover and is not recorded as one — no product owner is retired by this lane, because the inventory found no product owner to retire. Each slice's own architecture test proves the absence structurally rather than by filename — it AST-scans every module in the slice for a local length-prefixed framing implementation and for a redefinition of any name the kernel facility owns — so re-adding the encoder under a different filename fails the slice. `fingerprints.fingerprint_of` is deliberately NOT retired and NOT changed: its bytes are a compatibility contract compared against fingerprints already persisted in idempotency_records, so framing or type fidelity there would move every stored value and turn live replays into conflicts. The two facilities are documented side by side in COMPATIBILITY.md so a later reader does not harmonise them."
next_action = "Publish the demand-pulled product-manifest contract, make Sub's release path emit it from SUB_ASSEMBLY, and replace Vendor's configured capability lists and duplicate catalogue protocol with digest-verified snapshots before the Entitlement Allocation writer cutover. The broader adoption sequence remains Sub settings first, then ERP. MACHINE CREDENTIALS: release the hardened facility (tenant-scoped RLS-protected credential, X-Api-Key against a dedicated held key, exact scopes with empty authorizing nothing, active/expiry/revocation, typed MachinePrincipal, require_machine_scope inside an established tenant scope, and no admin access, wildcard, human-user requirement, commit, rollback or authentication-time telemetry write), then pin it in dotmac_sub under the reissuance gate above; ERP adopts separately under its own. There is no separate ISP assembly to pin it in. ATTRIBUTION + ROTATION (2026-08-24, unreleased, migration 0028_machine_attribution): the facility now carries a source application on the credential, the principal, every CommandEnvelope and every audit row, and a rotation window in which two secrets authenticate to the same principal until an explicit complete_rotation. Sub owes TWO follow-ups before it can pin this kernel: (1) its migration 551 transcribed machine_credentials from the a90 model, so the 0028 columns are a further migration there; (2) an operator must attribute every credential row, because source_application is nullable for one release only and an un-attributed row does not authenticate. Sub must ALSO reconcile its own scope enforcement: has_permission expands the required permission through _wildcard_ancestors and _permission_domain_aliases, so a Sub key holding network:* or * has authority the kernel facility will not reproduce — each such key needs explicit leaf scopes assigned before reissuance, and translating a wildcard into all-current-permissions is refused for the same reason ERP's empty-means-everything is. CREDENTIAL LIFECYCLE (2026-08-30, unreleased, no version allocated): wait for the Sub writer lease and Michael's release authorization, then pin the released kernel in dotmac_sub and route app/services/auth_flow.py verification through the facility, keeping Sub's own HTTP mapping and session issuance. The other three verification owners follow, then the eleven hash_password callers. No production account reset belongs to this extraction lane. REQUEST EVIDENCE CONTEXT (2026-09-04, unreleased, no version allocated): confirm what `scope` means in the actor triple before any binding is declared — it is implemented as the actor's AUTHORIZATION SCOPE SET, carried as evidence and given no meaning here, and the alternative reading (tenant scope) was not chosen by a record. Then land assembly wiring plus an installed artifact, declare the profile binding in that same change, and pin the released kernel in dotmac_erp as the first adopter. Sub follows and must additionally retire the two inventoried anti-patterns (app/services/audit_helpers.py deriving an actor kind by splitting an identifier, app/api/crm.py deriving caller identity from the presence of a scope) rather than adapting them onto the facility. SEMANTIC ENCODING (2026-09-02, unreleased, NO VERSION ALLOCATED — and no pin either). The next step is an ORDERED RELEASE TRAIN, set by Michael, and nothing later in it can start before the step above it: (1) repair this dossier and its inventory evidence — DONE by this change; (2) merge the kernel stack 3224eb15 -> 1d00567b -> 575b7506 -> 1e214679; (3) publish the derived kernel version, DERIVED from immutable tags at that time and never invented here; (4) verify the registry artifact — a published version is a claim an external oracle has to confirm; (5) raise the exact consumer floors to that verified version; (6) run the Orders, Refund Warrants and catalogue suites AGAINST the published artifact, since none of their counts today were measured against one; (7) promote the consumers and repin Suite. Two facts belong with that train. FIRST: the consumer branches may remain deliberately unimportable during incubation — their suites fail at collection against any kernel on an index and that is a recorded state, not a broken checkout — but they must NOT be promoted with an insufficient dependency floor; step 5 is the gate, and a promotion that skips it ships a package that cannot import what it binds to. SECOND: this train is not the encoder's alone. The same kernel release also unblocks the SEVEN managed-capability contract catalogues importing canonical_json_bytes (commit 3224eb15), so the release is shared and its sequencing is not this lane's to reorder. The pin question stays REFUSED, and the distinction is the point: the inventory evidence IS citable at immutable revisions — every row in docs/inventories/semantic-encoder-sources.md names a commit reachable on its repository's origin/main — while the incubation branches are NOT. Both slice branches have a push remote that deliberately does not exist (LANE.md), so neither head is fetchable, tagged or resolvable by any reader but this workstation. So no source_revisions entry names an incubation head, no pinned_at is recorded, no source_paths entry is added (those must resolve in this tree and the slice paths do not exist on this branch), and no version floor is invented: the floor a consumer would need does not exist on any index, and naming one would assert a release no oracle can confirm — the claim rule 26 and Governance ADR 0013 forbid. An inventory can be pinned; an unpushed branch cannot."
