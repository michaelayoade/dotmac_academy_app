contract = "Implement Flutterwave API v4 through dotmac-integration SPI >=1.4,<2.0 for connector key flutterwave: capability payments.settlement.observation.v1 in INGRESS and POLL modes, and payments.intent.v1 plus payments.refund.v1 in DELIVERY mode. Outbound carries the engine idempotency key to the provider v4 X-Idempotency-Key header, writes every amount as an exact JSON number from a Decimal, requires an explicit currency and minor-unit exponent, and returns the provider transaction reference as Outcome.provider_reference on every outcome including a decline. Verify flutterwave-signature over exact bytes, authenticate reconciliation through v4 OAuth, page only the v4 charge list and accept no v3 fallback. Carry exact amount, currency, provider status, merchant reference and transport evidence. Do not invent provider_fee. Own no product identifier, tenant, allocation, coverage, balance, receivable state, net-amount arithmetic, retry/checkpoint engine, row, session or product database."

