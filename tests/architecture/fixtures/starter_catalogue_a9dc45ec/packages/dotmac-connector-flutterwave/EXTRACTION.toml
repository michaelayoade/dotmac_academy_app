first_cutover = "Sub through dotmac_integrator, after the published Paystack evidence. Sub's v3 callback remains authoritative while a separately configured Flutterwave v4 callback feeds Integrator. Only exact-byte HMAC-SHA256 v4 events enter the settlement-observation path; this connector provides no version fallback."

shadow_and_drift = "Run the v4 callback into Integrator while Sub's existing v3 receiver remains the sole producer of financial consequences. Correlate by merchant reference and compare provider-event coverage, terminal status, exact amount, currency and transaction identity; app_fee cannot be compared because v4 does not carry it. Require independent API-v4 charge-list confirmation through the same settlement-observation capability before product acceptance. Cut over only after zero unexplained drift, then remove Sub's v3 verification/normalization and lower its external-connector ratchet in the same change."

local_copy_retirement = "Retire only Flutterwave transport: Sub's provider branch, direct callback, authentication, manifest, paged charge-list client and private checkpoint. Sub keeps payment_provider_events.py, payment_reconciliation.py, every intent service, allocation, coverage and lifecycle decision. Money-moving intent/refund clients remain until their product-owned command contracts exist."

next_action = "DECLARED AS 0.1.0a3, NOT YET RELEASED: this tree extends the manifest of the already-tagged 0.1.0a2, and a published version's manifest digest must not change. The published ingress+poll shape is preserved as INGRESS_POLL_MANIFEST in historical_manifests and its digest is recorded in docs/inventories/released-manifest-digests.json, so a pinned adopter still resolves. Then publish after dotmac-integration 0.1.0a14 (SPI 1.4 per-capability modes; ig_0012_delivery_evidence for the durable provider_reference the outbound leg depends on), exact-pin it in dotmac_integrator, reconcile the payments.settlement.observation.v1 ProductPort, configure the v4 callback and v4 paged poll, then run the Sub v3-to-v4 shadow cutover. Keep status audit-complete until direct v3 transport is retired."

