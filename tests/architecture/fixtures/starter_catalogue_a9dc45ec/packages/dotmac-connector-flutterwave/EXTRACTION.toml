# There is NO v4 outbound implementation anywhere in the fleet to port: ERP has
# no Flutterwave client at all, and Sub's `payment_gateway.py` is v3 only (its
# ADR-0005 records that v3 key issuance was withdrawn and a v4 OAuth rewrite is
# unstarted). So what was ported is Sub's BEHAVIOUR — payload shaping, refund
# targeting, envelope/status classification and the observed defects — carried
# onto the v4 endpoints this connector already authenticates against. Recorded
# plainly because "ported the v4 client" would be false.
ported_behaviour = [
  "initialize shapes reference/amount/currency/redirect_url/customer.email/meta (payment_gateway.py:314-351)",
  "refund targets one provider transaction, omits amount for a full refund, and carries an opaque note (payment_gateway.py:353-385)",
  "5xx is retryable and a 4xx is rejected, never retried (payment_gateway.py:138-159)",
  "a status token outside the known vocabulary fails closed to unknown rather than to success (payment_gateway_adapter.py:50-63, 229-237)",
  "the provider transaction id is required evidence and is bounded (payment_gateway_adapter.py:249-263)",
]

port_deltas = [
  "the amount is an exact Decimal written as a JSON number by a hand-written encoder; the source coerces it through a binary floating-point value at payment_gateway.py:331 and :371",
  "the currency is REQUIRED with no default chain; the source falls back to config default_currency and then to a hardcoded NGN at payment_gateway.py:333",
  "the minor-unit exponent is stated by the command, so no ISO-4217 table lives in the transport and a non-NGN currency needs no connector change",
  "idempotency rides the provider X-Idempotency-Key header; the source's only refund dedupe was a request_key stuffed into the free-text comments field and recovered by substring match at payment_gateway_adapter.py:422",
  "a timeout after send is RECONCILIATION_REQUIRED; the source returns retryable for every httpx.HTTPError including a read timeout, which risks a second charge",
  "a 409 duplicate reference is RECONCILIATION_REQUIRED, because it is evidence the first attempt landed",
  "v4 OAuth client_credentials replaces the static secret-key bearer at payment_gateway.py:61-63; there is no v3 path on either leg",
]

provider_idempotency = "Flutterwave v4 publishes an X-Idempotency-Key request header, and the connector sends the engine's DispatchRequest.idempotency_key on it verbatim. NEITHER product implementation sends any idempotency header today (verified by inventory across dotmac_erp and dotmac_sub), so this is a v4 contract adoption rather than a ported behaviour and MUST be confirmed against the live v4 header contract during the sandbox shadow before cutover. The product's opaque intent_reference is a second natural key: v4 refuses a re-used one, and that refusal is classified ambiguous because it proves the first attempt landed."

# HELD BACK, deliberately: v4 transfers/payouts. No product consumer exists.
# `tests/unit/test_flutterwave_outbound.py::test_no_transfer_or_payout_command
# _ships_in_this_release` makes adding one a visible decision rather than a
# quiet capability. That withholding is CORRECT and stays — ADR-0024 § 9
# (2026-08-24) makes it the recorded example of capability parity: completeness
# is measured against Dotmac's contracts and their substitutability, never
# against the endpoints Flutterwave happens to publish. A provider having a
# transfer endpoint is not a requirement.
#
# CORRECTED 2026-08-24, and the previous value is kept here rather than quietly
# replaced. This key read:
#
#   withheld_capabilities = ["payments.transfer.v1", "payments.payout.batch.v1"]
#
# Both ids were minted in this dossier from Flutterwave's vocabulary. Neither
# exists in the fleet. The business act ERP would command is a PAYOUT, its one
# contract is `payments.payout.v1` (already served by
# dotmac-connector-paystack), and "transfer" is this provider's wire word for
# it — ADR-0024 § 8.1 forbids a provider-shaped sibling id for an act that
# already has a contract, and ADR-0061 § 2 makes payout specifically one
# contract with no per-provider variant. A batch payout may earn its own
# contract later, but only when ERP decides batches as a unit; it is not
# created because a provider ships a batch endpoint.
#
# WHEN THIS IS IMPLEMENTED it must be `payments.payout.v1`, taking the SAME
# command payload Paystack takes — see ADR-0061 § 4 D3 for the divergence that
# has to close first (this connector requires a product-minted
# `intent_reference` and a `currency_minor_units` exponent; Paystack derives its
# reference from the engine idempotency key and refuses an exponent because its
# wire scale is fixed at 100 for every currency including zero-exponent XOF).
# Implementing payout against today's two shapes would make ERP branch on
# provider, which is the whole thing the binding exists to prevent.
#
# REFINED 2026-08-24 (ADR-0061 A2/A3, ADR-0024 §§ 10 and 12). "The divergence
# has to close first" is right; how it closes is now settled, and it is not the
# two connectors meeting halfway. The canonical command/result/observation
# schemas and their digest live on the business-owned
# `capability_registry.CapabilityContract`, and `payments.payout.v1` exposes
# only product MEANING — `submit_payout`, a PRODUCT payout reference, exact
# money, a provider-neutral destination, idempotency and correlation. Every
# provider particular is an INTERNAL step: Paystack's recipient creation, and
# this connector's direct-transfer details, are performed behind that one
# command. When this capability is implemented here, this connector derives its
# own required fields — including the `currency_minor_units` exponent it needs
# and the `intent_reference`-shaped natural key its wire wants — from the
# contract's exact money and stable reference, inside the connector. It does not
# ask a product to supply a provider-shaped field, and it does not refuse a
# command for carrying a field another provider needs.
#
# REFUND, DECIDED 2026-08-24 (ADR-0061 Amendment A8). `payments.refund.v1` is
# KEPT — it passes the same test `payments.customer.v1` failed, because a refund
# is a business act a Dotmac owner DECIDES with its own lifecycle and its own
# receivable consequence, while a provider-side customer record is a by-product
# of a charge. Its surface converges on ONE command, `request_refund`, and two
# things in `outbound.py` are the connector-side work when it does:
#   * `_refund_body` requires `provider_transaction_id` — a PROVIDER-minted
#     charge id supplied BY THE PRODUCT. That is the provider-shaped field A3
#     forbids from the other side. This connector derives the charge id, and the
#     `currency_minor_units` exponent it needs, from the contract's
#     original-payment correlation and exact money, INSIDE the connector — and
#     refuses no command for carrying a field another provider needs.
#   * a missing `amount` currently MEANS a full refund at the provider.
#     Absence-as-meaning is how a dropped key becomes "refund everything"; the
#     contract carries an explicit full-versus-partial discriminator and this
#     connector reads that instead of an absent field.
# Refund STATUS reads stay reconciliation internals, never product-visible
# actions. The refund OWNER is not Treasury by default (ADR-0061 A9).

withheld_capabilities = ["payments.payout.v1"]

