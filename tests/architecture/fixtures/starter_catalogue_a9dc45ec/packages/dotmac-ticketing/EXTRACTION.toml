contract_consumers = []
# Ordered by the adoption programme, cutover 1 first (ADR-0017's 2026-08-13
# ticketing amendment). `dotmac_academy_app` was considered and REJECTED: it has
# no ticket capability at all, so composing the module there would retire no
# local owner and prove no contract. It must not be added here later without a
# decision that says why an installation counts as adoption.
candidate_consumers = ["dotmac_erp", "dotmac_vendor_control_plane", "dotmac_sub"]
authority_boundary = "ADR-0024: each adopter installs its own lineage and owns only local workflow rows. Sub owns operational customer/subscriber/service tickets; ERP may migrate only classified internal back-office/project/employee-support tickets; Vendor CP owns vendor-support tickets. ERPNext/CRM-sourced ticket rows are archived and retired from ERP's operational schema; correlation-only expense links become opaque Integrator references and do not enter dotmac-ticketing. External connectors live in the independently deployed Integrator, never as provider branches in dotmac-ticketing or direct provider clients in ERP."
inventory_evidence = [
  "docs/inventories/ticket-sources.md",
  "docs/inventories/module-extraction-sources.md",
]
first_cutover = "ERP, by Michael's 2026-08-13 direction, which OVERRODE this field's earlier answer. It previously named the vendor control plane on greenfield-first grounds — no rows to migrate, no writer to retire, so the lineage reaches production with no cutover risk — and that reasoning is not withdrawn, it is outweighed: ERP is where the duplication actually costs something (125 files reference a ticket, behind a local status enum, categories, teams, comments and attachments), so proving the vocabulary there first stops the vendor control plane from building a greenfield surface ERP later has to bend. The trade is explicit — a contract defect is now discovered on a live support estate rather than on an empty table, and the programme inherits ERP's E8 Organization-to-Tenant gate as a HARD prerequisite, since mod_tkt's tables are tenant-scoped with RLS. The vendor control plane, cutover 2, was ALSO blocked when this was written: it is platform-only (get_platform_db at 15 sites, zero require_tenant, platform catalog tables with no tenant_id) and this module was tenant-only. Michael decided 2026-08-13 to fix that in the module rather than defer it, and ADR-0023 made 'one behaviour, explicit tenant/platform persistence planes' the fleet-wide standard for dual-plane modules. 0.1.0a1 was amended in place before release: TenantTicket/TenantTicketComment plus PlatformTicket/PlatformTicketComment, link_tenant_subject()/link_platform_subject(), and a kernel floor of 0.1.0a53 for the platform_tables declaration the live-catalog gate reads. Nullable tenant_id, a fake tenant and a polymorphic scope column were rejected and are refused by the gate. So cutover 2 is unblocked at the contract level; if E8 stalls, re-ordering to the vendor control plane is now a real option rather than a dead end. dotmac_academy_app was considered and rejected: it has no ticket capability, so installing the module there would retire no owner and prove no contract (ADR-0017 decision 1)."
shadow_and_drift = "ERP, now cutover 1, has ZERO ticket tests — the same fact that disqualified it as a source. Its parity proof must therefore be BUILT before the cutover, not ported: characterize the live status distribution and every transition ERP actually performs, map each ERP status onto a standard status plus a declared reason, and prove the mapping is total and reversible on real rows before any write moves. A cutover whose parity evidence is written after the switch is not shadow verification. Sub's transition, assignment and automation suites remain the ported parity proofs for the elements sourced from Sub. Sub additionally needs shadow verification on one knowing divergence: this module pauses the SLA clock while WAITING, whereas Sub's SLA_APPLICABLE_STATUSES treats waiting_on_customer/on_hold as clock-running. Migrating Sub will change its SLA numbers, and that must be measured before cutover rather than discovered in a breach report."
local_copy_retirement = "ERP cutover 1 retires `app/models/support/ticket.py`, `app/services/support/ticket.py`, its local status authority and every direct ticket mutation path after total status mapping, shadow parity and the sealed writer switch. Sub retires its TicketStatus enum and its six hand-written status membership sets (SLA_APPLICABLE_STATUSES, _OPEN_STATUSES, OPEN_INFRASTRUCTURE_TICKET_STATUSES, the assignment selectors, notification-template conditions, status presentation) in favour of class predicates, declaring lastmile_rerun / site_under_construction / pending_confirmation as reasons. CRM's copy is retired by its existing cutover, which should land INTO this module rather than into Sub's local owner — otherwise the fleet gains a third implementation while removing a second."
next_action = "0.1.0a1 ships the closed lifecycle, the reason registry, FOUR tables across two persistence planes (ADR-0023) and both link helpers. The release allowlist entry landed 2026-08-13, so the module is publishable; the plan is docs/superpowers/plans/2026-08-13-ticketing-erp-vendor-cp-adoption.md. To reach `adopted`: (1) publish kernel 0.1.0a53, then 0.1.0a1 against it; (2) ERP clears E8, pins the exact version, composes the mod_tkt lineage and runs it in production, retiring its local TicketStatus owner; (3) routers land, with the ticketing.use capability and the read/work/administer permission split declared in the SAME change as the guards that reference them. To reach `reuse-proven` after that: the vendor control plane exercises the same contract as cutover 2, greenfield, on a vocabulary ERP has already proven. Do NOT absorb routing policy, category taxonomies, work-order handoff or the agent workqueue — those stay product-owned."

