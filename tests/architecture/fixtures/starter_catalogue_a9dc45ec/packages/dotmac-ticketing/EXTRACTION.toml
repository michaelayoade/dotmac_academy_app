  # ticket tests, so nothing is sourced from it. Listed because the audit
  # required inventorying it, not because it supplied an implementation.
  "dotmac_erp:app/models/support/ticket.py",
  "dotmac_starter_mt:packages/dotmac-ticketing/src/dotmac_ticketing",
]
