composition_boundary = "dotmac-subscriptions, dotmac-billing, dotmac-collections, dotmac-durable-timers and dotmac-orders are peers over dotmac-kernel. No package imports a sibling. Consuming assemblies map versioned commands/events and adapt the timer port. Product-specific capability, ISP service, access, region, usage, SLA, policy and provider semantics stay in product-owned plane-specific link tables. Non-cash treatment adds no exception: the module publishes NonCashGrantOutputV1, and entitlement repair, billing-anchor advance, invoice suppression, sponsor receivable and internal expense/foregone-revenue posting remain the adopting assembly, Sub and Accounting decisions they already were."

