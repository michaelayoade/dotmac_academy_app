owner = "The reusable recurring-commercial core on explicit tenant and platform planes: stable offers, immutable offer and price versions, stable subscription contracts with immutable effective-dated versions and lines, composable cadence and calendar arithmetic, declared proration, unique replayable recurring charge occurrences with pre-tax rating provenance, and effective-dated complimentary/sponsored treatment of a contract line with append-only bounded non-cash grant evidence."

contract = "Publish immutable offer versions and price children beneath a stable offer identity; record immutable effective-dated subscription contract versions and stable line lineage; resolve half-open periods, declared proration and rate units from BillingCadence; record fingerprint-bound finite approvals not to collect a strictly positive contracted line price, resolve standard/effective/protected_drift, and record bounded append-only non-cash grants; and emit exact pre-tax RatedObligationOutputV1, money-free CommercialEntitlementProjectionV1 and exact-foregone NonCashGrantOutputV1 facts. NOT invoices, receivables, payments, settlement, allocation, tax, FX, collections policy, product access, entitlements, billing anchors, sponsor receivables, expense or foregone-revenue postings, licences, providers, usage metering, documents, or the general ledger."

