schema_version = 1
package = "dotmac-deployment-foundation"
classification = "universal-facility"
status = "adopted"
source_mode = "product-first"
owner = "Build- and deploy-time execution for a Dotmac product assembly: the versioned deployment descriptor and its refusals, the deterministic renderer for Compose/ingress/collector/alert assets, the hardened OCI image contract and its audit, the ordered deployment state machine and its gates, backup/restore and their evidence including the PostgresRecoveryBundle.v1 role-closure contract, ingress providers, telemetry resource attributes and deployment annotations, the common infrastructure alert catalogue, and the reusable conformance kit a product runs in its own CI"
contract = "Read `deploy/product.toml` as ProductDeploymentSpec.v1 or .v2, preserving v1 bytes and refusals while v2 requires typed database-catalogue coordinates whenever `[database]` exists; refuse an unknown schema, an unknown key, a secret-shaped value, a mutable image tag, a runtime role holding the migration owner material, an ingress role with no readiness probe, a role pointing liveness and readiness at one path, a websocket/SSE route with a proxy read timeout that severs it, `static = \"volume\"`, a relaxed security default with no declared exception, and a backup dataset with no checksum; RENDER deterministic Compose, Nginx, collector and alert assets from it so that `render --check` is a byte comparison a reviewer reads as a diff; BUILD an ordered deployment plan whose gate half mutates nothing, which backs up before any DDL, verifies the backup, refuses the online path for a `maintenance_required` release, gates a warm candidate on READINESS rather than a timer, and permits an image rollback only when the release's own compatibility declaration permits it; AUDIT a built image against the hardened contract; and EXPOSE all of it through the `dotmac-deploy` CLI and a conformance kit. NOT desired fleet state, deployment plans as durable records, approvals, rollout decisions, acknowledgements or drift-as-authority (those are dotmac-deployment-control); NOT normalized health observations or their projection (dotmac-platform-health); NOT log/metric/trace storage, queries, dashboards, alert delivery or operator access (the external Observability platform); NOT any in-process runtime contract, session, transaction, tenant, ORM or web framework (dotmac-kernel); and NOT any product's own topology, commands, queues, ports, hooks or domain alert rules, which stay declarative in the product's descriptor."

