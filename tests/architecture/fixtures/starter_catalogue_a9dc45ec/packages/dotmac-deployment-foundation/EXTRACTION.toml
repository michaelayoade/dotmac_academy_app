# What ERP actually runs, by references a later reader can re-read. The consumer
# count above is what pins `status`; this is what makes that claim checkable
# rather than merely true.
# Immutable coordinates only. The first version of this list cited
# `dotmac_erp:main@<sha>` plus the version that branch pinned AT THAT MOMENT,
# and it was stale within hours: ERP merged #415 and repinned. A branch tip is
# a snapshot presented as a standing fact, so the evidence now cites the merged
# pull request and its merge commit, which do not move.
adoption_evidence_schema = "v1"

composition_boundary = "ADR-0070. This package is a UNIVERSAL FACILITY and not a module: no ModuleManifest, no models, no migrations, no short_code, no migration_prefix, no tenant or business state, and therefore no MIGRATION_OWNER_LEDGER row — `check_allocation_serialized.py` exempts this classification for exactly that reason. It declares ZERO runtime dependencies: not dotmac-kernel, not SQLAlchemy, not FastAPI, not Jinja, not a YAML library. That is the same shape as dotmac-ui and it exists for the same reason — a build runner that renders a Compose file has no database and no web framework and must not acquire them in order to validate a descriptor. Rendering is explicit Python emitting text rather than a template engine, so `render --check` compares bytes. Two import-linter contracts hold the boundary in both directions: the facility imports neither the kernel nor the assembly, and no application code imports the facility. Against dotmac-deployment-control the split is WHAT versus HOW: that module owns desired state, immutable plans, approvals, rollout decisions, attempts, acknowledgements and drift-as-authority, and gains no Docker, Nginx, SSH, cloud-provider, migration, backup or monitoring implementation; this facility owns the execution of one release on one host and holds no durable fleet record. Against dotmac-platform-health the split is observation versus infrastructure: that module may own authenticated normalized health observations and their projection; this facility deploys the collectors, injects the resource attributes and emits the deployment annotations, and owns no health status. Against the external Observability platform: it owns storage, queries, dashboards, alert delivery and operator access; this facility owns the alert DEFINITIONS and the pipeline that feeds them. ADR-0062's rule that modules own metric definitions and assemblies own exporters is unchanged and this facility is the exporter-deployment half of it."

first_cutover = "dotmac_erp, and deliberately so: it holds the most defects (D1-D7 in the inventory) and therefore the most value, and it is the only product where the cutover retires a real second engine rather than filling a vacuum. The cutover is one product branch — `deploy/product.toml` plus rendered assets plus a CI conformance job — and it retires nothing until parity is proven against the existing `scripts/deploy.sh`. ADOPTED, and precisely this far. On ERP `main` at e1402902 the product declares `deploy/product.toml`, commits the rendered assets the facility produces (Compose, the Nginx vhost, the collector and the alert rules under `deploy/rendered/`), carries a `deployment-conformance` workflow whose runs pass today, and installs the published distribution in CI to run `dotmac-deploy image-audit`. The pin is the exact published 0.2.0a2, whose tag peels to 55750e10, and ERP's conformance workflow is pinned to that same revision. An earlier version of this row said 0.2.0a1; it was read at ERP main 63c59133 and was already stale when it merged, because ERP had repinned in #415. Citing a branch tip is how that happens. What is NOT yet true and must not be read into that: ERP has not deployed to a host THROUGH this facility. `scripts/deploy.sh` is still the executor and is not retired, and no environment has been cut over. The facility is adopted as declarative input and as a CI gate, not yet as the deployment engine — which is the distinction `local_copy_retirement` turns on. This row previously read 'NOT STARTED as an adoption' and forbade reading the dossier as evidence that ERP runs the facility; that was true when written and is now false."

shadow_and_drift = "There is no data to shadow — this package holds no rows and decides no business fact — so the drift that matters is between a RENDERED asset and the descriptor that produced it, and between a RUNNING deployment and the plan that was approved. Both are checkable and both are owed at composition. (1) `dotmac-deploy render --check` re-renders every asset from `deploy/product.toml` and fails on a byte difference; a product's CI runs it, so a hand-edited Compose file on a branch fails review rather than a host. (2) `dotmac-deploy drift` compares the observed image digest, the observed configuration digest and the observed product-manifest digest against the approved plan; this is the check that would have caught the host-side script drift recorded twice in `seabone-staging-dotmac-sub-deploy-landmines`, where the live `scripts/deploy.sh` was traced to a commit that was not the deployed release. (3) Every guard in this package carries an ADR-0018 sensitivity proof — a negative control proving the checker passes a conforming input, and a planted-defect case per property proving it fails a violating one. A scanner over a clean tree passes for the wrong reason otherwise, and this package is almost entirely scanners."

local_copy_retirement = "Three products hold a local engine and each retires on proven parity, never before, and never in the same change that adopts. dotmac_sub: `scripts/deploy.sh`, `deploy_production.sh`, `deploy_staging.sh`, `db_backup.sh`, `docker_image_retention.sh` and the SECOND Nginx copy at `deploy/nginx/selfcare.dotmac.io` — Sub adopts LAST because its 22-service topology and its two genuinely privileged WireGuard roles need explicit declared exceptions, and because it is the only one of the four whose engine is currently protecting a production deployment. dotmac_erp: `scripts/deploy.sh`, `scripts/backup_erp_db.sh` and `scripts/sync-static.sh`. dotmac_starter_mt: `scripts/deploy.sh`, which is a self-declared hand-port (`:4`) and is the cheapest retirement of the three because nothing depends on it. dotmac_integrator retires ONE thing and it is a narrow one: `scripts/audit_image.sh`, which `dotmac-deploy image-audit` replaces and whose sensitivity proof the replacement inherits as a parity obligation. Its Dockerfile does NOT retire — an image's system packages are product-owned declarative input under ADR-0070 § 2, so the facility supplies the contract the Dockerfile must satisfy rather than the Dockerfile itself. It has no deployment engine, backup or ingress to retire because it never had any, so the rest of its adoption is a filling rather than a replacement. RESTORE JOINS THE LIST, 2026-09-03, and it is a new KIND of obligation rather than another script: `recovery_execution.RecoveryExecutor` is the first shared thing in this facility that can perform a restore, so every product-local restore path it could displace now has a named owner to retire TOWARD. Nothing retires yet and nothing may: the executor has never run against a real cluster, and the parity gate is the same one every other row here turns on -- proven parity first, never in the change that adopts. What it displaces when that gate is met is the restore half of dotmac_sub's `db_backup.sh` and dotmac_erp's `scripts/backup_erp_db.sh`; the BACKUP half of both is untouched, because taking a backup and restoring one are different acts and this executor performs only the second. THE GENERAL RULE, because a future retirement decision will meet it here: a HALF-DISPLACED WRITER PASSES EVERY PRESENCE CHECK AND FAILS ONLY AT THE MOMENT IT IS NEEDED. A backup script whose restore half was displaced and whose backup half was retired alongside it still exists, still runs, still appears in every inventory and every 'does this exist' check -- and is discovered to be missing its other half at the one moment nobody can afford to discover it. So displacement is recorded per RESPONSIBILITY rather than per file, and a retirement claim names which responsibility it retires; a claim that names only the script is not specific enough to be true. dotmac_starter_mt and dotmac_integrator have no local restore path to retire. Recording the obligation at the moment the capability lands is deliberate: an executor that quietly acquires the ability to displace a writer, without the displacement being written down, is how a local copy survives a cutover nobody realised had superseded it. Retirement is gated per product on proven parity, never on the consumer count. This clause previously read 'nothing is retired while this package has zero contract_consumers', which stopped being the operative test the moment ERP became one: a consumer that adopts the facility as declarative input and a CI gate has proven nothing about its ability to replace an executor. ERP is the live case — it is a contract consumer and its `scripts/deploy.sh` retires no sooner for it."

next_action = "CURRENT STATE, 2026-09-05. 0.4.0a1 was built exactly once by candidate run 33920058598 from protected-main source 753a004e7f8dbab034d5d6ca565c680d931a5309 as artifact 9954731961. Its CandidateArtifact.v1 receipt never entered the repository, and #628 plus #631 changed the facility's importable source under the same version. The external-oracle candidate-window baseline therefore records both unrecorded and drifted. These bytes are not an admissible rehearsal or publication coordinate; 0.4.0a1 must not be rebuilt or published. The latest published Foundation remains 0.2.0a2. Michael has not authorized committing the old receipt, writing its disposition, or allocating a successor; those are separate lifecycle decisions. Before any successor candidate, close the Rule 49 composition gaps: exposure must cease to be a direct second execution authority, the dispatcher must retain the exact pre-observation and plan Control authorizes, one caller-held lock must cover all mutation, the Control-owned rehearsal/provocation grant must exist, Foundation's HostSource provider must bind its own artifact digest, and generic profile admission must be reached through installed artifacts. Then allocate a successor, build it once, run Lane 3 against those exact recorded bytes, publish those same bytes, cut over one application through Executor, and retire the corresponding local execution responsibility only after receipts prove replacement. ERP currently adopts this facility as descriptor input and a CI gate; scripts/deploy.sh remains its executor. No production executor or restore responsibility is retired. Historical facts remain unchanged: 0.3.0a5 is recorded superseded and publishable=false at CandidateDisposition.v1 sequence 4; 0.3.0a6 was never built and is a separate name spent by documents; recover remains absent from authorization.OPERATIONS and a Control recover authorization is refused here at AuthorizationReceipt construction before any effect."

source_mode_note = "product-first, and the qualifying sources are three rather than one. Rule 24 asks for THE qualifying production-used implementation; this surface has three disjoint ones, each mature in a different half, and taking any single one would have imported that one's defects wholesale. Sub supplies the state machine's order and its refusals and is production-used on selfcare.dotmac.io. Integrator supplies the image contract, the one-shot migration service and the readiness shape, and its `audit_image.sh` is the only test any product has for deployment behaviour. ERP supplies the migration-role preflight, backup-before-migrate and static synchronization, all production-used. What each also supplies is a defect list, recorded as eighteen numbered rows in the inventory, so that the extraction can be audited for faithfulness in both directions — what was taken and what was deliberately left. This is NOT greenfield-after-inventory: real, load-bearing, production-proven prior art exists and Starter's own script already cites Sub as the source of truth, so claiming greenfield would misrepresent the prior art as absent."

