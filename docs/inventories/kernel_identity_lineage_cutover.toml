# Every current SQLAlchemy column carrying human identity. Twenty-four contain
# `person` in their name; the three actor/assignee aliases at the end are easy
# for a name scan to miss. `strong` means a database FK currently points to
# people; `logical` means application joins/validation carry the relationship
# today. Both classes are verified at cutover. Product-human columns retain
# their names; the platform identity columns contract to the kernel spelling.

[[identity_reference]]
table = "account_tokens"
column = "person_id"
current_integrity = "strong"
disposition = "retain_person_semantics"

