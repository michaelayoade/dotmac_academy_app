    - id: ent-safe-04
      stem: "Working in a customer's home, you find that the only power socket you can use is scorched and smells burnt. What should you do?"
      type: single
      options: ["Use it anyway, since you only need it briefly", "Do not use it; report it", "Repair the socket yourself before continuing", "Cover it with insulating tape and carry on"]
      correct: ["Do not use it; report it"]
      rubric_category: application
      category: safety_awareness
      explanation: "A burnt socket is an electrical hazard and outside your scope — do not use it, and report it."
