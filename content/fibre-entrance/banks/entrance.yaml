      correct: ["Light through a glass core"]
      rubric_category: recall
      category: technical_digital
      explanation: "Fibre carries data as pulses of light travelling down a thin glass core."
      weight: 1
    - id: ent-tech-02
      stem: "A field app asks you to upload a photo of the finished installation. The upload fails with the message 'no internet connection'. What is the most sensible first step?"
      type: single
