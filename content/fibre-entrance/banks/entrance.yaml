      correct: ["Inspect the pole and your harness"]
      rubric_category: recall
      category: safety_awareness
      explanation: "The pole's condition and your fall protection must be checked before any climb begins."
      weight: 1
    - id: ent-safe-02
      stem: "Why must you never look directly into the end of a fibre or a fibre light source?"
      type: single
      options: ["It leaves the fibre dirty and permanently unusable", "Invisible laser light can damage your eyes", "It causes the fibre to snap under tension", "It voids the equipment warranty terms"]
      correct: ["Invisible laser light can damage your eyes"]
      rubric_category: recall
      category: safety_awareness
      explanation: "Fibre carries laser light you cannot see, and it can cause permanent eye injury."
      weight: 1
