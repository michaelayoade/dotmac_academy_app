    - id: ent-safe-11
      stem: "Which piece of equipment protects you specifically against falls when working at height?"
      type: single
      options: ["A fall-arrest harness and anchor", "Safety boots fitted with steel toecaps", "High-visibility outer clothing", "Cut-resistant working gloves"]
      correct: ["A fall-arrest harness and anchor"]
      rubric_category: recall
      category: safety_awareness
      explanation: "The others protect against different hazards entirely."
      weight: 1
    - id: ent-safe-12
      stem: "You arrive at a site alone and find the work needs two people to be done safely. What do you do?"
      type: single
      options: ["Stop and arrange a second person", "Do the parts that are safe alone", "Proceed carefully and take extra time", "Ask the customer to assist you briefly"]
      correct: ["Stop and arrange a second person"]
      rubric_category: application
      category: safety_awareness
      explanation: "A customer is not trained labour, and 'carefully' does not convert a two-person task."
      weight: 1
    - id: ent-safe-13
      stem: "During a splice you get isopropyl alcohol in your eye. What is the immediate action?"
      type: single
      options: ["Irrigate the eye with clean water at once", "Finish the splice, then wash it out", "Rub the eye until the stinging passes", "Apply an eye patch and drive yourself to a clinic"]
      correct: ["Irrigate the eye with clean water at once"]
      rubric_category: application
      category: safety_awareness
      explanation: "Chemical eye contact is irrigated immediately; delay and rubbing both make it worse."
      weight: 1
    - id: ent-safe-14
      stem: "A colleague is working in a way you believe is unsafe, but they are senior to you. What should you do?"
      type: single
      options: ["Raise it with them, and escalate if needed", "Say nothing, since they are more senior", "Report them afterwards without speaking up", "Copy their method, since they know best"]
      correct: ["Raise it with them, and escalate if needed"]
      rubric_category: analysis
      category: safety_awareness
      explanation: "Seniority does not suspend the duty to stop unsafe work; silence is the only unavailable option."
      weight: 1
    - id: ent-safe-15
      stem: "Why is a near miss worth reporting even though nobody was hurt?"
      type: single
      options: ["It reveals a hazard before it injures someone", "It provides a record for insurance purposes", "It demonstrates that procedures were followed", "It shows management who is being careful"]
      correct: ["It reveals a hazard before it injures someone"]
      rubric_category: analysis
      category: safety_awareness
      explanation: "The near miss and the injury share a cause; only the outcome differed, and only by luck."
      weight: 1
    - id: ent-safe-16
      stem: "You smell gas on entering a customer's property. What is the correct action?"
      type: single
      options: ["Leave, keep sources of ignition off, raise the alarm", "Open the windows and continue with the job", "Track down the source before deciding what to do next", "Switch on the lights to see the area better"]
      correct: ["Leave, keep sources of ignition off, raise the alarm"]
      rubric_category: application
      category: safety_awareness
      explanation: "Operating a light switch is itself a source of ignition; the response is to leave and raise the alarm."
      weight: 1
    - id: ent-safe-17
      stem: "Why is schedule pressure a recognised safety hazard rather than just a management problem?"
      type: single
      options: ["It makes skipping a control feel reasonable at the time", "It causes technicians to work longer than they should", "It reduces the time available for proper documentation", "It leads to disputes between supervisors and crews"]
      correct: ["It makes skipping a control feel reasonable at the time"]
      rubric_category: analysis
      category: safety_awareness
      explanation: "Pressure changes the judgement, not the risk — which is why the rules are written to be non-negotiable."
      weight: 1
    - id: ent-safe-18
      stem: "A customer insists you work in a way that breaches a safety rule, because it is quicker. What do you do?"
      type: single
      options: ["Decline, explain why, and offer the safe route", "Comply, since the customer is paying for it", "Comply but record the customer's insistence", "Leave the site without explaining anything"]
      correct: ["Decline, explain why, and offer the safe route"]
      rubric_category: analysis
      category: safety_awareness
      explanation: "A customer cannot authorise a breach, and recording their insistence does not make it safe."
      weight: 1

    # ------------------------------------------------------ technical_digital
    - id: ent-tech-01
      stem: "What does a fibre-optic cable use to carry information?"
