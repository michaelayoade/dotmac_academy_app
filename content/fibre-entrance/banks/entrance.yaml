      correct: ["Check your data or WiFi, then retry"]
      rubric_category: application
      category: technical_digital
      explanation: "The message points at connectivity, so check the phone's data or WiFi before anything else."
      weight: 1
    - id: ent-tech-03
      stem: "What is the main job of the router in a customer's home?"
      type: single
      options: ["To convert the fibre's light into an electrical signal", "To share one connection among several devices", "To store the customer's files permanently", "To supply electrical power to the ONT"]
      correct: ["To share one connection among several devices"]
      rubric_category: recall
      category: technical_digital
      explanation: "Converting the fibre's light is the ONT's job, not the router's."
      weight: 1
    - id: ent-tech-04
      stem: "Which tool would you use to confirm that light is actually arriving at the far end of a fibre?"
      type: single
      options: ["A multimeter", "An optical power meter", "A torque wrench", "A cable-tie gun"]
      correct: ["An optical power meter"]
      rubric_category: recall
      category: technical_digital
      explanation: "A multimeter measures electrical values, not light."
      weight: 1
    - id: ent-tech-05
      stem: "A customer's ONT shows a steady green PON light with no alarms, but no device in the house can reach the internet. Where is the fault MOST likely to be?"
      type: single
      options: ["In the fibre between the street and the house", "In the ISP's core network somewhere", "In the router or the home network", "In the optical splitter serving the street"]
      correct: ["In the router or the home network"]
      rubric_category: analysis
      category: technical_digital
      explanation: "A healthy ONT link shows the fibre side is fine, so the fault lies downstream of it."
      weight: 1
    - id: ent-tech-06
      stem: "In a fibre network, how can a single fibre coming from the exchange end up serving many different homes?"
      type: single
      options: ["Each home has its own fibre back to the exchange", "A splitter divides the light among several homes", "The fibre is switched between homes by hand", "Each home is given a different colour of cable"]
      correct: ["A splitter divides the light among several homes"]
      rubric_category: analysis
      category: technical_digital
      explanation: "A passive splitter shares one feeder fibre's light among multiple premises."
      weight: 1
    - id: ent-tech-07
      stem: "What does the ONT in a customer's home do?"
      type: single
      options: ["Converts the fibre's light to an electrical signal", "Shares the connection between devices", "Stores the customer's account details", "Amplifies the WiFi signal upstairs"]
      correct: ["Converts the fibre's light to an electrical signal"]
      rubric_category: recall
      category: technical_digital
      explanation: "The ONT terminates the optical network; the router shares the connection."
      weight: 1
    - id: ent-tech-08
      stem: "A red LOS light on an ONT most directly indicates:"
      type: single
      options: ["No optical signal is being received", "The customer's account is unpaid", "The WiFi password is incorrect", "The device is running too hot"]
      correct: ["No optical signal is being received"]
      rubric_category: recall
      category: technical_digital
      explanation: "LOS is loss of signal on the optical side, which is a fibre-path problem."
      weight: 1
    - id: ent-tech-09
      stem: "A customer says WiFi is fine near the router but drops at the back of the house. What is the most likely cause?"
      type: single
      options: ["Distance and walls weakening the signal", "A fault on the fibre into the property", "The ONT overheating during the day", "The account bandwidth being exceeded"]
      correct: ["Distance and walls weakening the signal"]
      rubric_category: application
      category: technical_digital
      explanation: "A problem that varies with location inside the home is a coverage problem, not a line fault."
      weight: 1
