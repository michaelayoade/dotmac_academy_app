      correct: ["Confirm it is dead before cutting it"]
      rubric_category: application
      category: safety_awareness
      explanation: "'Looks disused' is an inference, not a test. Every other option cuts first."
      weight: 1
    - id: ent-safe-09
      stem: "Halfway up a ladder you notice its footing has shifted on soft ground. What do you do?"
      type: single
      options: ["Come down and re-set the footing", "Finish quickly and then come down", "Ask a colleague to hold it steady", "Shift your weight to the firmer side"]
      correct: ["Come down and re-set the footing"]
      rubric_category: application
      category: safety_awareness
      explanation: "Every other option continues working from an unstable ladder."
      weight: 1
    - id: ent-safe-10
      stem: "You must lift a heavy drum from the vehicle on your own. What is the correct approach?"
      type: single
      options: ["Get help or use an aid — do not lift it alone", "Lift it with a straight back and your knees locked", "Lift quickly to minimise the strain", "Roll it off the tailgate onto the ground"]
      correct: ["Get help or use an aid — do not lift it alone"]
      rubric_category: application
      category: safety_awareness
      explanation: "The first control for a load beyond safe manual handling is not to handle it manually."
