      type: single
      options: ["Use it carefully, because the job is urgent", "Use it, but have someone hold it steady", "Refuse it, report it, get a safe one", "Use it only for short climbs to the eaves"]
      correct: ["Refuse it, report it, get a safe one"]
      rubric_category: application
      category: safety_awareness
      explanation: "Defective access equipment must be taken out of use and reported; schedule pressure never justifies it."
