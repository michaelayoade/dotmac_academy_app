{% extends "base.html" %}
{% block title %}Edit session — {{ cohort.name }} — Dotmac Academy{% endblock %}
{% block content %}
<p class="font-sans text-sm font-semibold uppercase tracking-[0.16em] text-brand-600">Instructor</p>
<h1 class="mt-1.5 text-3xl tracking-tight">Edit session</h1>
<p class="mt-2 text-ink-soft">
  {{ cohort.name }} · times are entered in {{ academy_tz_label }}. Rescheduling re-issues learner reminders.
</p>

<section class="card mt-6 p-5">
  <form class="grid gap-4 sm:grid-cols-2" method="post"
        action="/instructor/sessions/{{ session.id }}/edit">
    <div class="sm:col-span-2">
      <label for="e-title" class="mb-1.5 block text-sm font-semibold text-ink">Title</label>
      <input id="e-title" name="title" type="text" value="{{ session.title }}"
             class="w-full px-3.5 py-2.5 text-[0.95rem]" required>
    </div>
    <div>
      <label for="e-type" class="mb-1.5 block text-sm font-semibold text-ink">Type</label>
      <select id="e-type" name="session_type" class="w-full px-3.5 py-2.5 text-[0.95rem]">
        {% for t in session_types %}
        <option value="{{ t }}" {% if t == session.session_type %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="e-location" class="mb-1.5 block text-sm font-semibold text-ink">Location <span class="font-normal text-ink-soft">(optional)</span></label>
      <input id="e-location" name="location" type="text" value="{{ session.location or '' }}"
             class="w-full px-3.5 py-2.5 text-[0.95rem]">
    </div>
    <div>
      <label for="e-starts" class="mb-1.5 block text-sm font-semibold text-ink">Starts <span class="font-normal text-ink-soft">({{ academy_tz_label }})</span></label>
      <input id="e-starts" name="starts_at" type="datetime-local" required
             value="{{ (session.starts_at | localtime).strftime('%Y-%m-%dT%H:%M') }}"
             class="w-full px-3.5 py-2.5 text-[0.95rem]">
    </div>
    <div>
      <label for="e-ends" class="mb-1.5 block text-sm font-semibold text-ink">Ends <span class="font-normal text-ink-soft">(optional)</span></label>
      <input id="e-ends" name="ends_at" type="datetime-local"
             value="{% if session.ends_at %}{{ (session.ends_at | localtime).strftime('%Y-%m-%dT%H:%M') }}{% endif %}"
             class="w-full px-3.5 py-2.5 text-[0.95rem]">
    </div>
    <div class="sm:col-span-2">
      <label for="e-join" class="mb-1.5 block text-sm font-semibold text-ink">Join URL <span class="font-normal text-ink-soft">(http/https, optional)</span></label>
      <input id="e-join" name="join_url" type="url" value="{{ session.join_url or '' }}"
             placeholder="https://meet.example/…" class="w-full px-3.5 py-2.5 text-[0.95rem]">
    </div>
    <div class="sm:col-span-2">
      <label for="e-notes" class="mb-1.5 block text-sm font-semibold text-ink">Notes <span class="font-normal text-ink-soft">(optional)</span></label>
      <textarea id="e-notes" name="notes" rows="2" class="w-full px-3.5 py-2.5 text-[0.95rem]">{{ session.notes or '' }}</textarea>
    </div>
    <div class="sm:col-span-2 flex items-center gap-3">
      <button type="submit" class="btn-primary">Save changes</button>
      <a class="btn-secondary" href="/instructor/cohorts/{{ cohort.id }}/timetable">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
