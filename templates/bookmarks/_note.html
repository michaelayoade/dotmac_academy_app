<section id="chapter-note" class="card mt-6 p-4">
  <div class="flex items-center justify-between gap-3">
    <h2 class="text-sm font-semibold uppercase tracking-[0.14em] text-ink-soft">My notes on this chapter</h2>
    {% if saved %}<span class="text-xs font-semibold text-brand-700">Saved &#10003;</span>{% endif %}
  </div>
  <form hx-post="/bookmarks/chapters/{{ course.slug }}/{{ chapter.number }}/note"
        hx-target="#chapter-note" hx-swap="outerHTML" class="mt-3">
    <textarea name="body" rows="4" maxlength="10000"
              class="w-full rounded-lg border border-sand-300 bg-sand-50 p-3 text-sm text-ink focus:border-brand-400 focus:outline-none"
              placeholder="Private to you. Jot what you want to remember from this chapter...">{{ note.body if note else "" }}</textarea>
    <div class="mt-2 flex items-center justify-between gap-3">
      <p class="text-xs text-ink-soft">Only you can see your notes. Find them all under <a href="/bookmarks" class="font-semibold text-brand-700 hover:underline">Bookmarks &amp; notes</a>.</p>
      <button type="submit" class="btn-primary px-3.5 py-2 text-sm">Save note</button>
    </div>
  </form>
</section>
