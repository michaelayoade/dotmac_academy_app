name: D1 disposable CI image inventory
on:
  push:
    branches: [academy-d1-ci-image-profile-20261028]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres@sha256:cf5d353f55240ecc2f811827a15c7d1f2d562f08019b49dca12b5a59f4ab5962
        env:
          POSTGRES_PASSWORD: disposable_image_inventory
          POSTGRES_DB: academy_image_profile
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=libc --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      # Independent image inventory only; no Academy schema or adoption entry.
      # Official immutable source:
      # https://github.com/docker-library/repo-info/blob/1218b6a4b08f5f5be91b116f482989668710594e/repos/postgres/remote/16-bookworm.md
      - name: Inventory the preselected immutable image
        env:
          IMAGE: postgres@sha256:cf5d353f55240ecc2f811827a15c7d1f2d562f08019b49dca12b5a59f4ab5962
          SERVICE_CONTAINER_ID: ${{ job.services.db.id }}
        shell: bash
        run: |
          set -euo pipefail
          actual_id=$(docker inspect "$SERVICE_CONTAINER_ID" --format '{{.Image}}')
          expected_id=$(docker image inspect "$IMAGE" --format '{{.Id}}')
          echo "ACADEMY_IMAGE_ID=$actual_id"
          echo "ACADEMY_INSPECT_IMAGE_ID=$expected_id"
          config_id=$(docker buildx imagetools inspect "$IMAGE" --raw | jq -r .config.digest)
          echo "ACADEMY_MANIFEST_CONFIG_ID=$config_id"
          docker exec "$SERVICE_CONTAINER_ID" uname -m
          docker exec "$SERVICE_CONTAINER_ID" getconf GNU_LIBC_VERSION
          docker exec "$SERVICE_CONTAINER_ID" psql -U postgres -d academy_image_profile -v ON_ERROR_STOP=1 -Atc "SELECT json_build_object('server_version_num', current_setting('server_version_num'), 'encoding', pg_encoding_to_char(encoding), 'locale_provider', datlocprovider, 'lc_collate', datcollate, 'lc_ctype', datctype, 'collation_version', datcollversion, 'actual_collation_version', pg_database_collation_actual_version(oid)) FROM pg_database WHERE datname=current_database()"
          test "$(docker exec "$SERVICE_CONTAINER_ID" psql -U postgres -d academy_image_profile -Atc 'SHOW server_version_num')" = 160015

          test "$actual_id" = "$expected_id"
          test "$config_id" = sha256:6a35283e53fbe883da6a6ffbce8d3999dc66076cc5c4e2f1d21bdbd9e26bf86f
          # Docker image stores report either the manifest or config identity.
          case "$actual_id" in
            sha256:cf5d353f55240ecc2f811827a15c7d1f2d562f08019b49dca12b5a59f4ab5962|sha256:6a35283e53fbe883da6a6ffbce8d3999dc66076cc5c4e2f1d21bdbd9e26bf86f) ;;
            *) exit 1 ;;
          esac
