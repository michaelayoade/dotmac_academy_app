name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      db:
        image: ${{ vars.ACADEMY_RETAINED_PG_IMAGE }}
        env:
          POSTGRES_PASSWORD: academy_super
          POSTGRES_DB: academy
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      # Composed migration authority (alembic/env.py validate_migration_authority):
      # migrations run as the bootstrapped BYPASSRLS non-superuser app_admin, and
      # both the login and effective role must be declared here. The superuser
      # `postgres` DSN is refused by the composed environment. Passwords are the
      # throwaway CI-service values from scripts/initdb-roles.sql.
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_admin:app_admin@localhost:5437/academy
      MIGRATION_LOGIN_ROLE: app_admin
      MIGRATION_EFFECTIVE_ROLE: app_admin
      TEST_DATABASE_URL: postgresql+psycopg://app_user:app_user@localhost:5437/academy
      # Some modules build their engine from DATABASE_URL at import time (before the
      # conftest fixture can patch it), so it must be present in the job env too.
      DATABASE_URL: postgresql+psycopg://app_user:app_user@localhost:5437/academy
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://app_admin:app_admin@localhost:5437/academy
      # Separate disposable database: canonical-entry rehearsals must never move
      # relations in the database used by the application tests.
      KERNEL_ENTRY_DATABASE_URL: postgresql+psycopg://postgres:academy_super@localhost:5437/academy_kernel_entry
      RETAINED_SCHEMA_DATABASE_URL: postgresql+psycopg://postgres:academy_super@localhost:5437/academy_retained_schema
      RETAINED_ENVIRONMENT_DATABASE_URL: postgresql+psycopg://postgres:academy_super@localhost:5437/academy_retained_environment
      RETAINED_HISTORY_DATABASE_URL: postgresql+psycopg://postgres:academy_super@localhost:5437/academy_retained_history
      # Dedicated empty catalog databases for the hosted-only gates. Both run as
      # app_admin: the ordinary-graph supplied-connection tests and the account
      # token fresh-entry assembly revision require that exact session identity.
      ACADEMY_MIGRATION_GRAPH_DATABASE_URL: postgresql+psycopg://app_admin:app_admin@localhost:5437/academy_migration_graph
      ACCOUNT_TOKEN_FRESH_DATABASE_URL: postgresql+psycopg://app_admin:app_admin@localhost:5437/academy_account_token_fresh
      # Explicit non-secret hosted protocol declarations, before observation.
      # Three distinct disposable targets, one per purpose (environment, history,
      # assembly); scripts/declare_retained_hosted_bindings.py refuses otherwise
      # and renders ACADEMY_RETAINED_{ENVIRONMENT,HISTORY,ASSEMBLY}_BINDINGS and
      # ACADEMY_HOSTED_GENESIS_DECLARATION from these predeclared values only.
      ACADEMY_RETAINED_EXPECTED_ENVIRONMENT_TARGET_DATABASE: academy_retained_environment
      ACADEMY_RETAINED_EXPECTED_HISTORY_TARGET_DATABASE: academy_retained_history
      ACADEMY_RETAINED_EXPECTED_ASSEMBLY_TARGET_DATABASE: academy_retained_assembly
      ACADEMY_RETAINED_EXPECTED_PLATFORM: linux/amd64
      ACADEMY_RETAINED_EXPECTED_ICU_LOCALE: 'null'
      ACADEMY_RETAINED_EXPECTED_SETUP_SESSION: postgres
      ACADEMY_RETAINED_EXPECTED_ENCODING: UTF8
      ACADEMY_RETAINED_EXPECTED_LOCALE_PROVIDER: c
      ACADEMY_RETAINED_EXPECTED_LC_COLLATE: en_US.utf8
      ACADEMY_RETAINED_EXPECTED_LC_CTYPE: en_US.utf8
      ACADEMY_RETAINED_EXPECTED_EXTENSION_VERSIONS: '[ ["plpgsql", "1.0"] ]'
      # Immutable image identity and the facts of that exact image are entered as
      # typed repository variables (Settings > Variables), never guessed here:
      #   ACADEMY_RETAINED_PG_IMAGE              name@sha256:<64 hex>  (PostgreSQL 16)
      #   ACADEMY_RETAINED_PG_SERVER_VERSION_NUM e.g. 16xxxx (major*10000+minor)
      #   ACADEMY_RETAINED_PG_COLLATION_VERSION  glibc version of that image
      # An unset variable renders an empty declaration and the declare step
      # refuses (fail closed).
      ACADEMY_RETAINED_EXPECTED_SERVICE_IMAGE: ${{ vars.ACADEMY_RETAINED_PG_IMAGE }}
      ACADEMY_RETAINED_EXPECTED_SERVER_VERSION_NUM: ${{ vars.ACADEMY_RETAINED_PG_SERVER_VERSION_NUM }}
      ACADEMY_RETAINED_EXPECTED_COLLATION_VERSION: '"${{ vars.ACADEMY_RETAINED_PG_COLLATION_VERSION }}"'
      ACADEMY_RETAINED_EXPECTED_ACTUAL_COLLATION_VERSION: '"${{ vars.ACADEMY_RETAINED_PG_COLLATION_VERSION }}"'
      # Real dedicated-role evidence for lab-worker privilege tests (see
      # tests/services/test_lab_worker_privileges.py) — distinct from the
      # migration/superuser DSN above.
      TEST_LAB_WORKER_DATABASE_URL: postgresql+psycopg://academy_lab_worker:academy_lab_worker@localhost:5437/academy
      # Platform-scoped writes (e.g. admin settings) run as the platform_api role,
      # which holds INSERT/UPDATE on platform_settings; app_user is SELECT-only there.
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform_api:platform_api@localhost:5437/academy
      PLATFORM_ROOT_DOMAIN: localhost
      # `dotmac-kernel` and `dotmac-ui` are published to the private Dotmac
      # index, not PyPI, so `poetry install` needs credentials for `forgejo` in
      # pyproject.toml. Only the secret NAME appears here; the value is a repo
      # secret whose source of record is OpenBao (secret/dotmac/forgejo/read-token).
      # Same shape as dotmac_erp and dotmac_sub use.
      POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
      POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}

    steps:
      - name: Verify immutable PostgreSQL service image
        env:
          IMAGE: ${{ vars.ACADEMY_RETAINED_PG_IMAGE }}
          SERVICE_CONTAINER_ID: ${{ job.services.db.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE" =~ ^[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo 'Immutable PostgreSQL service image declaration required' >&2
            exit 1
          fi
          service_image_id=$(docker inspect "$SERVICE_CONTAINER_ID" --format '{{.Image}}')
          declared_image_id=$(docker image inspect "$IMAGE" --format '{{.Id}}')
          if [[ -z "$service_image_id" || "$service_image_id" != "$declared_image_id" ]]; then
            echo 'PostgreSQL service image does not match its declaration' >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Kernel composition observations
        uses: michaelayoade/dotmac_starter_mt/.github/actions/verify-composition-observations@8b4b6d4b42e650c47fe4c04a679a5ccb51c4b2cd
        with:
          product: academy

      # PINNED, and it must stay in step with deploy/install.sh's production
      # version check. CI owns this installation; production resolves Poetry
      # from the operator's PATH and verifies the version rather than assuming
      # a host-specific executable location.
      # Unpinned, CI floats to the latest Poetry and writes a poetry.lock the
      # host's Poetry cannot read — which fails as "pyproject.toml changed
      # significantly since poetry.lock was last generated", blaming the repo
      # rather than the toolchain. Bump both sides together or not at all.
      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install CSS build dependencies
        run: npm ci

      - name: Bootstrap DB roles
        if: '!cancelled()'
        env:
          PGPASSWORD: academy_super
        run: psql -h localhost -p 5437 -U postgres -d academy -v ON_ERROR_STOP=1 -f scripts/initdb-roles.sql

      # Cluster-level roles the Kernel outbox migrations would otherwise try to
      # CREATE; app_admin has no CREATEROLE, and a module migration must never
      # create roles. They must exist before the migration step.
      - name: Bootstrap outbox dispatcher roles
        if: '!cancelled()'
        env:
          PGPASSWORD: academy_super
        run: |
          psql -h localhost -p 5437 -U postgres -d academy -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE outbox_dispatcher LOGIN NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE platform_outbox_dispatcher LOGIN NOSUPERUSER NOBYPASSRLS;
          SQL

      # Canonical composed entry (alembic.ini): the ordinary graph has several
      # owner heads (Kernel, assembly, Learning), so `heads`, not `head`.
      - name: Run migrations
        run: poetry run python -m app.migration_cli upgrade heads

      - name: Bootstrap isolated Kernel entry rehearsal database
        if: '!cancelled()'
        env:
          PGPASSWORD: academy_super
        run: |
          psql -h localhost -p 5437 -U postgres -d academy -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE academy_kernel_entry OWNER app_admin;
          CREATE DATABASE academy_retained_schema OWNER app_admin;
          CREATE DATABASE academy_retained_environment OWNER app_admin ENCODING 'UTF8' LOCALE_PROVIDER libc LC_COLLATE 'en_US.utf8' LC_CTYPE 'en_US.utf8';
          CREATE DATABASE academy_migration_graph OWNER app_admin;
          CREATE DATABASE academy_account_token_fresh OWNER app_admin;
          CREATE DATABASE academy_retained_history OWNER app_admin ENCODING 'UTF8' LOCALE_PROVIDER libc LC_COLLATE 'en_US.utf8' LC_CTYPE 'en_US.utf8';
          SQL
          psql -h localhost -p 5437 -U postgres -d academy_kernel_entry -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE, CREATE ON SCHEMA public TO app_admin;
          SQL
          psql -h localhost -p 5437 -U postgres -d academy_retained_schema -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE, CREATE ON SCHEMA public TO app_admin;
          SQL
          psql -h localhost -p 5437 -U postgres -d academy_retained_environment -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE, CREATE ON SCHEMA public TO app_admin;
          SQL
          psql -h localhost -p 5437 -U postgres -d academy_retained_history -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE, CREATE ON SCHEMA public TO app_admin;
          SQL
          psql -h localhost -p 5437 -U postgres -d academy_migration_graph -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE, CREATE ON SCHEMA public TO app_admin;
          SQL
          psql -h localhost -p 5437 -U postgres -d academy_account_token_fresh -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE, CREATE ON SCHEMA public TO app_admin;
          SQL

      - name: Declare hosted environment expectations before profile observation
        if: '!cancelled()'
        run: poetry run python scripts/declare_retained_hosted_bindings.py

      # Each gate runs even if an earlier one failed, so a lint error can't mask a
      # broken test. The job still fails if any gate fails — you just see all of
      # them in one run instead of peeling them off one push at a time.
      - name: Lint (ruff)
        if: '!cancelled()'
        run: poetry run ruff check .

      - name: Type check (mypy)
        if: '!cancelled()'
        run: poetry run mypy

      - name: Shared UI preset and compiled CSS freshness
        if: '!cancelled()'
        run: |
          npm run build:css
          git diff --exit-code -- static/app.css

      - name: Dependency audit
        if: '!cancelled()'
        run: poetry run pip-audit

      - name: Tests
        if: '!cancelled()'
        run: poetry run pytest -x -vv --capture=tee-sys --tb=short -o faulthandler_timeout=120 -o junit_family=xunit1 --junitxml=artifacts/pytest.xml

      - name: Retain hosted rehearsal execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: academy-hosted-tests-${{ github.run_id }}
          path: artifacts/pytest.xml
          if-no-files-found: error
          retention-days: 30
