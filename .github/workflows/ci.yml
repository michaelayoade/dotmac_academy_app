name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: academy_super
          POSTGRES_DB: academy
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:academy_super@localhost:5437/academy
      TEST_DATABASE_URL: postgresql+psycopg://app_user:app_user@localhost:5437/academy
      # Some modules build their engine from DATABASE_URL at import time (before the
      # conftest fixture can patch it), so it must be present in the job env too.
      DATABASE_URL: postgresql+psycopg://app_user:app_user@localhost:5437/academy
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:academy_super@localhost:5437/academy
      # Platform-scoped writes (e.g. admin settings) run as the platform_api role,
      # which holds INSERT/UPDATE on platform_settings; app_user is SELECT-only there.
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform_api:platform_api@localhost:5437/academy
      PLATFORM_ROOT_DOMAIN: localhost
      # `dotmac-kernel` and `dotmac-ui` are published to the private Dotmac
      # index, not PyPI, so `poetry install` needs credentials for `forgejo` in
      # pyproject.toml. Only the secret NAME appears here; the value is a repo
      # secret whose source of record is OpenBao (secret/dotmac/forgejo/read-token).
      # Same shape as dotmac_erp and dotmac_sub use.
      POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
      POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PINNED, and it must stay in step with the academy production host, which
      # runs the same version from /usr/local/bin (pipx, PIPX_HOME=/opt/pipx).
      # Unpinned, CI floats to the latest Poetry and writes a poetry.lock the
      # host's Poetry cannot read — which fails as "pyproject.toml changed
      # significantly since poetry.lock was last generated", blaming the repo
      # rather than the toolchain. Bump both sides together or not at all.
      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install CSS build dependencies
        run: npm ci

      - name: Bootstrap DB roles
        env:
          PGPASSWORD: academy_super
        run: psql -h localhost -p 5437 -U postgres -d academy -v ON_ERROR_STOP=1 -f scripts/initdb-roles.sql

      - name: Run migrations
        run: poetry run alembic upgrade head

      # Each gate runs even if an earlier one failed, so a lint error can't mask a
      # broken test. The job still fails if any gate fails — you just see all of
      # them in one run instead of peeling them off one push at a time.
      - name: Lint (ruff)
        run: poetry run ruff check .

      # Positioned where a `ruff format`/`ruff format --check` step would sit
      # if this job ran one — it does not today (only `ruff check .` above),
      # so the "runs after formatting" guarantee this step exists to provide
      # is VACUOUS here: there is no format step in this job for it to
      # follow, only a place already correct for the day one is added. Do
      # not read this step's presence as proof formatting is exercised.
      #
      # Same job, same runner as any future format step — deliberately not a
      # separate job with a `needs:` edge, which would serialise the graph
      # and make unrelated jobs hostage to this one. This whole workflow file
      # carries no `paths:`/`paths-ignore:` filter (checked: `on:` above is
      # bare `push:`/`pull_request:` with no path scoping), no docs-only
      # classifier job, and no changed-files action anywhere in
      # `.github/workflows/` — so the `test` job that hosts this step is
      # never itself skipped on a docs-only change, and there is no existing
      # narrowing mechanism for this step to sit outside of.
      #
      # This step's `if:` carries exactly one kind of guard and deliberately
      # excludes the other — the two look alike in the YAML and are opposite
      # in effect, so both halves of the rule are stated together:
      #
      # * Failure-propagation guard (`if: '!cancelled()'`) — KEEP. It makes
      #   this step report even when an earlier step in this job (e.g.
      #   "Lint (ruff)") already failed. Every neighbour in this job carries
      #   it for the same reason (see the banner above "Lint (ruff)": "so a
      #   lint error can't mask a broken test"), and it applies to this step
      #   with MORE force than to theirs: this is the only step in the job
      #   that validates the artefact a docs-only pull request exists to
      #   add, so without it, a `ruff check` failure would silently skip the
      #   one diagnostic that pull request most needs. Dropping it does not
      #   change the job's PASS/FAIL outcome (the job is already red from
      #   the earlier failure either way) — it loses the diagnostic exactly
      #   when a run is already going wrong, which is the shape this whole
      #   round of fixes exists to remove.
      # * Change-scope guard (a docs-only classifier, a `paths:`/
      #   `paths-ignore:` filter, a changed-files action) — NEVER ADD. It
      #   would skip this step on exactly the pull requests that change the
      #   document under test: a sibling repository in this fleet (Sub)
      #   copied exactly this kind of guard from a neighbouring Python-lint
      #   step onto its equivalent JSON step, and it skipped the check on a
      #   pull request that changed only the composition record under
      #   `docs/`. Checked explicitly for this repository (not assumed):
      #   this whole workflow file carries no `paths:`/`paths-ignore:`
      #   filter (`on:` above is bare `push:`/`pull_request:`), no
      #   docs-only classifier job, and no changed-files action anywhere in
      #   `.github/workflows/` — so there is no existing narrowing
      #   mechanism to place this step outside of, and none should be added.
      #
      # Do not "tidy" this step's guard to match a neighbour without first
      # asking which of the two kinds above that neighbour's guard is.
      #
      # Uses only `json` and stdlib `open()` — no Poetry, no installed
      # dependency, no project virtualenv — so nothing this step needs can
      # itself be skipped by a narrowing mechanism aimed at the Python
      # toolchain.
      #
      # A second copy of this same check lives at the architecture-test
      # level (tests/architecture/test_strict_json_evidence_documents.py)
      # and is not redundant with this step: this step catches a formatter
      # that mangled a document during THIS run; the architecture test
      # catches a document that arrived already broken by any other route
      # (a hand edit, an editor's own auto-format, a bad merge) on any run,
      # including one where this CI step itself was skipped or changed.
      - name: Strict-JSON evidence documents parse
        if: '!cancelled()'
        run: |
          python3 -c "
          import json
          paths = ['docs/kernel-runtime-composition.json', 'docs/kernel-runtime-readiness.json']
          for path in paths:
              with open(path, encoding='utf-8') as handle:
                  json.load(handle)
          print(f'{len(paths)} strict-JSON evidence document(s) parse cleanly')
          "

      - name: Type check (mypy)
        if: '!cancelled()'
        run: poetry run mypy

      - name: Shared UI preset and compiled CSS freshness
        if: '!cancelled()'
        run: |
          npm run build:css
          git diff --exit-code -- static/app.css

      - name: Dependency audit
        if: '!cancelled()'
        run: poetry run pip-audit

      - name: Tests
        if: '!cancelled()'
        run: poetry run pytest -q
