name: Qualify cutover code

on:
  push:
    paths:
      - "ops/academy_cutover/**"
      - ".github/workflows/qualify-cutover-code.yml"
  pull_request:
    paths:
      - "ops/academy_cutover/**"
      - ".github/workflows/qualify-cutover-code.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academy-cutover-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked public test tools
        run: |
          python -m venv .cutover-code-venv
          .cutover-code-venv/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r ops/academy_cutover/requirements-ci.txt
      - name: Verify source byte inventory
        working-directory: ops/academy_cutover
        run: sha256sum --check SOURCE_FILES.sha256
      - name: Lint operational code and synthetic tests
        run: .cutover-code-venv/bin/ruff check --isolated --target-version py312 --line-length 120 --select E,F,W,I,B,S,RUF ops/academy_cutover
      - name: Qualify protocol and refusal behavior
        run: .cutover-code-venv/bin/python -m pytest -c ops/academy_cutover/pytest.ini --confcutdir=ops/academy_cutover/tests ops/academy_cutover/tests -q --tb=short

  native-credential-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked public test tools
        run: |
          python -m venv .native-reader-venv
          .native-reader-venv/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r ops/academy_cutover/requirements-ci.txt
      - name: Download pinned OpenBao release
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          curl -fLS --proto '=https' --tlsv1.2 --max-time 120 --max-filesize 100000000 \
            https://github.com/openbao/openbao/releases/download/v2.5.3/bao_2.5.3_Linux_x86_64.tar.gz \
            --output "$RUNNER_TEMP/native-reader.tar.gz"
      - name: Verify and safely extract OpenBao binary
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          echo '74e8ce7753ac205528f93148c47c91f417bea1ce21ddb126969bf3ef5598cadd  '"$RUNNER_TEMP/native-reader.tar.gz" | sha256sum --check --strict
          python - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          archive_path = Path(os.environ["RUNNER_TEMP"]) / "native-reader.tar.gz"
          output_dir = Path(os.environ["RUNNER_TEMP"]) / "native-reader-bin"
          output_dir.mkdir(mode=0o700)
          output_path = output_dir / "bao"

          with tarfile.open(archive_path, mode="r:gz") as archive:
              members = archive.getmembers()
              matches = [member for member in members if member.name == "bao"]
              if len(members) > 64 or len(matches) != 1:
                  raise SystemExit("release archive must contain exactly one bounded member named bao")
              member = matches[0]
              if not member.isfile() or member.issym() or member.islnk():
                  raise SystemExit("release archive member bao must be a regular file")
              if member.size <= 0 or member.size > 536870912:
                  raise SystemExit("release archive member bao has an invalid size")
              source = archive.extractfile(member)
              if source is None:
                  raise SystemExit("could not read release archive member bao")
              remaining = member.size
              with source, output_path.open("xb") as destination:
                  while remaining:
                      chunk = source.read(min(1024 * 1024, remaining))
                      if not chunk:
                          raise SystemExit("release archive member bao ended prematurely")
                      destination.write(chunk)
                      remaining -= len(chunk)
                  if source.read(1):
                      raise SystemExit("release archive member bao exceeded its declared size")
          output_path.chmod(0o700)
          PY
      - name: Verify OpenBao version
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/native-reader-bin/bao" --version | grep -F 'OpenBao v2.5.3'
      - name: Qualify native credential reader
        env:
          ACADEMY_OPENBAO_NATIVE: ${{ runner.temp }}/native-reader-bin/bao
        run: .native-reader-venv/bin/python -m pytest -c ops/academy_cutover/pytest.ini --confcutdir=ops/academy_cutover/qualification ops/academy_cutover/qualification/native_credential_reader.py ops/academy_cutover/qualification/test_credential_reader_transport.py -q --tb=short --junitxml=artifacts/native-credential-reader.xml
      - name: Upload native credential reader results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-credential-reader-${{ github.sha }}
          path: artifacts/native-credential-reader.xml
          retention-days: 7
          if-no-files-found: error

  private-reader-composition:
    runs-on: ubuntu-24.04
    needs: [qualify, native-credential-reader]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire immutable private synthetic composition sources
        env:
          ACADEMY_WEBFIG_FIXTURE_SSH_KEY: ${{ secrets.ACADEMY_WEBFIG_FIXTURE_SSH_KEY }}
        run: python -I -S -B ops/academy_cutover/qualification/acquire_private_composition.py
      - name: Qualify private synthetic composition without rendering source
        run: >-
          env -i PATH="$PATH" CI=true GITHUB_ACTIONS=true
          python -I -S -B ops/academy_cutover/qualification/run_private_composition.py
          --directory "$RUNNER_TEMP/private-reader-composition"
