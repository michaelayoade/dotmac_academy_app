name: Genesis PostgreSQL build input preparation
on:
  push:
    paths:
      - 'ci/postgres_genesis/prepare_build_inputs.py'
      - 'ci/postgres_genesis/acquire_build_inputs.sh'
      - 'ci/postgres_genesis/inspect_build_source.py'
      - 'ci/postgres_genesis/build-inputs-lock.json'
      - '.github/workflows/genesis-postgres-build-inputs.yml'
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Acquire authenticated dependencies and inventory source offline
        run: python3 ci/postgres_genesis/prepare_build_inputs.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: academy-genesis-build-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci/postgres_genesis/build-input-artifacts/
          retention-days: 30
          if-no-files-found: warn
