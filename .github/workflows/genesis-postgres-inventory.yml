name: Genesis PostgreSQL public inventory
on:
  push:
    paths:
      - 'ci/postgres_genesis/**'
      - '.github/workflows/genesis-postgres-inventory.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inventory public immutable image and source inputs
        run: python3 ci/postgres_genesis/inventory.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: academy-genesis-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci/postgres_genesis/artifacts/
          retention-days: 30
          if-no-files-found: warn
