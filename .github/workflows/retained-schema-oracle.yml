name: Frozen retained schema oracle (unqualified)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/retained-schema-oracle.yml
      - app/maintenance/retained_schema.py
      - tests/test_academy_retained_schema.py

permissions:
  contents: read

jobs:
  frozen-source-catalog:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: academy_super
          POSTGRES_DB: academy
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE: a5ffe6316e97bf33e17ef9c1f00788796f5e5a5a
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:academy_super@localhost:5437/academy
      TEST_DATABASE_URL: postgresql+psycopg://app_user:app_user@localhost:5437/academy
      DATABASE_URL: postgresql+psycopg://app_user:app_user@localhost:5437/academy
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:academy_super@localhost:5437/academy
      KERNEL_ENTRY_DATABASE_URL: postgresql+psycopg://postgres:academy_super@localhost:5437/academy_kernel_entry
      TEST_LAB_WORKER_DATABASE_URL: postgresql+psycopg://academy_lab_worker:academy_lab_worker@localhost:5437/academy
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform_api:platform_api@localhost:5437/academy
      PLATFORM_ROOT_DOMAIN: localhost
      POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
      POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind execution to the immutable baseline and reviewed head
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_PR_HEAD"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify the unchanged baseline composition observations
        uses: michaelayoade/dotmac_starter_mt/.github/actions/verify-composition-observations@8b4b6d4b42e650c47fe4c04a679a5ccb51c4b2cd
        with:
          product: academy
      - name: Install the baseline Poetry and locked dependencies
        run: |
          pipx install poetry==2.4.1
          poetry install --no-interaction --no-root
      - name: Bootstrap disposable database roles and isolated replay database
        env:
          PGPASSWORD: academy_super
        run: |
          psql -h localhost -p 5437 -U postgres -d academy -v ON_ERROR_STOP=1 -f scripts/initdb-roles.sql
          poetry run alembic upgrade head
          psql -h localhost -p 5437 -U postgres -d academy -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE academy_kernel_entry OWNER app_admin;
          CREATE ROLE outbox_dispatcher LOGIN NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE platform_outbox_dispatcher LOGIN NOSUPERUSER NOBYPASSRLS;
          SQL
          psql -h localhost -p 5437 -U postgres -d academy_kernel_entry -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE, CREATE ON SCHEMA public TO app_admin;
          SQL
      - name: Run actual frozen-source catalog and planted-drift canaries
        id: retained_tests
        run: |
          mkdir -p artifacts
          poetry run pytest tests/test_academy_retained_schema.py -vv \
            --capture=tee-sys --tb=short -o faulthandler_timeout=120 \
            -o junit_family=xunit1 --basetemp=artifacts/retained-schema-replay \
            --junitxml=artifacts/retained-schema.xml
      - name: Bind the catalog-only artifact to its actual source execution
        if: ${{ !cancelled() }}
        env:
          PYTEST_OUTCOME: ${{ steps.retained_tests.outcome }}
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          def git(*args):
              return subprocess.run(('git', *args), check=True, capture_output=True).stdout.decode().strip()

          paths = sorted(Path('artifacts/retained-schema-replay').rglob('frozen62-retained-catalog-source-only.json'))
          if len(paths) != 1:
              raise SystemExit('expected one actual frozen-source catalog artifact')
          data = paths[0].read_bytes()
          if len(data) > 1048576:
              raise SystemExit('catalog artifact exceeds source bound')
          catalog = json.loads(data)
          if os.environ['PYTEST_OUTCOME'] not in ('success', 'failure'):
              raise SystemExit('no completed actual pytest execution')
          if catalog.get('admission_authority') is not False:
              raise SystemExit('catalog packet must carry no admission authority')
          packet = {
              'schema_version': 1,
              'kind': 'unqualified_frozen62_retained_catalog_oracle',
              'admission_authority': False,
              'pytest_outcome': os.environ['PYTEST_OUTCOME'],
              'expected_base': os.environ['EXPECTED_BASE'],
              'pr_head_sha': os.environ['EXPECTED_PR_HEAD'],
              'checkout_sha': git('rev-parse', 'HEAD'),
              'checkout_tree': git('rev-parse', 'HEAD^{tree}'),
              'checkout_parents': git('rev-list', '--parents', '-n', '1', 'HEAD').split()[1:],
              'catalog_bytes': len(data),
              'catalog_sha256': hashlib.sha256(data).hexdigest(),
              'catalog_base64': base64.b64encode(data).decode('ascii'),
          }
          encoded = json.dumps(packet, ensure_ascii=True, separators=(',', ':'))
          Path('artifacts/retained-schema-oracle.json').write_text(encoded + '\n')
          if len(encoded.encode('ascii')) <= 196608:
              print('BEGIN_UNQUALIFIED_FROZEN_RETAINED_CATALOG')
              print(encoded)
              print('END_UNQUALIFIED_FROZEN_RETAINED_CATALOG')
          else:
              print('Bound catalog packet retained as artifact; exceeds inline review bound')
          PY
      - name: Retain actual replay and catalog evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unqualified-frozen-retained-catalog-${{ github.run_id }}
          path: |
            artifacts/retained-schema.xml
            artifacts/retained-schema-oracle.json
            artifacts/retained-schema-replay/**/frozen62-retained-catalog-source-only.json
          if-no-files-found: error
          retention-days: 30
